<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concurso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --board: #F5F1FF; --board-line: #EDE6FF;
    --paper: #FFFFFF; --paper-line: #EBE3FB;
    --ink: #362F52; --ink-muted: #8E86AC;
    --chalk-amber: #FFC857; --pen-red: #FF6F91; --pen-green: #4CD98A;
    --primary: #7C6FF0; --primary-dark: #6C5CE7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(135deg, #F5F1FF 0%, #FDECF5 50%, #EAF6FF 100%);
    font-family: 'Nunito', sans-serif; color: var(--ink);
    display: flex; justify-content: center; padding: 32px 16px;
  }
  .sheet { background: var(--paper); width: 100%; max-width: 480px; border-radius: 24px; padding: 32px 28px; box-shadow: 0 16px 40px rgba(124,111,240,0.18); align-self: flex-start; }
  .sheet.ancho { max-width: 680px; }
  h1 { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 26px; margin: 0 0 4px; }
  h2 { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 18px; margin: 0 0 10px; }
  .subtitle { color: var(--ink-muted); font-size: 14px; margin: 0 0 20px; font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--ink-muted); margin: 12px 0 4px; font-weight: 700; }
  input, select, textarea {
    width: 100%; padding: 11px 14px; border: 2px solid var(--paper-line); border-radius: 12px;
    background: #FBFAFF; font-size: 15px; font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); }
  button { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; border: none; border-radius: 14px; padding: 12px 18px; }
  button:active { transform: scale(0.98); }
  .btn-primary { background: linear-gradient(135deg, #8B7EF7, #6C5CE7); color: #fff; width: 100%; margin-top: 16px; box-shadow: 0 6px 16px rgba(108,92,231,0.3); }
  .btn-outline { background: #fff; border: 2px solid var(--paper-line); color: var(--ink); width: 100%; margin-top: 10px; }
  .btn-outline:hover { border-color: var(--primary); }
  .btn-small { background: var(--chalk-amber); color: var(--ink); font-size: 13px; padding: 8px 14px; }
  .btn-danger { background: #FFE4E9; color: var(--pen-red); font-size: 13px; padding: 8px 14px; }
  .btn-link { background: none; color: var(--primary); text-decoration: underline; font-family: 'Nunito'; font-weight: 700; font-size: 13px; padding: 6px 0; width: 100%; text-align: center; }
  .error { color: var(--pen-red); font-size: 13px; margin-top: 10px; min-height: 16px; font-weight: 700; }
  .ok-msg { color: #2FAE6C; font-size: 13px; margin-top: 8px; font-weight: 700; }
  .card { border: 2px solid var(--paper-line); border-radius: 16px; padding: 16px; margin-top: 12px; }
  .item-lista { border: 2px solid var(--paper-line); border-radius: 14px; padding: 12px 14px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 800; }
  .badge.vivo { background: #FFE4E9; color: var(--pen-red); }
  .badge.plazo { background: #EDE9FE; color: var(--primary); }
  .badge.armado { background: #F1EEFB; color: var(--ink-muted); }
  .badge.esperando { background: #FFF7ED; color: #EA580C; }
  .badge.en_curso { background: #E6FBF0; color: #2FAE6C; }
  .badge.finalizado { background: #F1EEFB; color: var(--ink-muted); }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13.5px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--paper-line); }
  .check-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--paper-line); }
  .check-row input[type="checkbox"] { width: auto; }
  .check-row input[type="number"] { width: 60px; padding: 6px 8px; }
  .check-row .texto { flex: 1; font-size: 13.5px; }
  .pos-1 { background: linear-gradient(135deg,#FFF3D6,#FFE7A8); }
  .pos-2 { background: #F1EEFB; }
  .pos-3 { background: #FFEFE5; }
  .fila-pos { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; margin-top: 8px; font-weight: 700; }
  .fila-pos .num { font-family: 'Baloo 2', sans-serif; font-size: 18px; width: 28px; }
  .fila-pos .nombre { flex: 1; }
  .fila-pos .pts { color: var(--primary); }
  .option { display: block; width: 100%; text-align: left; background: #FBFAFF; border: 2px solid var(--paper-line); border-radius: 14px; padding: 13px 16px; margin-bottom: 10px; font-weight: 700; font-size: 15px; cursor: pointer; }
  .option.selected { border-color: var(--primary); }
  .option.correct { border-color: var(--pen-green); background: #E6FBF0; }
  .option.incorrect { border-color: var(--pen-red); background: #FFE4E9; }
  .option:disabled { cursor: default; }
  .feedback { font-size: 14px; font-weight: 800; margin: 10px 0; padding: 10px 14px; border-radius: 10px; }
  .feedback.correct { color: #2FAE6C; background: #E6FBF0; }
  .feedback.incorrect { color: #E14D72; background: #FFE4E9; }
  .hidden { display: none; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .contador-grande { font-family: 'Baloo 2', sans-serif; font-size: 40px; font-weight: 800; color: var(--primary); text-align: center; margin: 10px 0; }

  .acc { border: 2px solid var(--paper-line); border-radius: 16px; margin-top: 12px; overflow: hidden; }
  .acc-head { display: flex; align-items: center; gap: 10px; width: 100%; background: #FBFAFF; padding: 12px 14px; font-weight: 800; font-size: 15px; text-align: left; color: var(--ink); font-family: 'Nunito', sans-serif; border: none; border-radius: 0; cursor: pointer; }
  .acc-head .acc-sum { margin-left: auto; font-size: 12px; color: var(--ink-muted); font-weight: 700; }
  .acc-head .acc-arrow { transition: transform .2s; }
  .acc.open .acc-arrow { transform: rotate(180deg); }
  .acc.open .acc-head { background: var(--board-line); }
  .acc-head input[type="checkbox"] { width: auto; pointer-events: none; }
  .acc-body { display: none; padding: 4px 14px 14px; }
  .acc.open .acc-body { display: block; }
  .av { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--board-line); overflow: hidden; flex-shrink: 0; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
  .avatar-option { aspect-ratio: 1; border-radius: 12px; border: 2px solid var(--paper-line); background: #fff; font-size: 20px; padding: 0; display: flex; align-items: center; justify-content: center; }
  .avatar-option.selected { border-color: var(--primary); background: var(--board-line); }
  .file-btn { display: block; text-align: center; margin-top: 10px; padding: 9px; border: 2px dashed var(--paper-line); border-radius: 12px; font-weight: 800; font-size: 13px; color: var(--primary); cursor: pointer; }
  .sala-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
  .sala-item { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 78px; font-size: 12px; font-weight: 800; text-align: center; word-break: break-word; }
  .reloj { font-family: 'Baloo 2', sans-serif; font-size: 34px; font-weight: 800; text-align: center; color: var(--primary); margin: 4px 0 10px; }
  .reloj.urgente { color: var(--pen-red); }
</style>
</head>

<script type="module">

function sanitizarUsuario(u) { return (u || '').trim().toLowerCase().replace(/[^a-z0-9._-]/g, ''); }
function decirEnVoz(texto) {
  try {
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(texto);
    utterance.lang = 'es-ES';
    utterance.volume = 1;
    utterance.rate = 1;
    speechSynthesis.speak(utterance);
  } catch (e) { }
}
function anchoSheet(ancho) { document.getElementById('app').className = ancho ? 'sheet ancho' : 'sheet'; }


// ---------------- Utilidades: canal/polling, avatares, actualizar concurso ----------------
function cerrarCanal() {
  if (state.canal) { supabase.removeChannel(state.canal); state.canal = null; }
  if (state.poll) { clearInterval(state.poll); state.poll = null; }
  if (state.pollSala) { clearInterval(state.pollSala); state.pollSala = null; }
  if (state.relojTick) { clearInterval(state.relojTick); state.relojTick = null; }
  if (state.pollTabla) { clearInterval(state.pollTabla); state.pollTabla = null; }
}
const AVATARES = ['😀','😎','🤓','🥳','🦁','🐱','🐶','🦊','🐼','🐸','🦄','🐵','👑','⭐','🚀','🎮','⚽','🎨','📚','🧠','💡','🔥','🌟','🍀','🎯','🐨','🐯','🦋','🐢','🌈'];
const RE_IMG_AVATAR = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/;
function avatarHtml(av, size = 36) {
  const s = `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.55)}px;`;
  if (av && RE_IMG_AVATAR.test(av)) return `<span class="av" style="${s}"><img src="${av}" alt=""></span>`;
  return `<span class="av" style="${s}">${av ? escC(av) : '🙂'}</span>`;
}
function reducirImagen(file, lado = 96) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const min = Math.min(img.width, img.height);
      const cv = document.createElement('canvas'); cv.width = lado; cv.height = lado;
      cv.getContext('2d').drawImage(img, (img.width - min) / 2, (img.height - min) / 2, min, min, 0, 0, lado, lado);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}
function selectorAvatarHtml(id, actual, permitirImagen) {
  return `<div id="${id}">
    <div style="text-align:center;" id="${id}Prev">${avatarHtml(actual, 64)}</div>
    <div class="avatar-grid">${AVATARES.map(a => `<button type="button" class="avatar-option ${a === actual ? 'selected' : ''}" data-emoji="${a}">${a}</button>`).join('')}</div>
    ${permitirImagen ? `<label class="file-btn">📷 Subir mi imagen<input type="file" accept="image/*" id="${id}File" hidden></label>` : ''}
    <div class="error" id="${id}Err"></div>
  </div>`;
}
function activarSelectorAvatar(id, onChange) {
  const raiz = document.getElementById(id);
  raiz.querySelectorAll('.avatar-option').forEach(b => b.onclick = () => {
    raiz.querySelectorAll('.avatar-option').forEach(x => x.classList.remove('selected'));
    b.classList.add('selected');
    document.getElementById(id + 'Prev').innerHTML = avatarHtml(b.dataset.emoji, 64);
    onChange(b.dataset.emoji);
  });
  const f = document.getElementById(id + 'File');
  if (f) f.onchange = async () => {
    if (!f.files[0]) return;
    try {
      const dataUrl = await reducirImagen(f.files[0], 96);
      raiz.querySelectorAll('.avatar-option').forEach(x => x.classList.remove('selected'));
      document.getElementById(id + 'Prev').innerHTML = avatarHtml(dataUrl, 64);
      onChange(dataUrl);
    } catch (e) { document.getElementById(id + 'Err').textContent = e.message; }
  };
}
async function guardarAvatarParticipante(av) {
  if (state.estudiante) {
    state.estudiante.avatar = av;
    await supabase.from('estudiantes').update({ avatar: av }).eq('id', state.estudiante.id);
  } else state.avatar = av;
  if (!state.participante) return true;
  const { error } = await supabase.rpc('actualizar_avatar_participante', {
    p_participante_id: state.participante.id, p_token: String(state.participante.token_sesion), p_avatar: av
  });
  if (error) console.warn('Avatar no guardado en el concurso:', error.message);
  return !error;
}
// Reloj del servidor: todos los alumnos y el profesor cuentan el tiempo con la misma hora
async function sincronizarReloj() {
  if (state.offsetMs != null) return;
  const t0 = Date.now();
  const { data, error } = await supabase.rpc('hora_servidor');
  const t1 = Date.now();
  state.offsetMs = (!error && data) ? Date.parse(data) + (t1 - t0) / 2 - t1 : 0;
}
const ahoraServidor = () => Date.now() + (state.offsetMs || 0);
// Lee el estado del concurso (con columnas de modo automático si existen)
async function traerFilaConcurso(id) {
  if (!state.sinColsAuto) {
    const r = await supabase.from('concursos').select('id, estado, pregunta_actual_index, avance_auto, pregunta_inicio, tiempo_por_pregunta_seg').eq('id', id).maybeSingle();
    if (!r.error) return r.data;
    if (/column|avance_auto|pregunta_inicio/i.test(r.error.message)) state.sinColsAuto = true; else return null;
  }
  const r2 = await supabase.from('concursos').select('id, estado, pregunta_actual_index').eq('id', id).maybeSingle();
  return r2.data;
}
// Actualiza el concurso y VERIFICA que realmente cambió (antes los errores se ignoraban en silencio)
async function actualizarConcurso(id, campos) {
  const { data, error } = await supabase.from('concursos').update(campos).eq('id', id).select('id, estado, pregunta_actual_index');
  if (!error && data && data.length) return true;
  const { error: e2 } = await supabase.rpc('concurso_cambiar_estado', {
    p_concurso_id: id, p_estado: campos.estado ?? null, p_index: campos.pregunta_actual_index ?? null,
    p_auto: campos.avance_auto ?? null, p_seg: campos.tiempo_por_pregunta_seg ?? null, p_reiniciar: !!campos.pregunta_inicio
  });
  if (!e2) return true;
  console.error('Fallo al actualizar concurso', error, e2);
  alert('No se pudo actualizar el concurso.\n\n' +
    (error ? error.message : 'La base de datos no permitió el cambio (permisos / RLS).') +
    '\n\nEjecuta el archivo cambios_quiz_vivo.sql en el SQL Editor de Supabase.');
  return false;
}

let state = {
  perfil: null, estudiante: null, alias: null, grupoId: null,
  concurso: null, participante: null, preguntas: [], index: 0,
  inicioPregunta: null, canal: null, cronometro: null, poll: null, pollSala: null, avatar: null, relojTick: null, pollTabla: null, offsetMs: null, terminado: false, sinColsAuto: false
};

async function init() {
  const idDirecto = new URLSearchParams(window.location.search).get('unirse');
  if (idDirecto) { await renderUnionDirecta(idDirecto); return; }

  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    const { data: perfil } = await supabase.from('perfiles').select('id, rol, usuario').eq('id', session.user.id).single();
    state.perfil = perfil;
    if (perfil.rol === 'admin' || perfil.rol === 'profesor') { renderProfesorHome(); return; }
    const { data: estudiante } = await supabase.from('estudiantes').select('id, nombre, grupo_id, avatar').eq('perfil_id', session.user.id).maybeSingle();
    if (estudiante) { state.estudiante = estudiante; state.grupoId = estudiante.grupo_id; renderListaConcursosAlumno(); return; }
  }
  renderPortada();
}

async function renderUnionDirecta(concursoId) {
  anchoSheet(false);
  const { data: concurso, error } = await supabase.from('concursos').select('*').eq('id', concursoId).maybeSingle();
  if (error || !concurso) { app.innerHTML = `<h1>Enlace inválido</h1><p class="subtitle">Este concurso ya no existe.</p>`; return; }
  if (!['esperando', 'en_curso'].includes(concurso.estado)) {
    app.innerHTML = `<h1>${concurso.titulo}</h1><p class="subtitle">Este concurso todavía no está abierto para unirse, o ya terminó. Avísale al profesor.</p>`;
    return;
  }

  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    const { data: estudiante } = await supabase.from('estudiantes').select('id, nombre, grupo_id, avatar').eq('perfil_id', session.user.id).maybeSingle();
    if (estudiante) {
      state.estudiante = estudiante;
      app.innerHTML = `<h1>${concurso.titulo}</h1><p class="subtitle">Entrar como ${estudiante.nombre}</p><button class="btn-primary" id="unirseBtn">Unirme ahora</button>`;
      document.getElementById('unirseBtn').onclick = () => unirseAConcurso(concurso);
      return;
    }
  }

  if (!concurso.permite_invitados) {
    app.innerHTML = `<h1>${concurso.titulo}</h1><p class="subtitle">Este concurso solo admite alumnos con cuenta. Inicia sesión primero.</p><button class="btn-primary" id="loginBtn">Iniciar sesión</button>`;
    document.getElementById('loginBtn').onclick = renderLoginAlumno;
    return;
  }

  app.innerHTML = `
    <h1>${concurso.titulo}</h1>
    <p class="subtitle">Escribe tu nombre para unirte</p>
    <label>Tu nombre o alias</label><input type="text" id="alias" placeholder="Ej: Lucas">
    <label>Tu avatar (elige uno o sube una imagen)</label>
    ${selectorAvatarHtml('selAvInv', state.avatar, true)}
    <button class="btn-primary" id="unirseBtn">Unirme</button>
    <div class="error" id="err"></div>
  `;
  activarSelectorAvatar('selAvInv', av => { state.avatar = av; });
  document.getElementById('unirseBtn').onclick = () => {
    const alias = document.getElementById('alias').value.trim();
    if (!alias) { document.getElementById('err').textContent = 'Escribe un nombre o alias.'; return; }
    state.alias = alias;
    unirseAConcurso(concurso);
  };
}

function renderPortada() {
  anchoSheet(false);
  app.innerHTML = `
    <h1>🏆 Concurso</h1>
    <p class="subtitle">Un quiz en vivo o contrarreloj para todo el grupo.</p>
    <button class="btn-primary" id="btnProfesor">Soy profesor</button>
    <button class="btn-outline" id="btnAlumno">Unirme a un concurso</button>
  `;
  document.getElementById('btnProfesor').onclick = renderLoginProfesor;
  document.getElementById('btnAlumno').onclick = renderEntradaAlumno;
}

// ====================================================================
// LOGIN PROFESOR
// ====================================================================
function renderLoginProfesor() {
  anchoSheet(false);
  app.innerHTML = `
    <h1>Panel del profesor</h1>
    <p class="subtitle">Inicia sesión con tu cuenta habitual.</p>
    <label>Usuario</label><input type="text" id="usuario" autocomplete="username">
    <label>Contraseña</label><input type="password" id="password" autocomplete="current-password">
    <button class="btn-primary" id="loginBtn">Entrar</button>
    <button class="btn-link" id="volverBtn">Volver</button>
    <div class="error" id="err"></div>
  `;
  document.getElementById('volverBtn').onclick = renderPortada;
  document.getElementById('loginBtn').onclick = async () => {
    const usuario = sanitizarUsuario(document.getElementById('usuario').value);
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('err');
    const { data: emailReal } = await supabase.rpc('obtener_email_por_usuario', { p_usuario: usuario });
    if (!emailReal) { errEl.textContent = 'Usuario o contraseña incorrectos.'; return; }
    const { error } = await supabase.auth.signInWithPassword({ email: emailReal, password });
    if (error) { errEl.textContent = 'Usuario o contraseña incorrectos.'; return; }
    const { data: { user } } = await supabase.auth.getUser();
    const { data: perfil } = await supabase.from('perfiles').select('id, rol, usuario').eq('id', user.id).single();
    if (perfil.rol !== 'admin' && perfil.rol !== 'profesor') { errEl.textContent = 'Esta cuenta no es de profesor.'; await supabase.auth.signOut(); return; }
    state.perfil = perfil;
    renderProfesorHome();
  };
}

// ENTRADA ALUMNO / INVITADO
// ====================================================================
function renderEntradaAlumno() {
  anchoSheet(false);
  app.innerHTML = `
    <h1>Unirme a un concurso</h1>
    <p class="subtitle">¿Ya tienes cuenta de alumno?</p>
    <button class="btn-primary" id="btnTengoCuenta">Sí, iniciar sesión</button>
    <button class="btn-outline" id="btnInvitado">No, entrar como invitado</button>
    <button class="btn-link" id="volverBtn">Volver</button>
  `;
  document.getElementById('volverBtn').onclick = renderPortada;
  document.getElementById('btnTengoCuenta').onclick = renderLoginAlumno;
  document.getElementById('btnInvitado').onclick = renderEntradaInvitado;
}

function renderLoginAlumno() {
  anchoSheet(false);
  app.innerHTML = `
    <h1>Inicia sesión</h1>
    <label>Usuario</label><input type="text" id="usuario" autocomplete="username">
    <label>Contraseña</label><input type="password" id="password" autocomplete="current-password">
    <button class="btn-primary" id="loginBtn">Entrar</button>
    <button class="btn-link" id="volverBtn">Volver</button>
    <div class="error" id="err"></div>
  `;
  document.getElementById('volverBtn').onclick = renderEntradaAlumno;
  document.getElementById('loginBtn').onclick = async () => {

    const { error } = await supabase.auth.signInWithPassword({ email: emailReal, password });

async function unirseAConcurso(concurso) {
  const alias = state.estudiante ? state.estudiante.nombre : state.alias;
  const avatar = state.estudiante ? (state.estudiante.avatar || null) : (state.avatar || null);
  const fila = { concurso_id: concurso.id, estudiante_id: state.estudiante ? state.estudiante.id : null, alias };
  let r = await supabase.from('concurso_participantes').insert({ ...fila, avatar }).select('*').single();
  if (r.error && /avatar/i.test(r.error.message)) r = await supabase.from('concurso_participantes').insert(fila).select('*').single(); // columna aún no creada
  if (r.error) { alert('No se pudo unir: ' + r.error.message); return; }
  state.concurso = concurso;
  state.participante = r.data;
  state.terminado = false;
  if (concurso.modo === 'vivo') renderSalaEsperaAlumno();
  else renderPantallaEmpezarPlazo();
}

// ---------------- Modo vivo: sala de espera del alumno ----------------
function renderSalaEsperaAlumno() {
  anchoSheet(false);
  sincronizarReloj();
  const esCuenta = !!state.estudiante;
  const nombre = esCuenta ? state.estudiante.nombre : state.alias;
  const miAvatar = () => esCuenta ? state.estudiante.avatar : state.avatar;
  app.innerHTML = `
    <h1>🕒 ${escC(state.concurso.titulo)}</h1>
    <p class="subtitle">Esperando a que el profesor inicie el concurso...</p>
    <div class="card" style="text-align:center;">
      <div id="miAvatarBox">${avatarHtml(miAvatar(), 72)}</div>
      <p style="font-weight:800; margin:6px 0;">${escC(nombre)}</p>
      <p class="subtitle" id="avatarAviso" style="margin:0 0 8px;">${miAvatar() ? '' : 'Aún no tienes avatar. ¡Elige uno para que el profesor te vea!'}</p>
      <button class="btn-small" id="cambiarAvatarBtn" type="button">🎭 ${miAvatar() ? 'Cambiar avatar' : 'Elegir avatar'}</button>
      <div id="avatarPanel" class="hidden" style="text-align:left; margin-top:10px;">
        ${selectorAvatarHtml('selAvSala', miAvatar(), !esCuenta)}
        <button class="btn-small" id="guardarAvatarBtn" type="button" style="margin-top:10px;">Guardar avatar</button>
      </div>
    </div>
    <div class="card" style="text-align:center;">
      <p style="font-weight:800; font-size:15px;">Ya estás dentro. No cierres esta pantalla.</p>
      <p class="subtitle" id="estadoSala" style="margin:6px 0 0;">Conectado ✔</p>
    </div>
  `;
  let nuevoAvatar = miAvatar();
  document.getElementById('cambiarAvatarBtn').onclick = () => document.getElementById('avatarPanel').classList.toggle('hidden');
  activarSelectorAvatar('selAvSala', av => { nuevoAvatar = av; });
  document.getElementById('guardarAvatarBtn').onclick = async () => {
    if (!nuevoAvatar) return;
    const ok = await guardarAvatarParticipante(nuevoAvatar);
    document.getElementById('miAvatarBox').innerHTML = avatarHtml(nuevoAvatar, 72);
    document.getElementById('avatarAviso').textContent = ok ? '¡Avatar guardado!' : 'Avatar elegido, pero el profesor aún no puede verlo (falta ejecutar el SQL).';
    document.getElementById('avatarPanel').classList.add('hidden');
  };

  let arrancado = false;
  const arrancar = async (fila) => {
    if (arrancado) return;
    state.concurso = { ...state.concurso, ...fila };
    if (fila.estado === 'finalizado') { arrancado = true; renderTablaPosicionesAlumno(); return; }
    if (fila.estado !== 'en_curso') return;
    arrancado = true;
    await cargarPreguntasConcurso();
    if (!state.preguntas.length) {
      arrancado = false; // se reintenta en el siguiente ciclo
      const el = document.getElementById('estadoSala');
      if (el) el.textContent = '⚠️ El concurso inició pero no se pudieron cargar las preguntas. Reintentando...';
      return;
    }
    state.index = fila.pregunta_actual_index || 0;
    renderPreguntaConcursoVivo();
  };
  suscribirseAConcurso(p => arrancar(p.new));
}

function suscribirseAConcurso(onChange) {
  cerrarCanal();
  const id = state.concurso.id;
  state.canal = supabase.channel('concurso-' + id)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'concursos', filter: `id=eq.${id}` }, onChange)
    .subscribe();
  // Respaldo: si el tiempo real falla (publicación/RLS/red), se consulta cada 2 s
  const consultar = async () => {
    const data = await traerFilaConcurso(id);
    if (data) onChange({ new: data });
  };
  consultar();
  state.poll = setInterval(consultar, 2000);
}

async function cargarPreguntasConcurso() {
  // 1) Función en la base de datos (funciona también para invitados sin cuenta)
  const rpc = await supabase.rpc('obtener_preguntas_concurso', { p_concurso_id: state.concurso.id });
  if (!rpc.error && rpc.data && rpc.data.length) {
    state.preguntas = rpc.data.slice().sort((x, y) => x.orden - y.orden)
      .map(r => ({ id: r.id, enunciado: r.enunciado, imagen_url: r.imagen_url, puntos: r.puntos }));
    return;
  }
  // 2) Respaldo: lectura directa (solo si las políticas lo permiten, p. ej. alumnos con cuenta)
  const { data } = await supabase.from('concurso_preguntas')
    .select('orden, puntos, preguntas(id, enunciado, imagen_url)')
    .eq('concurso_id', state.concurso.id).order('orden');
  state.preguntas = (data || []).filter(r => r.preguntas).map(r => ({ ...r.preguntas, puntos: r.puntos }));
}

// Reloj de cuenta regresiva (modo automático): igual para todos, basado en la hora del servidor
function iniciarRelojVivo() {
  if (state.relojTick) clearInterval(state.relojTick);
  const idx = state.index;
  let ultimoIntento = 0;
  const tick = () => {
    const el = document.getElementById('relojVivo');
    const c = state.concurso;
    if (!el) { clearInterval(state.relojTick); state.relojTick = null; return; }
    if (!c || !c.avance_auto || !c.pregunta_inicio || !c.tiempo_por_pregunta_seg) { el.innerHTML = ''; return; }
    const restante = c.tiempo_por_pregunta_seg - (ahoraServidor() - Date.parse(c.pregunta_inicio)) / 1000;
    const seg = Math.max(0, Math.ceil(restante));
    el.innerHTML = `<div class="reloj ${seg <= 5 ? 'urgente' : ''}">⏱ ${seg}s</div>`;
    if (restante <= 0) {
      document.querySelectorAll('#opts button').forEach(b => b.disabled = true);
      const et = document.getElementById('esperaTexto');
      if (et) { et.style.display = 'block'; et.textContent = '⏰ Tiempo terminado. Pasando a la siguiente pregunta...'; }
      if (Date.now() - ultimoIntento > 2000) { // el servidor solo avanza si ya venció el tiempo
        ultimoIntento = Date.now();
        setTimeout(() => supabase.rpc('concurso_avanzar_auto', { p_concurso_id: c.id, p_index: idx }), Math.random() * 1000);
      }
    }
  };
  tick();
  state.relojTick = setInterval(tick, 250);
}

async function renderPreguntaConcursoVivo() {
  const pregunta = state.preguntas[state.index];
  if (!pregunta) { renderTablaPosicionesAlumno(); return; }
  state.inicioPregunta = Date.now();
  if (state.concurso.avance_auto && state.concurso.pregunta_inicio) state.inicioPregunta = Date.now() - Math.max(0, ahoraServidor() - Date.parse(state.concurso.pregunta_inicio));

  app.innerHTML = `
    <div id="relojVivo"></div>
    <p class="subtitle">Pregunta ${state.index + 1} de ${state.preguntas.length}</p>
    ${pregunta.imagen_url ? `<img src="${pregunta.imagen_url}" style="max-width:100%; border-radius:12px; margin-bottom:12px;">` : ''}
    <h2>${pregunta.enunciado}</h2>
    <div id="opts"></div>
    <div class="feedback hidden" id="feedback"></div>
    <p class="subtitle" id="esperaTexto" style="display:none;">Esperando a que el profesor avance...</p>
  `;
  const { data: opciones } = await supabase.rpc('obtener_opciones', { p_pregunta_id: pregunta.id });
  const opts = document.getElementById('opts');
  (opciones || []).forEach(o => {
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = o.texto;
    b.onclick = async () => {
      opts.querySelectorAll('button').forEach(x => x.disabled = true);
      b.classList.add('selected');
      const tiempoSeg = (Date.now() - state.inicioPregunta) / 1000;
      const { data } = await supabase.rpc('responder_concurso', {
        p_participante_id: state.participante.id, p_token: state.participante.token_sesion,
        p_pregunta_id: pregunta.id, p_opcion_id: o.id, p_tiempo_seg: tiempoSeg
      });
      const { es_correcta, texto_correcto } = data[0];
      b.classList.add(es_correcta ? 'correct' : 'incorrect');
      const fb = document.getElementById('feedback');
      fb.classList.remove('hidden'); fb.classList.add(es_correcta ? 'correct' : 'incorrect');
      fb.textContent = es_correcta ? '¡Correcto!' : `Incorrecto. Era: ${texto_correcto}`;
      decirEnVoz(es_correcta ? `Correcto. Es ${texto_correcto}` : `Incorrecto. Es ${texto_correcto}`);
      document.getElementById('esperaTexto').style.display = 'block';
    };
    opts.appendChild(b);
  });

  iniciarRelojVivo();

  suscribirseAConcurso(async (payload) => {
    state.concurso = { ...state.concurso, ...payload.new };
    if (payload.new.estado === 'finalizado') { renderTablaPosicionesAlumno(); return; }
    if (payload.new.pregunta_actual_index !== state.index) {
      state.index = payload.new.pregunta_actual_index;
      renderPreguntaConcursoVivo();
    }
  });
}

// ---------------- Modo plazo: el alumno controla su propio tiempo ----------------
async function renderPantallaEmpezarPlazo() {
  await cargarPreguntasConcurso();
  suscribirseAConcurso((p) => { // si el profesor finaliza, se corta a todos
    if (p.new.estado === 'finalizado' && !state.terminado) {
      state.terminado = true;
      if (state.cronometro) clearInterval(state.cronometro);
      renderTablaPosicionesAlumno();
    }
  });
  anchoSheet(false);
  app.innerHTML = `
    <h1>🕒 ${state.concurso.titulo}</h1>
    <p class="subtitle">${state.preguntas.length} preguntas · ${Math.round((state.concurso.tiempo_total_seg || 0) / 60)} min en total</p>
    <div class="card"><p style="font-weight:700;">Cuando le des a "Empezar" arranca tu cronómetro. No se puede pausar.</p></div>
    <button class="btn-primary" id="empezarBtn">▶ Empezar</button>
  `;
  document.getElementById('empezarBtn').onclick = async () => {
    await supabase.rpc('iniciar_concurso_participante', { p_participante_id: state.participante.id, p_token: state.participante.token_sesion });
    state.index = 0;
    iniciarCronometroPlazo();
    renderPreguntaConcursoPlazo();
  };
}

function iniciarCronometroPlazo() {
  const total = state.concurso.tiempo_total_seg;
  if (!total) return;
  const fin = Date.now() + total * 1000;
  state.cronometro = setInterval(() => {
    const restante = Math.max(0, Math.round((fin - Date.now()) / 1000));
    const el = document.getElementById('tiempoRestantePlazo');
    if (el) el.textContent = `${Math.floor(restante / 60)}:${String(restante % 60).padStart(2, '0')}`;
    if (restante <= 0) { clearInterval(state.cronometro); finalizarConcursoAlumno(); }
  }, 1000);
}

async function renderPreguntaConcursoPlazo() {
  const pregunta = state.preguntas[state.index];
  if (!pregunta) { finalizarConcursoAlumno(); return; }
  state.inicioPregunta = Date.now();

  app.innerHTML = `
    <div class="topbar"><p class="subtitle" style="margin:0;">Pregunta ${state.index + 1} de ${state.preguntas.length}</p>${state.concurso.tiempo_total_seg ? '<strong id="tiempoRestantePlazo"></strong>' : ''}</div>
    ${pregunta.imagen_url ? `<img src="${pregunta.imagen_url}" style="max-width:100%; border-radius:12px; margin-bottom:12px;">` : ''}
    <h2>${pregunta.enunciado}</h2>
    <div id="opts"></div>
    <div class="feedback hidden" id="feedback"></div>
    <button class="btn-primary hidden" id="siguienteBtn">${state.index + 1 === state.preguntas.length ? 'Finalizar' : 'Siguiente →'}</button>
  `;
  const { data: opciones } = await supabase.rpc('obtener_opciones', { p_pregunta_id: pregunta.id });
  const opts = document.getElementById('opts');
  (opciones || []).forEach(o => {
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = o.texto;
    b.onclick = async () => {
      opts.querySelectorAll('button').forEach(x => x.disabled = true);
      b.classList.add('selected');
      const tiempoSeg = (Date.now() - state.inicioPregunta) / 1000;
      const { data } = await supabase.rpc('responder_concurso', {
        p_participante_id: state.participante.id, p_token: state.participante.token_sesion,
        p_pregunta_id: pregunta.id, p_opcion_id: o.id, p_tiempo_seg: tiempoSeg
      });
      const { es_correcta, texto_correcto } = data[0];
      b.classList.add(es_correcta ? 'correct' : 'incorrect');
      const fb = document.getElementById('feedback');
      fb.classList.remove('hidden'); fb.classList.add(es_correcta ? 'correct' : 'incorrect');
      fb.textContent = es_correcta ? '¡Correcto!' : `Incorrecto. Era: ${texto_correcto}`;
      decirEnVoz(es_correcta ? `Correcto. Es ${texto_correcto}` : `Incorrecto. Es ${texto_correcto}`);
      document.getElementById('siguienteBtn').classList.remove('hidden');
    };
    opts.appendChild(b);
  });
  document.getElementById('siguienteBtn').onclick = () => {
    state.index++;
    if (state.index < state.preguntas.length) renderPreguntaConcursoPlazo();
    else finalizarConcursoAlumno();
  };
}

async function finalizarConcursoAlumno() {
  state.terminado = true;
  cerrarCanal();
  if (state.cronometro) clearInterval(state.cronometro);
  const { data: total } = await supabase.rpc('finalizar_concurso_participante', { p_participante_id: state.participante.id, p_token: state.participante.token_sesion });
  renderResultadoPersonal(total);
}

function renderResultadoPersonal(puntaje) {
  anchoSheet(false);

}

  cont.innerHTML = `<h2 style="margin-top:20px;">Concursos de este grupo</h2>` +
    (concursos || []).map(c => `<div class="item-lista">
      <div><strong>${c.titulo}</strong><div><span class="badge ${c.modo}">${c.modo === 'vivo' ? 'En vivo' : 'Por plazo'}</span> <span class="badge ${c.estado}">${c.estado}</span></div></div>
      <button class="btn-small" data-id="${c.id}">Gestionar</button>
    </div>`).join('') || '<p class="subtitle">Todavía no hay concursos.</p>';
  cont.querySelectorAll('button[data-id]').forEach(btn => {
    btn.onclick = () => renderGestionarConcurso(btn.dataset.id);
  });
}

async function idsConcursosDeGrupo(gid) {
  const { data } = await supabase.from('concurso_grupos').select('concurso_id').eq('grupo_id', gid);
  return (data || []).map(r => r.concurso_id);
}
const escC = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const SEG_MIN_PREGUNTA = 3; // tiempo mínimo por pregunta

async function renderCrearConcurso() {
  const [rg, rc, rp] = await Promise.all([
    supabase.from('grupos').select('id, nombre').order('nombre'),
    supabase.from('cortes').select('id, numero, nombre').order('numero'),
    supabase.from('preguntas').select('id, enunciado, tema').eq('tipo', 'opcion_unica').order('tema')
  ]);
  const grupos = rg.data || [], cortes = rc.data || [], todas = rp.data || [];
  const temaDe = p => p.tema || 'Repaso';
  const porId = Object.fromEntries(todas.map(p => [p.id, p]));
  const temas = {};
  todas.forEach(p => { const t = temaDe(p); (temas[t] = temas[t] || []).push(p.id); });
  const nombresTemas = Object.keys(temas);
  const temasSel = new Set(), fijas = new Map(), nuevas = []; // fijas: id -> puntos

  app.innerHTML = `
    <div class="topbar"><h1>Nuevo concurso</h1><button class="btn-link" id="volverBtn" style="width:auto;">Volver</button></div>
    <p class="subtitle">Solo preguntas de opción única (las de completar no aplican al concurso).</p>

    <div class="acc open" id="accDatos">
      <button type="button" class="acc-head" data-acc="Datos"><span>⚙️ Datos del concurso</span><span class="acc-sum" id="sumDatos"></span><span class="acc-arrow">▾</span></button>
      <div class="acc-body">
        <label>Título</label><input type="text" id="cTitulo" placeholder="Repaso general - física">
        <label>Grupos que participarán (uno o varios)</label>
        <div class="card" id="cGrupos">${grupos.map(g => `<div class="check-row"><input type="checkbox" class="chkGrupo" value="${g.id}" ${g.id === state.grupoId ? 'checked' : ''}><span class="texto">${escC(g.nombre)}</span></div>`).join('') || '<p class="subtitle">No tienes grupos.</p>'}</div>
        <label>Modo</label>
        <select id="cModo">
          <option value="vivo">En vivo (el profesor controla el avance)</option>
          <option value="plazo">Por plazo (cada alumno a su ritmo)</option>
        </select>
        <div id="campoTiempoVivo"><label>Segundos por pregunta (opcional, mínimo ${SEG_MIN_PREGUNTA})</label><input type="number" id="cTiempoPregunta" min="${SEG_MIN_PREGUNTA}" placeholder="Ej: 20"></div>
        <div id="campoTiempoPlazo" class="hidden"><label>Tiempo total del quiz en minutos (opcional)</label><input type="number" id="cTiempoTotal" min="1" placeholder="Ej: 15"></div>
        <label><input type="checkbox" id="cInvitados" checked style="width:auto; display:inline-block; margin-right:6px;"> Permitir invitados sin cuenta</label>
      </div>
    </div>

    <div class="acc" id="accTemas">
      <button type="button" class="acc-head" data-acc="Temas"><span>1️⃣ Temas</span><span class="acc-sum" id="sumTemas"></span><span class="acc-arrow">▾</span></button>
      <div class="acc-body">
        <p class="subtitle">Marca uno o más temas. De ellos se toman las preguntas al azar.</p>
        <input type="text" id="cBuscarTema" placeholder="🔍 Buscar tema...">
        <div class="card" style="max-height:220px; overflow-y:auto;" id="cTemas"></div>
        <label>De los temas marcados, tomar:</label>
        <select id="cTomar"><option value="todas">Todas sus preguntas</option><option value="n">Un número al azar</option></select>
        <div id="campoN" class="hidden"><label>¿Cuántas al azar?</label><input type="number" id="cN" min="1" value="10"></div>
      </div>
    </div>

    <div class="acc" id="accFijas">
      <button type="button" class="acc-head" data-acc="Fijas"><input type="checkbox" id="chkFijas" tabindex="-1"><span>2️⃣ Preguntas fijas</span><span class="acc-sum" id="sumFijas"></span><span class="acc-arrow">▾</span></button>
      <div class="acc-body">
        <p class="subtitle" id="fijasHint">Estas siempre aparecen, además de las de los temas.</p>
        <label>Filtrar por tema</label>
        <select id="cFiltroTema"></select>
        <input type="text" id="cBuscar" placeholder="🔍 Buscar por enunciado..." style="margin-top:8px;">
        <p class="subtitle" id="fijasConteo" style="margin:8px 0 0;"></p>
        <div class="card" style="max-height:260px; overflow-y:auto;" id="cSueltas"></div>
      </div>
    </div>

    <div class="acc" id="accNuevas">
      <button type="button" class="acc-head" data-acc="Nuevas"><input type="checkbox" id="chkNuevas" tabindex="-1"><span>3️⃣ Preguntas nuevas</span><span class="acc-sum" id="sumNuevas"></span><span class="acc-arrow">▾</span></button>
      <div class="acc-body">
        <p class="subtitle">Créalas aquí; se guardan en tu banco al crear el concurso.</p>
        <div class="card" style="margin-top:0;">
          <input type="text" id="nEnun" placeholder="Enunciado de la pregunta">
          <input type="text" id="nTema" placeholder="Tema (opcional)" list="listaTemasNuevas" style="margin-top:8px;">
          <datalist id="listaTemasNuevas">${nombresTemas.map(t => `<option value="${escC(t)}">`).join('')}</datalist>
          <select id="nCorte" style="margin-top:8px;">${cortes.map(c => `<option value="${c.id}">${escC(c.nombre)}</option>`).join('')}</select>
          ${[1, 2, 3, 4].map(i => `<div class="check-row"><input type="radio" name="nCorrecta" value="${i}" ${i === 1 ? 'checked' : ''}><input type="text" class="nOpcion" placeholder="Opción ${i}${i > 2 ? ' (opcional)' : ''}"></div>`).join('')}
          <p class="subtitle" style="margin:4px 0;">El círculo marca la respuesta correcta.</p>
          <button class="btn-small" id="nAgregar" type="button">➕ Agregar pregunta</button>
          <div id="cNuevasLista"></div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;"><b>📌 Total del concurso: <span id="cResumen">0</span> preguntas</b><div id="cHintTiempo" class="subtitle" style="margin:6px 0 0;"></div></div>
    <button class="btn-primary" id="crearConcursoBtn">Crear concurso</button>
    <div class="error" id="err"></div>
  `;
  document.getElementById('volverBtn').onclick = renderProfesorHome;

  // ---------- Acordeón: solo una sección abierta; marcar "fijas" o "nuevas" abre esa y encoge las demás ----------
  const ACC = ['Datos', 'Temas', 'Fijas', 'Nuevas'];
  const abrirAcc = (nombre) => {
    ACC.forEach(n => document.getElementById('acc' + n).classList.toggle('open', n === nombre));
    document.getElementById('chkFijas').checked = nombre === 'Fijas';
    document.getElementById('chkNuevas').checked = nombre === 'Nuevas';
  };
  document.querySelectorAll('.acc-head').forEach(h => h.onclick = () => {
    const n = h.dataset.acc;
    abrirAcc(document.getElementById('acc' + n).classList.contains('open') ? null : n);
  });

  const valN = () => Math.max(1, parseInt(document.getElementById('cN').value, 10) || 1);
  const pool = () => {
    const ids = new Set(); temasSel.forEach(t => (temas[t] || []).forEach(id => ids.add(id)));
    fijas.forEach((_, id) => ids.delete(id));
    return [...ids];
  };
  const totalEstimado = () => {
    const p = pool().length;
    const tomar = document.getElementById('cTomar').value === 'todas' ? p : Math.min(valN(), p);
    return fijas.size + nuevas.length + tomar;
  };
  const refrescar = () => {
    const total = totalEstimado();
    document.getElementById('cResumen').textContent = total;
    const modo = document.getElementById('cModo').value;
    const hint = document.getElementById('cHintTiempo');
    if (modo === 'plazo') {
      const min = Math.max(1, Math.ceil(total * SEG_MIN_PREGUNTA / 60));
      hint.textContent = total ? `Si pones tiempo total, el mínimo para ${total} preguntas es ${min} min (${SEG_MIN_PREGUNTA} s por pregunta).` : '';
    } else hint.textContent = `Si pones tiempo por pregunta, el mínimo es ${SEG_MIN_PREGUNTA} segundos.`;
    // resúmenes en las cabeceras del acordeón
    document.getElementById('sumDatos').textContent = (document.getElementById('cTitulo').value.trim() || 'Sin título') + ' · ' + (modo === 'vivo' ? 'En vivo' : 'Por plazo');
    document.getElementById('sumTemas').textContent = temasSel.size ? `${temasSel.size} tema(s) · ${pool().length} preg.` : 'ninguno';
    document.getElementById('sumFijas').textContent = fijas.size ? `${fijas.size} marcada(s)` : 'ninguna';
    document.getElementById('sumNuevas').textContent = nuevas.length ? `${nuevas.length} nueva(s)` : 'ninguna';
  };

  // ---------- Temas (con buscador) ----------
  const pintarTemas = () => {
    const q = document.getElementById('cBuscarTema').value.trim().toLowerCase();
    const lista = nombresTemas.filter(t => !q || t.toLowerCase().includes(q));
    const cont = document.getElementById('cTemas');
    cont.innerHTML = lista.map(t => `<div class="check-row"><input type="checkbox" class="chkTema" value="${escC(t)}" ${temasSel.has(t) ? 'checked' : ''}><span class="texto">${escC(t)}</span><span style="font-weight:800;">${temas[t].length}</span></div>`).join('')
      || '<p class="subtitle">No hay temas que coincidan.</p>';
    cont.querySelectorAll('.chkTema').forEach(ch => ch.onchange = () => {
      ch.checked ? temasSel.add(ch.value) : temasSel.delete(ch.value);
      alCambiarTemas();
    });
  };

  // ---------- Fijas: solo de los temas elegidos + filtro + buscador ----------
  const pintarFiltroTema = () => {
    const sel = document.getElementById('cFiltroTema');
    const previo = sel.value;
    const opciones = temasSel.size ? [...temasSel].sort() : nombresTemas;
    sel.innerHTML = `<option value="">${temasSel.size ? 'Todos los temas elegidos' : 'Todos los temas'}</option>` + opciones.map(t => `<option value="${escC(t)}">${escC(t)}</option>`).join('');
    if (opciones.includes(previo)) sel.value = previo;
    document.getElementById('fijasHint').textContent = temasSel.size
      ? `Solo se muestran preguntas de los temas elegidos (${temasSel.size}). Siempre aparecerán en el concurso.`
      : 'No hay temas elegidos: se muestran preguntas de cualquier tema. Siempre aparecerán en el concurso.';
  };
  const pintarSueltas = () => {
    const q = document.getElementById('cBuscar').value.trim().toLowerCase();
    const filtro = document.getElementById('cFiltroTema').value;
    const base = todas.filter(p => (!temasSel.size || temasSel.has(temaDe(p))) && (!filtro || temaDe(p) === filtro));
    const filtradas = base.filter(p => !q || (p.enunciado || '').toLowerCase().includes(q) || temaDe(p).toLowerCase().includes(q));
    const mostradas = filtradas.slice(0, 300);
    document.getElementById('fijasConteo').textContent = `${filtradas.length} pregunta(s)` + (filtradas.length > 300 ? ' (se muestran 300, usa el buscador)' : '');
    const cont = document.getElementById('cSueltas');
    cont.innerHTML = mostradas.map(p => `<div class="check-row"><input type="checkbox" class="chkFija" value="${p.id}" ${fijas.has(p.id) ? 'checked' : ''}><span class="texto">${escC(p.enunciado)} <i style="color:#888; font-size:11px;">· ${escC(temaDe(p))}</i></span><input type="number" class="inpPuntos" data-id="${p.id}" value="${fijas.get(p.id) || 1}" min="1" title="Puntos"></div>`).join('') || '<p class="subtitle">No hay preguntas que coincidan.</p>';
    cont.querySelectorAll('.chkFija').forEach(ch => ch.onchange = () => {
      if (ch.checked) fijas.set(ch.value, Math.max(1, parseInt(cont.querySelector(`.inpPuntos[data-id="${ch.value}"]`).value, 10) || 1)); else fijas.delete(ch.value);
      refrescar();
    });
    cont.querySelectorAll('.inpPuntos').forEach(i => i.onchange = () => { if (fijas.has(i.dataset.id)) fijas.set(i.dataset.id, Math.max(1, parseInt(i.value, 10) || 1)); });
  };
  const alCambiarTemas = () => {
    // las fijas ya marcadas que no pertenezcan a los temas elegidos se quitan
    if (temasSel.size) [...fijas.keys()].forEach(id => { if (porId[id] && !temasSel.has(temaDe(porId[id]))) fijas.delete(id); });
    pintarFiltroTema(); pintarSueltas(); refrescar();
  };

  const pintarNuevas = () => {
    document.getElementById('cNuevasLista').innerHTML = nuevas.map((n, i) => `<div class="check-row"><span class="texto">🆕 ${escC(n.enunciado)} <i style="color:#888; font-size:11px;">(${n.opciones.length} opciones)</i></span><button class="btn-small" data-i="${i}" type="button">Quitar</button></div>`).join('');
    document.querySelectorAll('#cNuevasLista button').forEach(b => b.onclick = () => { nuevas.splice(b.dataset.i, 1); pintarNuevas(); refrescar(); });
  };

  document.getElementById('cModo').onchange = (e) => {
    document.getElementById('campoTiempoVivo').classList.toggle('hidden', e.target.value !== 'vivo');
    document.getElementById('campoTiempoPlazo').classList.toggle('hidden', e.target.value !== 'plazo');
    refrescar();
  };
  document.getElementById('cTitulo').oninput = refrescar;
  document.getElementById('cTomar').onchange = (e) => { document.getElementById('campoN').classList.toggle('hidden', e.target.value !== 'n'); refrescar(); };
  document.getElementById('cN').oninput = refrescar;
  document.getElementById('cBuscar').oninput = pintarSueltas;
  document.getElementById('cFiltroTema').onchange = pintarSueltas;
  document.getElementById('cBuscarTema').oninput = pintarTemas;
  document.getElementById('nAgregar').onclick = () => {
    const errEl = document.getElementById('err'); errEl.textContent = '';
    const enunciado = document.getElementById('nEnun').value.trim();
    const textos = [...document.querySelectorAll('.nOpcion')].map(i => i.value.trim());
    const correcta = parseInt(document.querySelector('input[name="nCorrecta"]:checked').value, 10);
    const opciones = textos.map((t, i) => ({ texto: t, es_correcta: i + 1 === correcta })).filter(o => o.texto);
    if (!enunciado) { errEl.textContent = 'Escribe el enunciado de la pregunta nueva.'; return; }
    if (opciones.length < 2) { errEl.textContent = 'La pregunta nueva necesita al menos 2 opciones.'; return; }
    if (!opciones.some(o => o.es_correcta)) { errEl.textContent = 'Marca como correcta una opción que tenga texto.'; return; }
    nuevas.push({ enunciado, tema: document.getElementById('nTema').value.trim() || 'Repaso', corte_id: document.getElementById('nCorte').value, opciones });
    document.getElementById('nEnun').value = ''; document.getElementById('nTema').value = '';
    document.querySelectorAll('.nOpcion').forEach(i => i.value = '');
    pintarNuevas(); refrescar();
  };
  pintarTemas(); pintarFiltroTema(); pintarSueltas(); pintarNuevas(); refrescar();

  document.getElementById('crearConcursoBtn').onclick = async () => {
    const errEl = document.getElementById('err'); errEl.textContent = '';
    const titulo = document.getElementById('cTitulo').value.trim();
    const modo = document.getElementById('cModo').value;
    const grupoIds = [...document.querySelectorAll('.chkGrupo:checked')].map(c => c.value);
    const permiteInvitados = document.getElementById('cInvitados').checked;
    const tiempoPregunta = parseInt(document.getElementById('cTiempoPregunta').value, 10) || null;
    const tiempoTotalMin = parseInt(document.getElementById('cTiempoTotal').value, 10) || null;
    if (!titulo) { errEl.textContent = 'Ponle un título al concurso.'; return; }
    if (!grupoIds.length) { errEl.textContent = 'Elige al menos un grupo.'; return; }
    const p = pool();
    const tomarN = document.getElementById('cTomar').value === 'todas' ? p.length : Math.min(valN(), p.length);
    const total = fijas.size + nuevas.length + tomarN;
    if (total < 1) { errEl.textContent = 'El concurso no tiene preguntas: marca temas, preguntas fijas o agrega nuevas.'; return; }
    if (modo === 'vivo' && tiempoPregunta && tiempoPregunta < SEG_MIN_PREGUNTA) { errEl.textContent = `El mínimo es ${SEG_MIN_PREGUNTA} segundos por pregunta.`; return; }
    if (modo === 'plazo' && tiempoTotalMin) {
      const min = Math.max(1, Math.ceil(total * SEG_MIN_PREGUNTA / 60));
      if (tiempoTotalMin < min) { errEl.textContent = `Con ${total} preguntas el tiempo total mínimo es ${min} min (${SEG_MIN_PREGUNTA} s por pregunta).`; return; }
    }
    document.getElementById('crearConcursoBtn').disabled = true;

    // 1) guardar preguntas nuevas en el banco
    const puntosPorId = Object.fromEntries([...fijas]);
    const idsFijas = [...fijas.keys()];
    for (const n of nuevas) {
      const { data: preg, error: eP } = await supabase.from('preguntas').insert({ grupo_id: grupoIds[0], corte_id: n.corte_id, enunciado: n.enunciado, tipo: 'opcion_unica', tema: n.tema }).select('id').single();
      if (eP) { errEl.textContent = 'No se pudo guardar una pregunta nueva: ' + eP.message; document.getElementById('crearConcursoBtn').disabled = false; return; }
      await supabase.from('opciones').insert(n.opciones.map((o, i) => ({ pregunta_id: preg.id, texto: o.texto, es_correcta: o.es_correcta, orden: i + 1 })));
      idsFijas.push(preg.id); puntosPorId[preg.id] = 1;
    }
    // 2) preguntas finales: fijas + azar de los temas
    const idsFinal = [...idsFijas, ...barajar(p).slice(0, tomarN)];
    const { data: concurso, error: errC } = await supabase.from('concursos').insert({
      grupo_id: grupoIds[0], titulo, modo,
      tiempo_por_pregunta_seg: modo === 'vivo' ? tiempoPregunta : null,
      tiempo_total_seg: modo === 'plazo' && tiempoTotalMin ? tiempoTotalMin * 60 : null,
      permite_invitados: permiteInvitados, estado: 'armado'
    }).select('id').single();
    if (errC) { errEl.textContent = errC.message; document.getElementById('crearConcursoBtn').disabled = false; return; }
    const filas = idsFinal.map((pid, i) => ({ concurso_id: concurso.id, pregunta_id: pid, es_fija: idsFijas.includes(pid), puntos: puntosPorId[pid] || 1, orden: i + 1 }));
    await supabase.from('concurso_preguntas').insert(filas);
    // 3) grupos participantes
    const { error: eG } = await supabase.from('concurso_grupos').insert(grupoIds.map(gid => ({ concurso_id: concurso.id, grupo_id: gid })));
    if (eG && grupoIds.length > 1) alert('El concurso se creó, pero solo para el primer grupo: ' + eG.message + '\n\nEjecuta el SQL del Cambio 3 en Supabase y vuelve a crearlo.');
    renderGestionarConcurso(concurso.id);
  };
}


function bloqueCompartirHtml(concursoId) {
  return `
    <div class="card">
      <h2>📲 Invitar a unirse</h2>
      <p class="subtitle" style="margin-bottom:10px;">Comparte este enlace o que escaneen el QR — no necesitan cuenta.</p>
      <div style="display:flex; gap:8px; align-items:center;">
        <input type="text" id="enlaceUnirse" readonly style="font-size:12.5px;">

      </div>
      <div style="text-align:center; margin-top:14px;"><div id="qrCanvas" style="display:inline-block;"></div></div>
      <p class="ok-msg hidden" id="copiadoMsg" style="text-align:center;">¡Enlace copiado!</p>
    </div>`;
}

function activarBloqueCompartir(concursoId) {
  const url = window.location.origin + window.location.pathname + '?unirse=' + concursoId;
  const input = document.getElementById('enlaceUnirse');
  if (!input) return;
  input.value = url;
  document.getElementById('copiarEnlaceBtn').onclick = async () => {
    await navigator.clipboard.writeText(url);
    const msg = document.getElementById('copiadoMsg');
    msg.classList.remove('hidden');
    setTimeout(() => msg.classList.add('hidden'), 2000);
  };
  if (window.QRCode) new QRCode(document.getElementById('qrCanvas'), { text: url, width: 180, height: 180 });
  else document.getElementById('qrCanvas').textContent = 'No se pudo generar el QR, usa el enlace de arriba.';
}

function barajar(arr) {
  const copia = [...arr];
  for (let i = copia.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [copia[i], copia[j]] = [copia[j], copia[i]]; }
  return copia;
}

async function renderGestionarConcurso(concursoId) {
  const { data: concurso } = await supabase.from('concursos').select('*').eq('id', concursoId).single();
  state.concurso = concurso;
  cerrarCanal();
  const { count: totalPreguntas } = await supabase.from('concurso_preguntas').select('id', { count: 'exact', head: true }).eq('concurso_id', concursoId);

  app.innerHTML = `
    <div class="topbar"><h1>${concurso.titulo}</h1><button class="btn-link" id="volverBtn" style="width:auto;">Volver</button></div>
    <p class="subtitle"><span class="badge ${concurso.modo}">${concurso.modo === 'vivo' ? 'En vivo' : 'Por plazo'}</span> <span class="badge ${concurso.estado}">${concurso.estado}</span></p>
    <div id="panelEstado"></div>
  `;
  document.getElementById('volverBtn').onclick = renderProfesorHome;

  const panel = document.getElementById('panelEstado');

  if (concurso.estado === 'armado') {
    panel.innerHTML = `<div class="card"><p>El concurso está armado pero los alumnos todavía no pueden verlo.</p><button class="btn-primary" id="abrirBtn">Abrir sala de espera</button></div>`;
    document.getElementById('abrirBtn').onclick = async () => {
      if (await actualizarConcurso(concursoId, { estado: 'esperando' })) renderGestionarConcurso(concursoId);
    };
    return;
  }

  if (concurso.estado === 'esperando') {
    panel.innerHTML = `
      <div class="card">
        <p style="font-weight:800;">Conectados: <span id="numConectados">0</span></p>
        <div class="sala-grid" id="listaConectados"></div>
        ${concurso.modo === 'vivo' ? `
        <label style="margin-top:14px;">Tipo de inicio</label>
        <select id="tipoInicio">
          <option value="manual" ${concurso.tiempo_por_pregunta_seg ? '' : 'selected'}>🎤 Al ritmo del profesor (yo avanzo cada pregunta)</option>
          <option value="auto" ${concurso.tiempo_por_pregunta_seg ? 'selected' : ''}>⏱ Automático por tiempo (avanza solo, con reloj)</option>
        </select>
        <div id="campoSegAuto" class="${concurso.tiempo_por_pregunta_seg ? '' : 'hidden'}"><label>Segundos por pregunta (mínimo ${SEG_MIN_PREGUNTA})</label><input type="number" id="segAuto" min="${SEG_MIN_PREGUNTA}" value="${concurso.tiempo_por_pregunta_seg || 20}"></div>` : ''}
        <button class="btn-primary" id="iniciarBtn">▶ Iniciar concurso</button>
        <button class="btn-danger" id="cerrarSalaBtn" style="width:100%; margin-top:10px;">⏹ Cerrar sala / finalizar</button>
      </div>
      ${bloqueCompartirHtml(concursoId)}
    `;
    activarBloqueCompartir(concursoId);
    const tipoSel = document.getElementById('tipoInicio');
    if (tipoSel) tipoSel.onchange = () => document.getElementById('campoSegAuto').classList.toggle('hidden', tipoSel.value !== 'auto');
    document.getElementById('cerrarSalaBtn').onclick = () => { if (confirm('¿Cerrar la sala y finalizar el concurso para todos?')) terminarConcursoProfesor(concursoId); };
    const refrescarConectados = async () => {
      const num = document.getElementById('numConectados');
      if (!num) { cerrarCanal(); return; } // el profesor salió de esta pantalla
      let r = await supabase.from('concurso_participantes').select('alias, avatar, estudiante_id').eq('concurso_id', concursoId).order('created_at', { ascending: true });
      if (r.error) r = await supabase.from('concurso_participantes').select('alias, estudiante_id').eq('concurso_id', concursoId);
      const participantes = r.data || [];
      num.textContent = participantes.length;
      document.getElementById('listaConectados').innerHTML = participantes.map(p =>
        `<div class="sala-item">${avatarHtml(p.avatar, 48)}<span>${escC(p.alias)}</span></div>`).join('') || '<p class="subtitle">Nadie se ha unido todavía.</p>';
    };
    refrescarConectados();
    state.canal = supabase.channel('sala-' + concursoId)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'concurso_participantes', filter: `concurso_id=eq.${concursoId}` }, refrescarConectados)
      .subscribe();
    state.pollSala = setInterval(refrescarConectados, 3000); // respaldo por si el tiempo real falla
    document.getElementById('iniciarBtn').onclick = async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true; btn.textContent = 'Iniciando...';
      const campos = { estado: 'en_curso', pregunta_actual_index: 0 };
      if (tipoSel && tipoSel.value === 'auto') {
        const seg = parseInt(document.getElementById('segAuto').value, 10);
        if (!seg || seg < SEG_MIN_PREGUNTA) { alert(`El mínimo es ${SEG_MIN_PREGUNTA} segundos por pregunta.`); btn.disabled = false; btn.textContent = '▶ Iniciar concurso'; return; }
        Object.assign(campos, { avance_auto: true, tiempo_por_pregunta_seg: seg, pregunta_inicio: 'now' });
      }
      const ok = await actualizarConcurso(concursoId, campos);
      if (!ok) { btn.disabled = false; btn.textContent = '▶ Iniciar concurso'; return; }
      renderGestionarConcurso(concursoId);
    };
    return;
  }

  if (concurso.estado === 'en_curso') {
    if (concurso.modo === 'vivo') {
      await renderPanelVivoProfesor(panel, concurso, totalPreguntas, concursoId);
    } else {
      const { data: participantes } = await supabase.from('concurso_participantes').select('estado').eq('concurso_id', concursoId);
      const finalizados = (participantes || []).filter(p => p.estado === 'finalizado').length;
      panel.innerHTML = `
        <div class="card"><p style="font-weight:800;">Terminaron: ${finalizados} de ${(participantes || []).length}</p><button class="btn-danger" id="terminarBtn" style="width:100%;">Terminar concurso para todos ahora</button></div>
        ${bloqueCompartirHtml(concursoId)}
      `;
      activarBloqueCompartir(concursoId);
      document.getElementById('terminarBtn').onclick = () => { if (confirm('¿Finalizar el concurso para todos ahora?')) terminarConcursoProfesor(concursoId); };
    }
    return;
  }

  if (concurso.estado === 'finalizado') {
    const { data: participantes } = await supabase.from('concurso_participantes')
      .select('id, alias, avatar, puntaje_total, tiempo_total_seg, estudiante_id')
      .eq('concurso_id', concursoId).order('puntaje_total', { ascending: false }).order('tiempo_total_seg', { ascending: true });
    panel.innerHTML = `<div class="card"><h2>🏆 Tabla de posiciones</h2><div id="posicionesProf"></div>
      <button class="btn-danger" id="eliminarInvitadosBtn" style="width:100%; margin-top:14px;">Eliminar invitados en conjunto</button></div>`;
    const cont = document.getElementById('posicionesProf');
    (participantes || []).forEach((p, i) => {
      const div = document.createElement('div');
      div.className = 'fila-pos ' + (i === 0 ? 'pos-1' : i === 1 ? 'pos-2' : i === 2 ? 'pos-3' : '');
      div.innerHTML = `<span class="num">${i + 1}</span>${avatarHtml(p.avatar, 30)}<span class="nombre">${escC(p.alias)}${!p.estudiante_id ? ' (invitado)' : ''}</span><span class="pts">${p.puntaje_total ?? 0} pts</span>`;
      cont.appendChild(div);
    });
    if (!participantes || !participantes.length) cont.innerHTML = '<p class="subtitle">Nadie participó.</p>';
    document.getElementById('eliminarInvitadosBtn').onclick = async () => {
      if (!confirm('¿Eliminar a todos los invitados de este concurso? Los alumnos con cuenta no se tocan.')) return;
      await supabase.from('concurso_participantes').delete().eq('concurso_id', concursoId).is('estudiante_id', null);
      renderGestionarConcurso(concursoId);
    };
  }
}

async function terminarConcursoProfesor(concursoId) {
  cerrarCanal();
  // 1) Se corta a todos de inmediato (alumnos en vivo y por plazo)
  if (!(await actualizarConcurso(concursoId, { estado: 'finalizado' }))) return;
  // 2) Se cierran los participantes que no hayan terminado y se calculan sus puntajes
  const { data: participantes } = await supabase.from('concurso_participantes').select('id').eq('concurso_id', concursoId).neq('estado', 'finalizado');
  for (const p of (participantes || [])) {
    const { data: respuestas } = await supabase.from('concurso_respuestas').select('puntos_obtenidos').eq('participante_id', p.id);
    const total = (respuestas || []).reduce((a, r) => a + Number(r.puntos_obtenidos || 0), 0);
    await supabase.from('concurso_participantes').update({ puntaje_total: total, estado: 'finalizado', finalizado_en: new Date().toISOString() }).eq('id', p.id);
  }
  renderGestionarConcurso(concursoId);
}

// Panel del profesor durante el quiz en vivo: pregunta proyectada, reloj, modo y finalizar
async function renderPanelVivoProfesor(panel, concursoInicial, total, concursoId) {
  sincronizarReloj();
  await cargarPreguntasConcurso();
  const n = state.preguntas.length || total || 0;
  const c = { ...concursoInicial };
  const $ = id => document.getElementById(id);
  const cacheOps = {};
  let mostradoIdx = null, verCorrecta = false, ocupado = false, ticks = 0, ultimoAvance = 0;

  panel.innerHTML = `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;"><strong id="pvTitulo"></strong><span class="badge vivo" id="pvModo"></span></div>
      <div id="pvReloj"></div>
      <div class="subtitle" id="pvResp" style="margin:4px 0 0;"></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
        <button class="btn-small" id="pvSiguiente" type="button">Siguiente pregunta →</button>
        <button class="btn-small" id="pvModoBtn" type="button"></button>
      </div>
      <button class="btn-danger" id="pvTerminar" type="button" style="width:100%; margin-top:10px;">⏹ Finalizar quiz para todos</button>
    </div>
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;"><strong>👁 Pregunta proyectada</strong><button class="btn-link" id="pvToggleVer" type="button" style="width:auto;">Ocultar</button></div>
      <div id="pvVista">
        <div id="pvPregunta"></div>
        <label style="margin-top:10px;"><input type="checkbox" id="pvCorrecta" style="width:auto; display:inline-block; margin-right:6px;"> Mostrar la respuesta correcta</label>
      </div>
    </div>`;

  const opciones = async (id) => {
    if (cacheOps[id]) return cacheOps[id];
    let r = await supabase.from('opciones').select('id, texto, es_correcta, orden').eq('pregunta_id', id).order('orden');
    if (r.error || !r.data) r = await supabase.rpc('obtener_opciones', { p_pregunta_id: id });
    return (cacheOps[id] = r.data || []);
  };
  const pintarPregunta = async () => {
    const idx = c.pregunta_actual_index || 0;
    mostradoIdx = idx;
    const cont = $('pvPregunta'); if (!cont) return;
    const q = state.preguntas[idx];
    if (!q) { cont.innerHTML = '<p class="subtitle">No se pudo cargar la pregunta (ejecuta el SQL del paso 5).</p>'; return; }
    const ops = await opciones(q.id);
    if (mostradoIdx !== idx || !$('pvPregunta')) return;
    $('pvPregunta').innerHTML = `${q.imagen_url ? `<img src="${escC(q.imagen_url)}" style="max-width:100%; border-radius:12px; margin-bottom:10px;">` : ''}
      <h2 style="margin:6px 0 10px;">${escC(q.enunciado)}</h2>` +
      ops.map(o => { const ok = verCorrecta && o.es_correcta; return `<div class="option" style="cursor:default; ${ok ? 'border-color:var(--pen-green); background:#E6FBF0;' : ''}">${ok ? '✅ ' : ''}${escC(o.texto)}</div>`; }).join('');
  };
  const pintarReloj = () => {
    const el = $('pvReloj'); if (!el) return;
    const idx = c.pregunta_actual_index || 0;
    $('pvTitulo').textContent = `Pregunta ${idx + 1} de ${n}`;
    $('pvModo').textContent = c.avance_auto ? '⏱ Automático' : '🎤 Manual';
    $('pvModoBtn').textContent = c.avance_auto ? '🎤 Pasar a manual' : '⏱ Pasar a automático';
    if (!c.avance_auto) { el.innerHTML = '<p class="subtitle" style="margin:6px 0;">Tú decides cuándo avanzar.</p>'; return; }
    if (!c.pregunta_inicio || !c.tiempo_por_pregunta_seg) { el.innerHTML = ''; return; }
    const restante = c.tiempo_por_pregunta_seg - (ahoraServidor() - Date.parse(c.pregunta_inicio)) / 1000;
    const seg = Math.max(0, Math.ceil(restante));
    el.innerHTML = `<div class="reloj ${seg <= 5 ? 'urgente' : ''}">⏱ ${seg}s</div>`;
    if (restante <= 0 && Date.now() - ultimoAvance > 2000) {
      ultimoAvance = Date.now();
      supabase.rpc('concurso_avanzar_auto', { p_concurso_id: concursoId, p_index: idx })
        .then(async ({ error }) => { if (error && restante < -1) await siguiente(); }); // respaldo si falta el SQL
    }
  };
  const refrescarFila = async () => {
    const f = await traerFilaConcurso(concursoId);
    if (!f || !$('pvReloj')) return;
    Object.assign(c, f);
    if (c.estado === 'finalizado') { cerrarCanal(); renderGestionarConcurso(concursoId); return; }
    if ((c.pregunta_actual_index || 0) !== mostradoIdx) pintarPregunta();
    pintarReloj();
  };
  const contarRespuestas = async () => {
    const q = state.preguntas[c.pregunta_actual_index || 0]; const el = $('pvResp');
    if (!q || !el) return;
    const [pa, re] = await Promise.all([
      supabase.from('concurso_participantes').select('id').eq('concurso_id', concursoId),
      supabase.from('concurso_respuestas').select('participante_id').eq('pregunta_id', q.id)
    ]);
    if (pa.error || re.error || !$('pvResp')) return;
    const ids = new Set((pa.data || []).map(x => x.id));
    const resp = new Set((re.data || []).filter(x => ids.has(x.participante_id)).map(x => x.participante_id));
    $('pvResp').textContent = `✍️ Respondieron: ${resp.size} de ${ids.size}`;
  };
  const siguiente = async () => {
    const idx = c.pregunta_actual_index || 0;
    if (idx + 1 >= n) { await terminarConcursoProfesor(concursoId); return; }
    const campos = { pregunta_actual_index: idx + 1 };
    if (c.avance_auto) campos.pregunta_inicio = 'now';
    if (await actualizarConcurso(concursoId, campos)) await refrescarFila();
  };

  $('pvSiguiente').onclick = siguiente;
  $('pvTerminar').onclick = () => { if (confirm('¿Finalizar el quiz para todos los alumnos ahora?')) terminarConcursoProfesor(concursoId); };
  $('pvModoBtn').onclick = async () => {
    if (c.avance_auto) { if (await actualizarConcurso(concursoId, { avance_auto: false })) await refrescarFila(); return; }
    const s = parseInt(prompt(`Segundos por pregunta (mínimo ${SEG_MIN_PREGUNTA}):`, c.tiempo_por_pregunta_seg || 20), 10);
    if (!s || s < SEG_MIN_PREGUNTA) return;
    if (await actualizarConcurso(concursoId, { avance_auto: true, tiempo_por_pregunta_seg: s, pregunta_inicio: 'now' })) await refrescarFila();
  };
  $('pvCorrecta').onchange = (e) => { verCorrecta = e.target.checked; pintarPregunta(); };
  $('pvToggleVer').onclick = () => {
    const oculto = $('pvVista').classList.toggle('hidden');
    $('pvToggleVer').textContent = oculto ? 'Mostrar' : 'Ocultar';
  };

  pintarPregunta(); pintarReloj(); contarRespuestas();
  state.pollSala = setInterval(async () => {
    if (!$('pvReloj')) { cerrarCanal(); return; }
    ticks++;
    if (ticks % 2 === 1 && !ocupado) { ocupado = true; try { await refrescarFila(); } finally { ocupado = false; } }
    pintarReloj();
    if (ticks % 3 === 1) contarRespuestas();
  }, 1000);
}

init();
</script>
