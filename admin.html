<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del profesor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #16332a; --board-line: #244539;
    --paper: #f4efdd; --paper-line: #ddd3ad;
    --ink: #22281f; --ink-muted: #5a5f4f;
    --chalk-amber: #f2c14e; --pen-red: #d9503a; --pen-green: #4f8f5e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--board);
    background-image: linear-gradient(var(--board-line) 1px, transparent 1px), linear-gradient(90deg, var(--board-line) 1px, transparent 1px);
    background-size: 28px 28px;
    font-family: 'Source Sans 3', sans-serif; color: var(--ink);
    display: flex; justify-content: center; padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 720px; }
  .card {
    background: var(--paper); border-radius: 4px; padding: 24px 26px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.15); margin-bottom: 20px;
  }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; margin: 0 0 4px; }
  h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; margin: 0 0 14px; }
  .subtitle { color: var(--ink-muted); font-size: 14px; margin: 0 0 18px; }
  label { display: block; font-size: 13px; color: var(--ink-muted); margin: 12px 0 4px; }
  input, select, textarea {
    width: 100%; padding: 9px 11px; border: 1.5px solid var(--paper-line);
    border-radius: 4px; background: #fff; font-size: 14px; font-family: inherit;
  }
  textarea { min-height: 120px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; }
  button {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px;
    cursor: pointer; border: none; border-radius: 4px; padding: 9px 16px;
  }
  .btn-primary { background: var(--ink); color: var(--paper); margin-top: 14px; }
  .btn-small { background: var(--chalk-amber); color: var(--ink); font-size: 13px; padding: 6px 12px; }
  .btn-outline { background: none; border: 1.5px solid var(--ink-muted); color: var(--ink); font-size: 13px; padding: 6px 12px; }
  .btn-link { background: none; color: var(--ink-muted); text-decoration: underline; font-family: 'Source Sans 3'; font-size: 13px; padding: 4px 0; }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13.5px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--paper-line); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .pill.on { background: #ecf5ed; color: var(--pen-green); }
  .pill.off { background: #f1eee0; color: var(--ink-muted); }
  .error { color: var(--pen-red); font-size: 13px; margin-top: 8px; min-height: 14px; }
  .ok-msg { color: var(--pen-green); font-size: 13px; margin-top: 8px; }
  .hidden { display: none; }
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .hint { font-size: 12px; color: var(--ink-muted); margin-top: 6px; line-height: 1.5; }
  code { background: #ece6cf; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://qiawcxkmszgwvxlbbcdw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpYXdjeGttc3pnd3Z4bGJiY2R3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNDU2NjgsImV4cCI6MjEwNDgyMTY2OH0.Yw57xGupEs2f7s1lYIw9Gx1UUP2gg18FbgKj8LVzMfY';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');
let me = { id: null, rol: null };
let grupoActivo = null;
let cortesCache = [];

async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) loadDashboard(); else renderLogin();
}

function renderLogin() {
  app.innerHTML = `
    <div class="card">
      <h1>Panel del profesor</h1>
      <p class="subtitle">Inicia sesión con tu cuenta de administrador o profesor</p>
      <label>Correo</label><input type="email" id="email">
      <label>Contraseña</label><input type="password" id="password">
      <button class="btn-primary" id="loginBtn">Entrar</button>
      <div class="error" id="err"></div>
    </div>`;
  document.getElementById('loginBtn').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) { document.getElementById('err').textContent = error.message; return; }
    loadDashboard();
  };
}

async function loadDashboard() {
  const { data: { user } } = await supabase.auth.getUser();
  const { data: perfil } = await supabase.from('perfiles').select('id, rol, email').eq('id', user.id).single();
  me = perfil;

  if (me.rol === 'estudiante') {
    app.innerHTML = `<div class="card"><h1>Panel del profesor</h1><p class="subtitle">Esta página es solo para profesores y administradores. Usa la página de estudiante para tomar tus quizzes.</p>
    <button class="btn-link" id="logout">Salir</button></div>`;
    document.getElementById('logout').onclick = async () => { await supabase.auth.signOut(); renderLogin(); };
    return;
  }

  const { data: cortes } = await supabase.from('cortes').select('*').order('numero');
  cortesCache = cortes || [];

  app.innerHTML = `
    <div class="card">
      <div class="topbar"><h1>Panel del profesor</h1><button class="btn-link" id="logout">Salir</button></div>
      <p class="subtitle">${me.email} · rol: ${me.rol}</p>
    </div>
    <div id="adminSection"></div>
    <div class="card">
      <h2>Grupo con el que vas a trabajar</h2>
      <select id="grupoSelect"></select>
    </div>
    <div id="cortesSection" class="card"></div>
    <div id="cargaSection" class="hidden"></div>
    <div id="preguntasSection" class="hidden"></div>
    <div id="quizSection" class="hidden"></div>
    <div id="resultadosSection" class="hidden"></div>
  `;
  document.getElementById('logout').onclick = async () => { await supabase.auth.signOut(); renderLogin(); };

  if (me.rol === 'admin') renderAdminSection();
  renderCortesSection();
  await renderGrupoSelect();
}

// ---------------- ADMIN: grupos, profesores ----------------
function renderAdminSection() {
  const el = document.getElementById('adminSection');
  el.innerHTML = `
    <div class="card">
      <h2>Crear grupo</h2>
      <div class="row">
        <div><label>Nombre</label><input id="gNombre" placeholder="4to Secundaria A"></div>
        <div><label>Nivel</label><input id="gNivel" placeholder="Secundaria"></div>
        <div><button class="btn-primary" id="gCrear">Crear grupo</button></div>
      </div>
      <div class="error" id="gErr"></div>
    </div>
    <div class="card">
      <h2>Asignar profesor a un grupo</h2>
      <label>Correo del profesor (ya debe tener cuenta creada)</label>
      <input id="pEmail" placeholder="profesor@correo.com">
      <button class="btn-outline" id="pBuscar" style="margin-top:8px">Buscar</button>
      <div id="pResultado"></div>
    </div>
  `;
  document.getElementById('gCrear').onclick = async () => {
    const nombre = document.getElementById('gNombre').value.trim();
    const nivel = document.getElementById('gNivel').value.trim();
    if (!nombre) { document.getElementById('gErr').textContent = 'Ponle un nombre al grupo.'; return; }
    const { error } = await supabase.from('grupos').insert({ nombre, nivel });
    if (error) { document.getElementById('gErr').textContent = error.message; return; }
    document.getElementById('gNombre').value = ''; document.getElementById('gNivel').value = '';
    document.getElementById('gErr').textContent = '';
    await renderGrupoSelect();
  };
  document.getElementById('pBuscar').onclick = async () => {
    const email = document.getElementById('pEmail').value.trim();
    const { data: perfil } = await supabase.from('perfiles').select('id, email, rol').eq('email', email).maybeSingle();
    const box = document.getElementById('pResultado');
    if (!perfil) { box.innerHTML = `<p class="error">No se encontró ninguna cuenta con ese correo. Primero debe registrarse en la página de estudiante.</p>`; return; }
    const { data: grupos } = await supabase.from('grupos').select('id, nombre');
    box.innerHTML = `
      <p class="ok-msg">Encontrado: ${perfil.email} (rol actual: ${perfil.rol})</p>
      <div class="row">
        <div><select id="pGrupo">${(grupos||[]).map(g=>`<option value="${g.id}">${g.nombre}</option>`).join('')}</select></div>
        <div><button class="btn-small" id="pAsignar">Hacer profesor y asignar</button></div>
      </div>
      <div class="error" id="pErr"></div>
    `;
    document.getElementById('pAsignar').onclick = async () => {
      const grupoId = document.getElementById('pGrupo').value;
      const { error: e1 } = await supabase.from('perfiles').update({ rol: 'profesor' }).eq('id', perfil.id);
      const { error: e2 } = await supabase.from('profesor_grupos').insert({ profesor_id: perfil.id, grupo_id: grupoId });
      if (e1 || e2) { document.getElementById('pErr').textContent = (e1 || e2).message; return; }
      document.getElementById('pErr').innerHTML = '<span class="ok-msg">Listo, profesor asignado.</span>';
    };
  };
}

// ---------------- Cortes ----------------
function renderCortesSection() {
  const el = document.getElementById('cortesSection');
  el.innerHTML = `
    <h2>Cortes (bimestres)</h2>
    <p class="subtitle">Estos son globales, los usan todos los grupos.</p>
    <table id="cortesTabla"><tr><th>Número</th><th>Nombre</th></tr></table>
    ${me.rol === 'admin' ? `
    <div class="row" style="margin-top:14px">
      <div><label>Número</label><input id="cNumero" type="number" placeholder="1"></div>
      <div><label>Nombre</label><input id="cNombre" placeholder="Primer bimestre"></div>
      <div><button class="btn-outline" id="cCrear">Agregar corte</button></div>
    </div>
    <div class="error" id="cErr"></div>` : ''}
  `;
  const tabla = document.getElementById('cortesTabla');
  cortesCache.forEach(c => { tabla.innerHTML += `<tr><td>${c.numero}</td><td>${c.nombre}</td></tr>`; });
  if (me.rol === 'admin') {
    document.getElementById('cCrear').onclick = async () => {
      const numero = Number(document.getElementById('cNumero').value);
      const nombre = document.getElementById('cNombre').value.trim();
      if (!numero || !nombre) { document.getElementById('cErr').textContent = 'Completa número y nombre.'; return; }
      const { error } = await supabase.from('cortes').insert({ numero, nombre });
      if (error) { document.getElementById('cErr').textContent = error.message; return; }
      const { data: cortes } = await supabase.from('cortes').select('*').order('numero');
      cortesCache = cortes || [];
      renderCortesSection();
    };
  }
}

// ---------------- Selector de grupo ----------------
async function renderGrupoSelect() {
  const { data: grupos } = await supabase.from('grupos').select('id, nombre').order('nombre');
  const sel = document.getElementById('grupoSelect');
  if (!grupos || !grupos.length) {
    sel.innerHTML = `<option>No tienes grupos asignados todavía</option>`;
    return;
  }
  sel.innerHTML = grupos.map(g => `<option value="${g.id}">${g.nombre}</option>`).join('');
  grupoActivo = grupos[0].id;
  sel.onchange = () => { grupoActivo = sel.value; renderCargaSection(); renderPreguntasSection(); renderQuizSection(); };
  renderCargaSection(); renderPreguntasSection(); renderQuizSection();
}

// ---------------- Carga masiva de preguntas ----------------
function renderCargaSection() {
  const el = document.getElementById('cargaSection');
  el.classList.remove('hidden');
  el.innerHTML = `
    <div class="card">
      <h2>Carga masiva de preguntas</h2>
      <p class="subtitle">Pega filas copiadas de Excel (separadas por tabulaciones) o un CSV. Una pregunta por fila, en este orden de columnas:</p>
      <p class="hint"><code>tipo, corte_numero, enunciado, imagen_url, opcion_1, correcta_1, opcion_2, correcta_2, opcion_3, correcta_3, opcion_4, correcta_4, respuesta_correcta</code></p>
      <p class="hint">
        · <code>tipo</code>: <code>opcion_unica</code> o <code>completar</code><br>
        · en <code>correcta_N</code> escribe <code>V</code> o <code>F</code><br>
        · deja vacías las columnas de opciones si el tipo es <code>completar</code>, y llena solo <code>respuesta_correcta</code><br>
        · <code>imagen_url</code> es opcional, déjala vacía si no aplica<br>
        · si tu primera fila es de encabezados (con la palabra "tipo"), se ignora automáticamente
      </p>
      <button class="btn-outline" id="plantillaBtn" style="margin-bottom:10px">Descargar plantilla de ejemplo</button>
      <textarea id="csvInput" placeholder="opcion_unica,1,¿La capital de Perú es Lima?,,Verdadero,V,Falso,F,,,,,&#10;completar,1,El símbolo químico del oro es ___,,,,,,,,,,Au">
      <button class="btn-primary" id="cargarBtn">Cargar preguntas</button>
      <div class="error" id="cargaErr"></div>
    </div>
  `;
  document.getElementById('plantillaBtn').onclick = () => {
    const contenido = 'tipo,corte_numero,enunciado,imagen_url,opcion_1,correcta_1,opcion_2,correcta_2,opcion_3,correcta_3,opcion_4,correcta_4,respuesta_correcta\n' +
      'opcion_unica,1,¿La capital de Perú es Lima?,,Verdadero,V,Falso,F,,,,,\n' +
      'completar,1,El símbolo químico del oro es ___,,,,,,,,,,Au\n';
    const blob = new Blob([contenido], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'plantilla_preguntas.csv'; a.click();
  };
  document.getElementById('cargarBtn').onclick = cargarPreguntas;
}

function esVerdadero(v) {
  return ['v','1','si','sí','true','x'].includes((v || '').trim().toLowerCase());
}

async function cargarPreguntas() {
  const raw = document.getElementById('csvInput').value.trim();
  const errEl = document.getElementById('cargaErr');
  errEl.textContent = '';
  if (!raw) { errEl.textContent = 'Pega al menos una fila.'; return; }
  if (!grupoActivo) { errEl.textContent = 'Selecciona un grupo primero.'; return; }

  let filas = raw.split('\n').map(l => l.trim()).filter(Boolean);
  if (filas[0].toLowerCase().includes('tipo')) filas = filas.slice(1);

  let cargadas = 0, fallidas = 0;
  for (const linea of filas) {
    const delim = linea.includes('\t') ? '\t' : ',';
    const cols = linea.split(delim).map(c => c.trim());
    const [tipoRaw, corteNumRaw, enunciado, imagenUrl, o1, c1, o2, c2, o3, c3, o4, c4, respCorrecta] = cols;
    const tipo = (tipoRaw || 'opcion_unica').toLowerCase();
    const corte = cortesCache.find(c => String(c.numero) === String(corteNumRaw));
    if (!enunciado || !corte) { fallidas++; continue; }

    const { data: pregunta, error: errP } = await supabase.from('preguntas').insert({
      grupo_id: grupoActivo,
      corte_id: corte.id,
      enunciado,
      tipo,
      imagen_url: imagenUrl || null,
      respuesta_correcta: tipo === 'completar' ? (respCorrecta || null) : null
    }).select('id').single();

    if (errP) { fallidas++; continue; }

    if (tipo === 'opcion_unica') {
      const opciones = [[o1,c1],[o2,c2],[o3,c3],[o4,c4]]
        .filter(([texto]) => texto)
        .map(([texto, correcta], i) => ({ pregunta_id: pregunta.id, texto, es_correcta: esVerdadero(correcta), orden: i + 1 }));
      if (opciones.length) await supabase.from('opciones').insert(opciones);
    }
    cargadas++;
  }
  errEl.innerHTML = `<span class="${fallidas ? 'error' : 'ok-msg'}">Cargadas: ${cargadas}. Con error: ${fallidas}.</span>`;
  renderPreguntasSection();
}

// ---------------- Lista de preguntas del grupo ----------------
async function renderPreguntasSection() {
  const el = document.getElementById('preguntasSection');
  el.classList.remove('hidden');
  const { data: preguntas } = await supabase.from('preguntas')
    .select('id, enunciado, tipo, cortes(numero, nombre)')
    .eq('grupo_id', grupoActivo).order('created_at', { ascending: false });

  el.innerHTML = `
    <div class="card">
      <h2>Preguntas cargadas (${preguntas ? preguntas.length : 0})</h2>
      <table>
        <tr><th>Corte</th><th>Tipo</th><th>Enunciado</th></tr>
        ${(preguntas || []).map(p => `<tr><td>${p.cortes ? p.cortes.numero : '-'}</td><td>${p.tipo}</td><td>${p.enunciado}</td></tr>`).join('')}
      </table>
    </div>
  `;
}

// ---------------- Crear quiz ----------------
function renderQuizSection() {
  const el = document.getElementById('quizSection');
  el.classList.remove('hidden');
  el.innerHTML = `
    <div class="card">
      <h2>Crear quiz</h2>
      <label>Título</label><input id="qTitulo" placeholder="Práctica bimestre 1">
      <div class="row">
        <div><label>Modo</label>
          <select id="qModo"><option value="practica">Práctica (feedback inmediato)</option><option value="examen">Examen (califica al final)</option></select>
        </div>
        <div><label>Alcance</label>
          <select id="qAlcance"><option value="un_corte">Un corte específico</option><option value="acumulado">Acumulado (todos los cortes)</option></select>
        </div>
        <div id="qCorteWrap"><label>Corte</label>
          <select id="qCorte">${cortesCache.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('')}</select>
        </div>
      </div>
      <label><input type="checkbox" id="qActivo" checked style="width:auto;display:inline-block;margin-right:6px"> Activo desde ya</label>
      <button class="btn-primary" id="qCrear">Crear quiz</button>
      <div class="error" id="qErr"></div>
    </div>
    <div id="listaQuizzes"></div>
  `;
  document.getElementById('qAlcance').onchange = (e) => {
    document.getElementById('qCorteWrap').style.display = e.target.value === 'un_corte' ? 'block' : 'none';
  };
  document.getElementById('qCrear').onclick = crearQuiz;
  renderListaQuizzes();
}

async function crearQuiz() {
  const titulo = document.getElementById('qTitulo').value.trim();
  const modo = document.getElementById('qModo').value;
  const alcance = document.getElementById('qAlcance').value;
  const corteId = alcance === 'un_corte' ? document.getElementById('qCorte').value : null;
  const activo = document.getElementById('qActivo').checked;
  const errEl = document.getElementById('qErr');
  errEl.textContent = '';
  if (!titulo) { errEl.textContent = 'Ponle un título al quiz.'; return; }

  const { data: quiz, error: errQ } = await supabase.from('quizzes').insert({
    grupo_id: grupoActivo, titulo, modo, alcance, corte_id: corteId, activo
  }).select('id').single();
  if (errQ) { errEl.textContent = errQ.message; return; }

  let queryPreguntas = supabase.from('preguntas').select('id').eq('grupo_id', grupoActivo);
  if (alcance === 'un_corte') queryPreguntas = queryPreguntas.eq('corte_id', corteId);
  const { data: preguntas } = await queryPreguntas;

  if (preguntas && preguntas.length) {
    const filas = preguntas.map((p, i) => ({ quiz_id: quiz.id, pregunta_id: p.id, orden: i + 1 }));
    await supabase.from('quiz_preguntas').insert(filas);
  }
  document.getElementById('qTitulo').value = '';
  errEl.innerHTML = `<span class="ok-msg">Quiz creado con ${preguntas ? preguntas.length : 0} preguntas.</span>`;
  renderListaQuizzes();
}

async function renderListaQuizzes() {
  const { data: quizzes } = await supabase.from('quizzes').select('id, titulo, modo, activo').eq('grupo_id', grupoActivo).order('created_at', { ascending: false });
  const el = document.getElementById('listaQuizzes');
  el.innerHTML = `<div class="card"><h2>Quizzes de este grupo</h2>
    <table><tr><th>Título</th><th>Modo</th><th>Estado</th><th></th><th></th></tr>
    ${(quizzes || []).map(q => `
      <tr>
        <td>${q.titulo}</td><td>${q.modo}</td>
        <td><span class="pill ${q.activo ? 'on' : 'off'}">${q.activo ? 'activo' : 'inactivo'}</span></td>
        <td><button class="btn-outline toggleBtn" data-id="${q.id}" data-activo="${q.activo}">${q.activo ? 'Desactivar' : 'Activar'}</button></td>
        <td><button class="btn-outline verBtn" data-id="${q.id}" data-titulo="${q.titulo}">Ver resultados</button></td>
      </tr>`).join('')}
    </table></div>`;

  el.querySelectorAll('.toggleBtn').forEach(btn => {
    btn.onclick = async () => {
      await supabase.from('quizzes').update({ activo: btn.dataset.activo !== 'true' }).eq('id', btn.dataset.id);
      renderListaQuizzes();
    };
  });
  el.querySelectorAll('.verBtn').forEach(btn => {
    btn.onclick = () => verResultados(btn.dataset.id, btn.dataset.titulo);
  });
}

async function verResultados(quizId, titulo) {
  const { data: intentos } = await supabase.from('intentos')
    .select('puntaje_total, estado, estudiantes(nombre)').eq('quiz_id', quizId);
  const el = document.getElementById('resultadosSection');
  el.classList.remove('hidden');
  el.innerHTML = `<div class="card"><h2>Resultados: ${titulo}</h2>
    <table><tr><th>Estudiante</th><th>Puntaje</th><th>Estado</th></tr>
    ${(intentos || []).map(i => `<tr><td>${i.estudiantes ? i.estudiantes.nombre : '-'}</td><td>${i.puntaje_total ?? '-'}</td><td>${i.estado}</td></tr>`).join('') || '<tr><td colspan="3">Nadie lo ha tomado todavía.</td></tr>'}
    </table></div>`;
  el.scrollIntoView({ behavior: 'smooth' });
}

init();
</script>
</body>
</html>
