name: Mantener Supabase activo

# El plan gratuito de Supabase pausa el proyecto tras 7 días sin uso.
# Este workflow hace una consulta ligera cada 3 días para mantenerlo activo.

on:
  schedule:
    - cron: "17 13 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a biblioteca_libre
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secrets SUPABASE_URL y/o SUPABASE_ANON_KEY en Settings → Secrets and variables → Actions."
            exit 1
          fi

          if ! curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/biblioteca_libre" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' -o /dev/null; then
            echo "::error::Supabase no respondió correctamente. Revisa que los secrets sean correctos y que el proyecto no esté pausado."
            exit 1
          fi

          echo "Supabase respondió correctamente."
