<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz de Estudio - Biología, Química y Física</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .app-container {
            background: #fff;
            width: 100%;
            max-width: 600px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 95vh;
        }
        .header {
            background: #4a3f8a;
            color: white;
            padding: 12px 15px;
            text-align: center;
            position: relative;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .header-top h1 {
            font-size: 1.1rem;
            margin: 0;
        }
        .header-top .user-name {
            font-size: 0.9rem;
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 15px;
            font-weight: bold;
        }
        .score-board {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.15);
            padding: 5px 10px;
            border-radius: 20px;
            margin-top: 5px;
        }
        .score-board span {
            font-weight: bold;
        }
        .correct-count { color: #a5d6a7; }
        .incorrect-count { color: #ef9a9a; }

        .content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* Pantalla de inicio */
        .start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 20px;
            height: 100%;
        }
        .start-screen input {
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 10px;
            width: 80%;
            font-size: 1rem;
            text-align: center;
        }
        .btn {
            background: #4a3f8a;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover {
            background: #3b3270;
            transform: scale(1.02);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-wa {
            background: #25D366;
            margin-top: 10px;
        }
        .btn-wa:hover {
            background: #1ebe5d;
        }

        /* Pantalla de pregunta */
        .question-screen {
            display: none;
            flex-direction: column;
            gap: 15px;
            height: 100%;
        }
        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 12px 15px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            color: #333;
        }
        .option-btn:hover:not(:disabled) {
            background: #e0e0ff;
            border-color: #4a3f8a;
        }
        .option-btn.correct {
            background: #c8e6c9;
            border-color: #2e7d32;
            color: #1b5e20;
        }
        .option-btn.incorrect {
            background: #ffcdd2;
            border-color: #c62828;
            color: #b71c1c;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .feedback {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
            min-height: 24px;
            font-size: 1rem;
        }
        .feedback.correct { color: #2e7d32; }
        .feedback.incorrect { color: #c62828; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #4a3f8a;
            width: 0%;
            transition: width 0.3s;
        }

        /* Reporte final */
        .end-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 15px;
            height: 100%;
        }
        .report-list {
            width: 100%;
            text-align: left;
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 10px;
            background: #fafafa;
            margin-bottom: 10px;
        }
        .report-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
            font-size: 0.85rem;
        }
        .report-item:last-child {
            border-bottom: none;
        }
        .report-item .q {
            font-weight: bold;
            color: #333;
        }
        .report-item .a {
            margin-top: 4px;
        }
        .report-item .a.correct {
            color: #2e7d32;
        }
        .report-item .a.incorrect {
            color: #c62828;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .app-container { border-radius: 0; max-height: 100vh; }
            body { padding: 0; }
            .header-top h1 { font-size: 0.95rem; }
            .header-top .user-name { font-size: 0.8rem; padding: 3px 8px; }
            .question-text { font-size: 1rem; }
            .option-btn { font-size: 0.9rem; padding: 10px; }
            .score-board { font-size: 0.75rem; gap: 10px; }
        }
    </style>
</head>
<body>

    // ============================================================
    // LÓGICA DEL QUIZ
    // ============================================================
    const QUESTIONS_PER_ROUND = 10;
    let currentQuestions = [];
    let currentIndex = 0;
    let correctCount = 0;
    let incorrectCount = 0;
    let userAnswers = [];
    let userName = "";

    const content = document.getElementById('content');
    const liveCorrect = document.getElementById('liveCorrect');
    const liveIncorrect = document.getElementById('liveIncorrect');
    const liveProgress = document.getElementById('liveProgress');
    const userNameDisplay = document.getElementById('userNameDisplay');

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function getRandomQuestions(n) {
        const shuffled = shuffleArray([...questionBank]);
        return shuffled.slice(0, n);
    }

    function updateScoreBoard() {
        liveCorrect.textContent = correctCount;
        liveIncorrect.textContent = incorrectCount;
        liveProgress.textContent = `${currentIndex}/${QUESTIONS_PER_ROUND}`;
    }

    // Pantalla de inicio (solo pide nombre si no está definido)
    function renderStart() {
        if (userName) {
            startQuiz();
            return;
        }
        content.innerHTML = `
            <div class="start-screen">
                <h2>¡Bienvenido al Quiz!</h2>
                <p style="color:#666; font-size:0.9rem;">Pon a prueba tus conocimientos de Biología, Química y Física.</p>
                <input type="text" id="nameInput" placeholder="Escribe tu nombre" maxlength="20">
                <button class="btn" id="startBtn">🚀 Comenzar</button>
            </div>
        `;
        document.getElementById('startBtn').addEventListener('click', () => {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert("Por favor, ingresa tu nombre para comenzar.");
                return;
            }
            userName = name;
            userNameDisplay.textContent = userName;
            startQuiz();
        });
    }

    function startQuiz() {
        currentQuestions = getRandomQuestions(QUESTIONS_PER_ROUND);
        currentIndex = 0;
        correctCount = 0;
        incorrectCount = 0;
        userAnswers = [];
        updateScoreBoard();
        renderQuestion();
    }

    function renderQuestion() {
        if (currentIndex >= currentQuestions.length) {
            renderEnd();
            return;
        }

        const q = currentQuestions[currentIndex];
        const progressPercent = (currentIndex / QUESTIONS_PER_ROUND) * 100;

        const optionsWithIndex = q.opciones.map((opt, idx) => ({ text: opt, originalIndex: idx }));
        const shuffledOptions = shuffleArray([...optionsWithIndex]);

        let optionsHtml = '';
        shuffledOptions.forEach((opt) => {
            if (opt.text.trim() === "") return;
            optionsHtml += `<button class="option-btn" data-index="${opt.originalIndex}">${opt.text}</button>`;
        });

        content.innerHTML = `
            <div class="question-screen" style="display:flex;">
                <div class="progress-bar">
                    <div class="progress-fill" style="width:${progressPercent}%"></div>
                </div>
                <div class="question-text">${currentIndex + 1}. ${q.pregunta}</div>
                <div class="options" id="optionsContainer">
                    ${optionsHtml}
                </div>
                <div class="feedback" id="feedback"></div>
            </div>
        `;

        const optionButtons = document.querySelectorAll('.option-btn');
        optionButtons.forEach(btn => {
            btn.addEventListener('click', () => handleAnswer(btn, q));
        });
    }

    function handleAnswer(selectedBtn, question) {
        const allButtons = document.querySelectorAll('.option-btn');
        allButtons.forEach(btn => btn.disabled = true);

        const selectedIndex = parseInt(selectedBtn.dataset.index);
        const isCorrect = selectedIndex === question.correcta;
        const feedbackEl = document.getElementById('feedback');

        if (isCorrect) {
            selectedBtn.classList.add('correct');
            feedbackEl.textContent = "¡Excelente! 🎉 Respuesta correcta.";
            feedbackEl.className = "feedback correct";
            correctCount++;
            allButtons.forEach(btn => {
                if (parseInt(btn.dataset.index) === question.correcta) {
                    btn.classList.add('correct');
                }
            });
        } else {
            selectedBtn.classList.add('incorrect');
            feedbackEl.textContent = "¡Uy, te equivocaste! 😅 La respuesta correcta era: " + question.opciones[question.correcta];
            feedbackEl.className = "feedback incorrect";
            incorrectCount++;
            allButtons.forEach(btn => {
                if (parseInt(btn.dataset.index) === question.correcta) {
                    btn.classList.add('correct');
                }
            });
        }

        userAnswers.push({
            pregunta: question.pregunta,
            seleccionada: question.opciones[selectedIndex],
            correcta: question.opciones[question.correcta],
            esCorrecta: isCorrect,
            tema: question.tema
        });

        updateScoreBoard();

        setTimeout(() => {
            currentIndex++;
            updateScoreBoard();
            renderQuestion();
        }, 1800);
    }

    function renderEnd() {
        const total = userAnswers.length;
        const percentage = Math.round((correctCount / total) * 100);
        let mensaje = "";
        if (percentage >= 90) mensaje = "¡Eres un genio! 🏆";
        else if (percentage >= 70) mensaje = "¡Muy bien! Sigue así. 🌟";
        else if (percentage >= 50) mensaje = "Buen intento, puedes mejorar. 💪";
        else mensaje = "No te desanimes, ¡repasa y vuelve a intentarlo! 📚";

        let reportHtml = '';
        userAnswers.forEach((ans, i) => {
            const clase = ans.esCorrecta ? 'correct' : 'incorrect';
            const icono = ans.esCorrecta ? '✅' : '❌';
            reportHtml += `
                <div class="report-item">
                    <div class="q">${i+1}. ${ans.pregunta}</div>
                    <div class="a ${clase}">${icono} Tu respuesta: ${ans.seleccionada} | Correcta: ${ans.correcta}</div>
                </div>
            `;
        });

        // Construir texto para WhatsApp SOLO con el reporte (sin detalle de preguntas)
        const notaFinal = Math.round((correctCount / total) * 10); // Nota sobre 10
        let textoWA = `📝 *REPORTE DE QUIZ*\n`;
        textoWA += `━━━━━━━━━━━━━━━━━━\n`;
        textoWA += `👤 *Alumno:* ${userName}\n`;
        textoWA += `🔁 *Intento:* 1\n`;
        textoWA += `📋 *Preguntas:* ${total}\n`;
        textoWA += `✅ *Acertadas:* ${correctCount}\n`;
        textoWA += `❌ *Erradas:* ${incorrectCount}\n`;
        textoWA += `🎯 *Nota:* ${notaFinal}/10\n`;
        textoWA += `━━━━━━━━━━━━━━━━━━\n`;
        textoWA += `📱 _Generado por Quiz de Estudio_`;

        content.innerHTML = `
            <div class="end-screen" style="display:flex;">
                <h2>${mensaje}</h2>
                <p style="font-size:1.1rem;"><strong>${userName}</strong>, tu puntaje fue: <strong>${correctCount}/${total}</strong> (${percentage}%)</p>
                <div class="report-list">
                    ${reportHtml}
                </div>
                <button class="btn" id="restartBtn">🔄 Intentar de nuevo</button>
                <button class="btn btn-wa" id="shareBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                    Compartir por WhatsApp
                </button>
            </div>
        `;

        document.getElementById('restartBtn').addEventListener('click', () => {
            startQuiz();
        });

        document.getElementById('shareBtn').addEventListener('click', () => {
            const url = `https://wa.me/?text=${encodeURIComponent(textoWA)}`;
            window.open(url, '_blank');
        });
    }

    // Iniciar la app
    renderStart();

</script>
