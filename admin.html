<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del profesor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #16332a; --board-line: #244539;
    --paper: #f4efdd; --paper-line: #ddd3ad;
    --ink: #22281f; --ink-muted: #5a5f4f;
    --chalk-amber: #f2c14e; --pen-red: #d9503a; --pen-green: #4f8f5e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--board);
    background-image: linear-gradient(var(--board-line) 1px, transparent 1px), linear-gradient(90deg, var(--board-line) 1px, transparent 1px);
    background-size: 28px 28px;
    font-family: 'Source Sans 3', sans-serif; color: var(--ink);
    display: flex; justify-content: center; padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 720px; }
  .card {
    background: var(--paper); border-radius: 4px; padding: 24px 26px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.15); margin-bottom: 20px;
  }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; margin: 0 0 4px; }
  h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; margin: 0 0 14px; }
  h2.sub { font-size: 15px; margin-top: 26px; }
  .subtitle { color: var(--ink-muted); font-size: 14px; margin: 0 0 18px; }
  label { display: block; font-size: 13px; color: var(--ink-muted); margin: 12px 0 4px; }
  input, select, textarea {
    width: 100%; padding: 9px 11px; border: 1.5px solid var(--paper-line);
    border-radius: 4px; background: #fff; font-size: 14px; font-family: inherit;
  }
  textarea { min-height: 120px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; }
  button {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px;
    cursor: pointer; border: none; border-radius: 4px; padding: 9px 16px;
  }
  .btn-primary { background: var(--ink); color: var(--paper); margin-top: 14px; }
  .btn-small { background: var(--chalk-amber); color: var(--ink); font-size: 13px; padding: 6px 12px; }
  .btn-outline { background: none; border: 1.5px solid var(--ink-muted); color: var(--ink); font-size: 13px; padding: 6px 12px; }
  .btn-link { background: none; color: var(--ink-muted); text-decoration: underline; font-family: 'Source Sans 3'; font-size: 13px; padding: 4px 0; }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  .pwd-wrap { position: relative; }
  .pwd-wrap button { position: absolute; right: 6px; top: 6px; padding: 4px 10px; font-size: 12px; }
  .check-list { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 4px; }
  .check-list label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink); margin: 0; }
  .check-list input { width: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13.5px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--paper-line); vertical-align: top; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .pill.on { background: #ecf5ed; color: var(--pen-green); }
  .pill.off { background: #f1eee0; color: var(--ink-muted); }
  .error { color: var(--pen-red); font-size: 13px; margin-top: 8px; min-height: 14px; }
  .ok-msg { color: var(--pen-green); font-size: 13px; margin-top: 8px; }
  .hidden { display: none; }
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .hint { font-size: 12px; color: var(--ink-muted); margin-top: 6px; line-height: 1.5; }
  code { background: #ece6cf; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://qiawcxkmszgwvxlbbcdw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpYXdjeGttc3pnd3Z4bGJiY2R3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNDU2NjgsImV4cCI6MjEwNDgyMTY2OH0.Yw57xGupEs2f7s1lYIw9Gx1UUP2gg18FbgKj8LVzMfY';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const clienteCreacion = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, storageKey: 'temp-creacion-cuentas' }
});
const app = document.getElementById('app');
const DOMINIO_INTERNO = 'quizapp.com';

function sanitizarUsuario(u) {
  return (u || '').trim().toLowerCase().replace(/[^a-z0-9._-]/g, '');
}

let me = { id: null, rol: null };
let cortesCache = [];
let grupoActivo = null;
let seleccionQuizzes = new Set();

async function init() {
  if (SUPABASE_URL.includes('TU_SUPABASE')) {
    app.innerHTML = `<div class="card"><h1>Falta configurar</h1><p class="subtitle">Reemplaza SUPABASE_URL y SUPABASE_ANON_KEY al inicio del archivo.</p></div>`;
    return;
  }
  const { data: { session } } = await supabase.auth.getSession();
  if (session) loadDashboard(); else renderLogin();
}

function renderLogin() {
  app.innerHTML = `
    <div class="card">
      <h1>Panel del profesor</h1>
      <p class="subtitle">Inicia sesión con tu cuenta de administrador o profesor</p>
      <label>Usuario</label><input type="text" id="usuario" autocomplete="username">
      <label>Contraseña</label><input type="password" id="password" autocomplete="current-password">
      <button class="btn-primary" id="loginBtn">Entrar</button>
      <div class="error" id="err"></div>
    </div>`;
  document.getElementById('loginBtn').onclick = async () => {
    const usuario = sanitizarUsuario(document.getElementById('usuario').value);
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('err');
    const { data: emailReal } = await supabase.rpc('obtener_email_por_usuario', { p_usuario: usuario });
    if (!emailReal) { errEl.textContent = 'Usuario o contraseña incorrectos.'; return; }
    const { error } = await supabase.auth.signInWithPassword({ email: emailReal, password });
    if (error) { errEl.textContent = 'Usuario o contraseña incorrectos.'; return; }
    loadDashboard();
  };
}

async function loadDashboard() {
  const { data: { user } } = await supabase.auth.getUser();
  const { data: perfil } = await supabase.from('perfiles').select('id, rol, usuario').eq('id', user.id).single();
  me = perfil;

  if (me.rol === 'estudiante') {
    app.innerHTML = `<div class="card"><h1>Panel del profesor</h1><p class="subtitle">Esta página es solo para profesores y administradores. Usa la página de estudiante para tomar tus quizzes.</p>
    <button class="btn-link" id="logout">Salir</button></div>`;
    document.getElementById('logout').onclick = async () => { await supabase.auth.signOut(); renderLogin(); };
    return;
  }

  const { data: cortes } = await supabase.from('cortes').select('*').order('numero');
  cortesCache = cortes || [];

  if (me.rol === 'admin') {
    app.innerHTML = `
      <div class="card">
        <div class="topbar"><h1>Panel del administrador</h1><button class="btn-link" id="logout">Salir</button></div>
        <p class="subtitle">${me.usuario} · rol: ${me.rol}</p>
      </div>
      <div id="adminSection"></div>
      <div id="cortesSection" class="card"></div>
      <div id="quizzesGlobalSection" class="card"></div>
    `;
    document.getElementById('logout').onclick = async () => { await supabase.auth.signOut(); renderLogin(); };
    renderAdminSection();
    renderCortesSection();
    renderQuizzesGlobalSection();
    return;
  }

  // ---- Vista de profesor ----
  app.innerHTML = `
    <div class="card">
      <div class="topbar"><h1>Panel del profesor</h1><button class="btn-link" id="logout">Salir</button></div>
      <p class="subtitle">${me.usuario} · rol: ${me.rol}</p>
    </div>
    <div class="card">
      <h2>Grupo con el que vas a trabajar</h2>
      <select id="grupoSelect"></select>
    </div>
    <div id="cortesSection" class="card"></div>
    <div id="cargaSection" class="hidden"></div>
    <div id="preguntasSection" class="hidden"></div>
    <div id="quizSection" class="hidden"></div>
    <div id="resultadosSection" class="hidden"></div>
  `;
  document.getElementById('logout').onclick = async () => { await supabase.auth.signOut(); renderLogin(); };
  renderCortesSection();
  await renderGrupoSelect();
}

// ====================================================================
// ADMIN: grupos + profesores
// ====================================================================
function renderAdminSection() {
  const el = document.getElementById('adminSection');
  el.innerHTML = `
    <div class="card">
      <h2>Crear grupo</h2>
      <div class="row">
        <div><label>Nombre</label><input id="gNombre" placeholder="4to Secundaria A"></div>
        <div><label>Nivel</label><input id="gNivel" placeholder="Secundaria"></div>
        <div><button class="btn-primary" id="gCrear">Crear grupo</button></div>
      </div>
      <div class="error" id="gErr"></div>
      <table id="gruposTabla"><tr><th>Nombre</th><th>Nivel</th><th></th></tr></table>
    </div>
    <div class="card">
      <h2>Crear profesor</h2>
      <p class="subtitle">Tú le asignas usuario y clave directamente, y eliges de una vez a qué grupo(s) queda a cargo.</p>
      <div class="row">
        <div><label>Usuario</label><input id="profUsuario" placeholder="jperez" autocomplete="off"></div>
        <div>
          <label>Contraseña</label>
          <div class="pwd-wrap">
            <input id="profPassword" type="password" autocomplete="new-password">
            <button type="button" class="btn-link" id="verClaveBtn">Ver</button>
          </div>
        </div>
      </div>
      <label>Grupo(s) a cargo</label>
      <div class="check-list" id="profGruposCheck"></div>
      <button class="btn-primary" id="profCrear">Crear profesor</button>
      <div class="error" id="profErr"></div>

      <h2 class="sub">Profesores</h2>
      <table id="profesoresTabla"><tr><th>Usuario</th><th>Grupos a cargo</th><th></th><th></th></tr></table>
    </div>
  `;

  document.getElementById('verClaveBtn').onclick = () => {
    const inp = document.getElementById('profPassword');
    const btn = document.getElementById('verClaveBtn');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    btn.textContent = inp.type === 'password' ? 'Ver' : 'Ocultar';
  };

  document.getElementById('gCrear').onclick = async () => {
    const nombre = document.getElementById('gNombre').value.trim();
    const nivel = document.getElementById('gNivel').value.trim();
    if (!nombre) { document.getElementById('gErr').textContent = 'Ponle un nombre al grupo.'; return; }
    const { error } = await supabase.from('grupos').insert({ nombre, nivel });
    if (error) { document.getElementById('gErr').textContent = error.message; return; }
    document.getElementById('gNombre').value = ''; document.getElementById('gNivel').value = '';
    document.getElementById('gErr').textContent = '';
    await Promise.all([renderGruposTabla(), poblarProfGruposCheck(), renderProfesoresTabla()]);
  };

  document.getElementById('profCrear').onclick = async () => {
    const usuario = sanitizarUsuario(document.getElementById('profUsuario').value);
    const password = document.getElementById('profPassword').value;
    const grupoIds = Array.from(document.querySelectorAll('#profGruposCheck input:checked')).map(c => c.value);
    const errEl = document.getElementById('profErr');
    errEl.textContent = '';
    if (!usuario || !password) { errEl.textContent = 'Completa usuario y contraseña.'; return; }
    if (!grupoIds.length) { errEl.textContent = 'Marca al menos un grupo.'; return; }

    const { data: existente } = await supabase.rpc('obtener_email_por_usuario', { p_usuario: usuario });
    if (existente) { errEl.textContent = 'Ese usuario ya existe. Prueba con otro.'; return; }

    const email = `${usuario}@${DOMINIO_INTERNO}`;
    const { data, error } = await clienteCreacion.auth.signUp({ email, password });
    if (error) { errEl.textContent = error.message; return; }

    const nuevoId = data.user.id;
    const { error: errRol } = await supabase.from('perfiles').update({ rol: 'profesor' }).eq('id', nuevoId);
    const { error: errGrupos } = await supabase.from('profesor_grupos')
      .insert(grupoIds.map(gid => ({ profesor_id: nuevoId, grupo_id: gid })));
    if (errRol || errGrupos) { errEl.textContent = (errRol || errGrupos).message; return; }

    errEl.innerHTML = '<span class="ok-msg">Profesor creado y asignado.</span>';
    document.getElementById('profUsuario').value = '';
    document.getElementById('profPassword').value = '';
    document.querySelectorAll('#profGruposCheck input:checked').forEach(c => c.checked = false);
    renderProfesoresTabla();
  };

  renderGruposTabla();
  poblarProfGruposCheck();
  renderProfesoresTabla();
}

async function poblarProfGruposCheck() {
  const cont = document.getElementById('profGruposCheck');
  if (!cont) return;
  const { data: grupos } = await supabase.from('grupos').select('id, nombre').order('nombre');
  cont.innerHTML = (grupos || []).map(g => `<label><input type="checkbox" value="${g.id}"> ${g.nombre}</label>`).join('') || '<p class="hint">Crea un grupo primero.</p>';
}

async function renderGruposTabla() {
  const { data: grupos } = await supabase.from('grupos').select('id, nombre, nivel').order('nombre');
  const tabla = document.getElementById('gruposTabla');
  if (!tabla) return;
  tabla.innerHTML = '<tr><th>Nombre</th><th>Nivel</th><th></th></tr>' +
    (grupos || []).map(g => `<tr><td>${g.nombre}</td><td>${g.nivel || '-'}</td><td><button class="btn-outline borrarGrupoBtn" data-id="${g.id}">Borrar</button></td></tr>`).join('');
  tabla.querySelectorAll('.borrarGrupoBtn').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('¿Borrar este grupo? Falla si todavía tiene preguntas, quizzes o estudiantes enlazados.')) return;
      const { error } = await supabase.from('grupos').delete().eq('id', btn.dataset.id);
      if (error) { alert('No se pudo borrar: ' + error.message); return; }
      await Promise.all([renderGruposTabla(), poblarProfGruposCheck(), renderProfesoresTabla()]);
    };
  });
}

async function renderProfesoresTabla() {
  const tabla = document.getElementById('profesoresTabla');
  if (!tabla) return;
  const { data: profesores } = await supabase.from('perfiles').select('id, usuario').eq('rol', 'profesor').order('usuario');
  const { data: asignaciones } = await supabase.from('profesor_grupos').select('id, profesor_id, grupo_id, grupos(nombre)');
  const { data: grupos } = await supabase.from('grupos').select('id, nombre').order('nombre');

  tabla.innerHTML = '<tr><th>Usuario</th><th>Grupos a cargo</th><th></th><th></th></tr>' +
    (profesores || []).map(p => {
      const asignados = (asignaciones || []).filter(a => a.profesor_id === p.id);
      const nombres = asignados.map(a => a.grupos ? a.grupos.nombre : '').filter(Boolean).join(', ') || '—';
      return `<tr><td>${p.usuario}</td><td>${nombres}</td>
        <td><button class="btn-outline editarBtn" data-id="${p.id}">Editar grupos</button></td>
        <td><button class="btn-outline resetBtn" data-id="${p.id}" data-usuario="${p.usuario}">Restablecer clave</button></td>
      </tr>`;
    }).join('');

  tabla.querySelectorAll('.resetBtn').forEach(btn => {
    btn.onclick = () => {
      const fila = btn.closest('tr');
      const celda = fila.children[3];
      celda.innerHTML = `
        <div style="display:flex; gap:6px; align-items:center;">
          <input type="password" class="nuevaClaveInput" placeholder="Nueva clave" style="width:140px">
          <button class="btn-small confirmarResetBtn">Guardar</button>
        </div>
        <div class="error resetErr"></div>`;
      celda.querySelector('.confirmarResetBtn').onclick = async () => {
        const nuevaClave = celda.querySelector('.nuevaClaveInput').value;
        const errBox = celda.querySelector('.resetErr');
        if (!nuevaClave || nuevaClave.length < 6) { errBox.textContent = 'Mínimo 6 caracteres.'; return; }
        const { data, error } = await supabase.functions.invoke('resetear-clave', {
          body: { usuario_id: btn.dataset.id, nueva_clave: nuevaClave }
        });
        if (error || (data && data.error)) { errBox.textContent = (data && data.error) || error.message; return; }
        celda.innerHTML = '<span class="ok-msg">Clave actualizada.</span>';
      };
    };
  });

  tabla.querySelectorAll('.editarBtn').forEach(btn => {
    btn.onclick = () => {
      const profId = btn.dataset.id;
      const asignados = new Set((asignaciones || []).filter(a => a.profesor_id === profId).map(a => a.grupo_id));
      const fila = btn.closest('tr');
      const celdaGrupos = fila.children[1];
      celdaGrupos.innerHTML = `<div class="check-list">${(grupos || []).map(g =>
        `<label><input type="checkbox" value="${g.id}" ${asignados.has(g.id) ? 'checked' : ''}> ${g.nombre}</label>`
      ).join('')}</div>`;
      btn.textContent = 'Guardar';
      btn.onclick = async () => {
        const seleccionados = Array.from(celdaGrupos.querySelectorAll('input:checked')).map(c => c.value);
        await supabase.from('profesor_grupos').delete().eq('profesor_id', profId);
        if (seleccionados.length) {
          await supabase.from('profesor_grupos').insert(seleccionados.map(gid => ({ profesor_id: profId, grupo_id: gid })));
        }
        renderProfesoresTabla();
      };
    };
  });
}

// ====================================================================
// Cortes (compartido, admin puede crear, profesor solo ve)
// ====================================================================
function renderCortesSection() {
  const el = document.getElementById('cortesSection');
  el.innerHTML = `
    <h2>Cortes (bimestres)</h2>
    <p class="subtitle">Estos son globales, los usan todos los grupos.</p>
    <table id="cortesTabla"><tr><th>Número</th><th>Nombre</th>${me.rol === 'admin' ? '<th></th>' : ''}</tr></table>
    ${me.rol === 'admin' ? `
    <div class="row" style="margin-top:14px">
      <div><label>Número</label><input id="cNumero" type="number" placeholder="1"></div>
      <div><label>Nombre</label><input id="cNombre" placeholder="Primer bimestre"></div>
      <div><button class="btn-outline" id="cCrear">Agregar corte</button></div>
    </div>
    <div class="error" id="cErr"></div>` : ''}
  `;
  const tabla = document.getElementById('cortesTabla');
  cortesCache.forEach(c => {
    tabla.innerHTML += `<tr><td>${c.numero}</td><td>${c.nombre}</td>${me.rol === 'admin' ? `<td><button class="btn-outline borrarCorteBtn" data-id="${c.id}">Borrar</button></td>` : ''}</tr>`;
  });
  if (me.rol === 'admin') {
    document.getElementById('cCrear').onclick = async () => {
      const numero = Number(document.getElementById('cNumero').value);
      const nombre = document.getElementById('cNombre').value.trim();
      if (!numero || !nombre) { document.getElementById('cErr').textContent = 'Completa número y nombre.'; return; }
      const { error } = await supabase.from('cortes').insert({ numero, nombre });
      if (error) { document.getElementById('cErr').textContent = error.message; return; }
      const { data: cortes } = await supabase.from('cortes').select('*').order('numero');
      cortesCache = cortes || [];
      renderCortesSection();
    };
    tabla.querySelectorAll('.borrarCorteBtn').forEach(btn => {
      btn.onclick = async () => {
        if (!confirm('¿Borrar este corte? Falla si algún quiz todavía apunta a él directamente.')) return;
        const { error } = await supabase.from('cortes').delete().eq('id', btn.dataset.id);
        if (error) { alert('No se pudo borrar: ' + error.message); return; }
        const { data: cortes } = await supabase.from('cortes').select('*').order('numero');
        cortesCache = cortes || [];
        renderCortesSection();
      };
    });
  }
}

// ====================================================================
// ADMIN: ver quizzes por grupo y combinar en uno nuevo
// ====================================================================
async function renderQuizzesGlobalSection() {
  const el = document.getElementById('quizzesGlobalSection');
  const { data: grupos } = await supabase.from('grupos').select('id, nombre').order('nombre');
  el.innerHTML = `
    <h2>Ver quizzes por grupo</h2>
    <p class="subtitle">Marca quizzes (de uno o varios grupos) para combinarlos en un quiz nuevo. El contenido de preguntas lo maneja el profesor; aquí solo puedes armar combinaciones a partir de lo que ya existe.</p>
    <select id="verGrupoSelect">${(grupos || []).map(g => `<option value="${g.id}">${g.nombre}</option>`).join('') || '<option value="">No hay grupos</option>'}</select>
    <table id="quizzesPorGrupoTabla"><tr><th></th><th>Título</th><th>Modo</th><th>Estado</th></tr></table>
    <p class="hint">Seleccionados para combinar: <span id="contadorSeleccion">0</span></p>
    <div id="combinarForm" class="hidden">
      <label>Título del nuevo quiz</label><input id="combTitulo" placeholder="Repaso general">
      <div class="row">
        <div><label>Modo</label><select id="combModo"><option value="practica">Práctica</option><option value="examen">Examen</option></select></div>
        <div><label>Grupo destino</label><select id="combGrupoDestino">${(grupos || []).map(g => `<option value="${g.id}">${g.nombre}</option>`).join('')}</select></div>
      </div>
      <label><input type="checkbox" id="combActivo" checked style="width:auto;display:inline-block;margin-right:6px"> Activo desde ya</label>
      <button class="btn-primary" id="combCrear">Crear quiz combinado</button>
      <div class="error" id="combErr"></div>
    </div>
  `;
  document.getElementById('verGrupoSelect').onchange = renderQuizzesPorGrupo;
  document.getElementById('combCrear').onclick = crearQuizCombinado;
  if (grupos && grupos.length) renderQuizzesPorGrupo();
}

async function renderQuizzesPorGrupo() {
  const grupoId = document.getElementById('verGrupoSelect').value;
  const { data: quizzes } = await supabase.from('quizzes').select('id, titulo, modo, activo').eq('grupo_id', grupoId).order('created_at', { ascending: false });
  const tabla = document.getElementById('quizzesPorGrupoTabla');
  tabla.innerHTML = '<tr><th></th><th>Título</th><th>Modo</th><th>Estado</th></tr>' +
    (quizzes || []).map(q => `
      <tr>
        <td><input type="checkbox" class="seleccionQuizChk" value="${q.id}" ${seleccionQuizzes.has(q.id) ? 'checked' : ''}></td>
        <td>${q.titulo}</td><td>${q.modo}</td>
        <td><span class="pill ${q.activo ? 'on' : 'off'}">${q.activo ? 'activo' : 'inactivo'}</span></td>
      </tr>`).join('') || '<tr><td colspan="4">Este grupo todavía no tiene quizzes.</td></tr>';

  tabla.querySelectorAll('.seleccionQuizChk').forEach(chk => {
    chk.onchange = () => {
      if (chk.checked) seleccionQuizzes.add(chk.value); else seleccionQuizzes.delete(chk.value);
      actualizarContadorSeleccion();
    };
  });
  actualizarContadorSeleccion();
}

function actualizarContadorSeleccion() {
  document.getElementById('contadorSeleccion').textContent = seleccionQuizzes.size;
  document.getElementById('combinarForm').classList.toggle('hidden', seleccionQuizzes.size === 0);
}

async function crearQuizCombinado() {
  const titulo = document.getElementById('combTitulo').value.trim();
  const modo = document.getElementById('combModo').value;
  const grupoDestino = document.getElementById('combGrupoDestino').value;
  const activo = document.getElementById('combActivo').checked;
  const errEl = document.getElementById('combErr');
  errEl.textContent = '';
  if (!titulo) { errEl.textContent = 'Ponle un título al quiz combinado.'; return; }
  if (!seleccionQuizzes.size) { errEl.textContent = 'Marca al menos un quiz.'; return; }

  const { data: qp } = await supabase.from('quiz_preguntas').select('pregunta_id').in('quiz_id', Array.from(seleccionQuizzes));
  const preguntaIds = [...new Set((qp || []).map(r => r.pregunta_id))];

  const { data: nuevoQuiz, error } = await supabase.from('quizzes').insert({
    grupo_id: grupoDestino, titulo, modo, alcance: 'grupo_preguntas', activo
  }).select('id').single();
  if (error) { errEl.textContent = error.message; return; }

  if (preguntaIds.length) {
    const filas = preguntaIds.map((pid, i) => ({ quiz_id: nuevoQuiz.id, pregunta_id: pid, orden: i + 1 }));
    await supabase.from('quiz_preguntas').insert(filas);
  }

  errEl.innerHTML = `<span class="ok-msg">Quiz combinado creado con ${preguntaIds.length} preguntas.</span>`;
  seleccionQuizzes.clear();
  renderQuizzesPorGrupo();
}

async function renderGrupoSelect() {
  const { data: grupos } = await supabase.from('grupos').select('id, nombre').order('nombre');
  const sel = document.getElementById('grupoSelect');
  if (!grupos || !grupos.length) {
    sel.innerHTML = `<option>No tienes grupos asignados todavía</option>`;
    return;
  }
  sel.innerHTML = grupos.map(g => `<option value="${g.id}">${g.nombre}</option>`).join('');
  grupoActivo = grupos[0].id;
  sel.onchange = () => { grupoActivo = sel.value; renderCargaSection(); renderPreguntasSection(); renderQuizSection(); };
  renderCargaSection(); renderPreguntasSection(); renderQuizSection();
}

  const el = document.getElementById('cargaSection');
  el.classList.remove('hidden');
  el.innerHTML = `
    <div class="card">
      <h2>Carga masiva de preguntas</h2>
      <p class="subtitle">Pega filas copiadas de Excel (separadas por tabulaciones) o un CSV. Una pregunta por fila, en este orden de columnas:</p>
      <p class="hint"><code>tipo, corte_numero, enunciado, imagen_url, opcion_1, correcta_1, opcion_2, correcta_2, opcion_3, correcta_3, opcion_4, correcta_4, respuesta_correcta</code></p>
      <p class="hint">
        · <code>tipo</code>: <code>opcion_unica</code> o <code>completar</code><br>
        · en <code>correcta_N</code> escribe <code>V</code> o <code>F</code><br>
        · deja vacías las columnas de opciones si el tipo es <code>completar</code>, y llena solo <code>respuesta_correcta</code><br>
        · <code>imagen_url</code> es opcional, déjala vacía si no aplica<br>
        · si tu primera fila es de encabezados (con la palabra "tipo"), se ignora automáticamente
      </p>
      <button class="btn-outline" id="plantillaBtn" style="margin-bottom:10px">Descargar plantilla de ejemplo</button>
      <textarea id="csvInput" placeholder="opcion_unica,1,¿La capital de Perú es Lima?,,Verdadero,V,Falso,F,,,,,&#10;completar,1,El símbolo químico del oro es ___,,,,,,,,,,Au"></textarea>
      <button class="btn-primary" id="cargarBtn">Cargar preguntas</button>
      <div class="error" id="cargaErr"></div>
    </div>
  `;
  document.getElementById('plantillaBtn').onclick = () => {
    const contenido = 'tipo,corte_numero,enunciado,imagen_url,opcion_1,correcta_1,opcion_2,correcta_2,opcion_3,correcta_3,opcion_4,correcta_4,respuesta_correcta\n' +
      'opcion_unica,1,¿La capital de Perú es Lima?,,Verdadero,V,Falso,F,,,,,\n' +
      'completar,1,El símbolo químico del oro es ___,,,,,,,,,,Au\n';
    const blob = new Blob([contenido], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'plantilla_preguntas.csv'; a.click();
  };
  document.getElementById('cargarBtn').onclick = cargarPreguntas;
}

function esVerdadero(v) {
  return ['v', '1', 'si', 'sí', 'true', 'x'].includes((v || '').trim().toLowerCase());
}

async function cargarPreguntas() {
  const raw = document.getElementById('csvInput').value.trim();
  const errEl = document.getElementById('cargaErr');
  errEl.textContent = '';
  if (!raw) { errEl.textContent = 'Pega al menos una fila.'; return; }
  if (!grupoActivo) { errEl.textContent = 'Selecciona un grupo primero.'; return; }

  let filas = raw.split('\n').map(l => l.trim()).filter(Boolean);
  if (filas[0].toLowerCase().includes('tipo')) filas = filas.slice(1);

  let cargadas = 0, fallidas = 0;
  for (const linea of filas) {
    const delim = linea.includes('\t') ? '\t' : ',';
    const cols = linea.split(delim).map(c => c.trim());
    const [tipoRaw, corteNumRaw, enunciado, imagenUrl, o1, c1, o2, c2, o3, c3, o4, c4, respCorrecta] = cols;
    const tipo = (tipoRaw || 'opcion_unica').toLowerCase();
    const corte = cortesCache.find(c => String(c.numero) === String(corteNumRaw));
    if (!enunciado || !corte) { fallidas++; continue; }

    const { data: pregunta, error: errP } = await supabase.from('preguntas').insert({
      grupo_id: grupoActivo,
      corte_id: corte.id,
      enunciado,
      tipo,
      imagen_url: imagenUrl || null,
      respuesta_correcta: tipo === 'completar' ? (respCorrecta || null) : null
    }).select('id').single();

    if (errP) { fallidas++; continue; }

    if (tipo === 'opcion_unica') {
      const opciones = [[o1, c1], [o2, c2], [o3, c3], [o4, c4]]
        .filter(([texto]) => texto)
        .map(([texto, correcta], i) => ({ pregunta_id: pregunta.id, texto, es_correcta: esVerdadero(correcta), orden: i + 1 }));
      if (opciones.length) await supabase.from('opciones').insert(opciones);
    }
    cargadas++;
  }
  errEl.innerHTML = `<span class="${fallidas ? 'error' : 'ok-msg'}">Cargadas: ${cargadas}. Con error: ${fallidas}.</span>`;
  renderPreguntasSection();
}

async function renderPreguntasSection() {
  const el = document.getElementById('preguntasSection');
  el.classList.remove('hidden');
  const { data: preguntas } = await supabase.from('preguntas')
    .select('id, enunciado, tipo, cortes(numero, nombre)')
    .eq('grupo_id', grupoActivo).order('created_at', { ascending: false });

  el.innerHTML = `
    <div class="card">
      <h2>Preguntas cargadas (${preguntas ? preguntas.length : 0})</h2>
      <table>
        <tr><th>Corte</th><th>Tipo</th><th>Enunciado</th></tr>
        ${(preguntas || []).map(p => `<tr><td>${p.cortes ? p.cortes.numero : '-'}</td><td>${p.tipo}</td><td>${p.enunciado}</td></tr>`).join('')}
      </table>
    </div>
  `;
}

function renderQuizSection() {
  const el = document.getElementById('quizSection');
  el.classList.remove('hidden');
  el.innerHTML = `
    <div class="card">
      <h2>Crear quiz</h2>
      <label>Título</label><input id="qTitulo" placeholder="Práctica bimestre 1">
      <div class="row">
        <div><label>Modo</label>
          <select id="qModo"><option value="practica">Práctica (feedback inmediato)</option><option value="examen">Examen (califica al final)</option></select>
        </div>
        <div><label>Alcance</label>
          <select id="qAlcance"><option value="un_corte">Un corte específico</option><option value="acumulado">Acumulado (todos los cortes)</option></select>
        </div>
        <div id="qCorteWrap"><label>Corte</label>
          <select id="qCorte">${cortesCache.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('')}</select>
        </div>
      </div>
      <label><input type="checkbox" id="qActivo" checked style="width:auto;display:inline-block;margin-right:6px"> Activo desde ya</label>
      <button class="btn-primary" id="qCrear">Crear quiz</button>
      <div class="error" id="qErr"></div>
    </div>
    <div id="listaQuizzes"></div>
  `;
  document.getElementById('qAlcance').onchange = (e) => {
    document.getElementById('qCorteWrap').style.display = e.target.value === 'un_corte' ? 'block' : 'none';
  };
  document.getElementById('qCrear').onclick = crearQuiz;
  renderListaQuizzes();
}

async function crearQuiz() {
  const titulo = document.getElementById('qTitulo').value.trim();
  const modo = document.getElementById('qModo').value;
  const alcance = document.getElementById('qAlcance').value;
  const corteId = alcance === 'un_corte' ? document.getElementById('qCorte').value : null;
  const activo = document.getElementById('qActivo').checked;
  const errEl = document.getElementById('qErr');
  errEl.textContent = '';
  if (!titulo) { errEl.textContent = 'Ponle un título al quiz.'; return; }

  const { data: quiz, error: errQ } = await supabase.from('quizzes').insert({
    grupo_id: grupoActivo, titulo, modo, alcance, corte_id: corteId, activo
  }).select('id').single();
  if (errQ) { errEl.textContent = errQ.message; return; }

  let queryPreguntas = supabase.from('preguntas').select('id').eq('grupo_id', grupoActivo);
  if (alcance === 'un_corte') queryPreguntas = queryPreguntas.eq('corte_id', corteId);
  const { data: preguntas } = await queryPreguntas;

  if (preguntas && preguntas.length) {
    const filas = preguntas.map((p, i) => ({ quiz_id: quiz.id, pregunta_id: p.id, orden: i + 1 }));
    await supabase.from('quiz_preguntas').insert(filas);
  }
  document.getElementById('qTitulo').value = '';
  errEl.innerHTML = `<span class="ok-msg">Quiz creado con ${preguntas ? preguntas.length : 0} preguntas.</span>`;
  renderListaQuizzes();
}

async function renderListaQuizzes() {
  const { data: quizzes } = await supabase.from('quizzes').select('id, titulo, modo, activo').eq('grupo_id', grupoActivo).order('created_at', { ascending: false });
  const el = document.getElementById('listaQuizzes');
  el.innerHTML = `<div class="card"><h2>Quizzes de este grupo</h2>
    <table><tr><th>Título</th><th>Modo</th><th>Estado</th><th></th><th></th></tr>
    ${(quizzes || []).map(q => `
      <tr>
        <td>${q.titulo}</td><td>${q.modo}</td>
        <td><span class="pill ${q.activo ? 'on' : 'off'}">${q.activo ? 'activo' : 'inactivo'}</span></td>
        <td><button class="btn-outline toggleBtn" data-id="${q.id}" data-activo="${q.activo}">${q.activo ? 'Desactivar' : 'Activar'}</button></td>
        <td><button class="btn-outline verBtn" data-id="${q.id}" data-titulo="${q.titulo}">Ver resultados</button></td>
      </tr>`).join('')}
    </table></div>`;

  el.querySelectorAll('.toggleBtn').forEach(btn => {
    btn.onclick = async () => {
      await supabase.from('quizzes').update({ activo: btn.dataset.activo !== 'true' }).eq('id', btn.dataset.id);
      renderListaQuizzes();
    };
  });
  el.querySelectorAll('.verBtn').forEach(btn => {
    btn.onclick = () => verResultados(btn.dataset.id, btn.dataset.titulo);
  });
}

async function verResultados(quizId, titulo) {
  const { data: intentos } = await supabase.from('intentos')
    .select('puntaje_total, estado, estudiantes(nombre)').eq('quiz_id', quizId);
  const el = document.getElementById('resultadosSection');
  el.classList.remove('hidden');
  el.innerHTML = `<div class="card"><h2>Resultados: ${titulo}</h2>
    <table><tr><th>Estudiante</th><th>Puntaje</th><th>Estado</th></tr>
    ${(intentos || []).map(i => `<tr><td>${i.estudiantes ? i.estudiantes.nombre : '-'}</td><td>${i.puntaje_total ?? '-'}</td><td>${i.estado}</td></tr>`).join('') || '<tr><td colspan="3">Nadie lo ha tomado todavía.</td></tr>'}
    </table></div>`;
  el.scrollIntoView({ behavior: 'smooth' });
}
