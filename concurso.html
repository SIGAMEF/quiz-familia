<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concurso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<style>
  :root {
    --paper: #FFFFFF; --paper-line: #EBE3FB; --bg-soft: #FBFAFF;
    --ink: #362F52; --ink-muted: #8E86AC;
    --amber: #FFC857; --red: #FF6F91; --red-bg: #FFE4E9; --green: #4CD98A; --green-bg: #E6FBF0;
    --primary: #7C6FF0; --primary-dark: #6C5CE7; --primary-light: #EDE9FE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(135deg, #F5F1FF 0%, #FDECF5 50%, #EAF6FF 100%);
    font-family: 'Nunito', sans-serif; color: var(--ink);
    display: flex; justify-content: center; padding: 28px 16px;
  }
  .sheet { background: var(--paper); width: 100%; max-width: 480px; border-radius: 24px; padding: 28px 24px; box-shadow: 0 16px 40px rgba(124,111,240,0.18); align-self: flex-start; }
  .sheet.ancho { max-width: 760px; }
  h1 { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 25px; margin: 0 0 4px; line-height: 1.2; }
  h2 { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 18px; margin: 0 0 10px; line-height: 1.35; }
  .subtitle { color: var(--ink-muted); font-size: 14px; margin: 0 0 16px; font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--ink-muted); margin: 12px 0 4px; font-weight: 700; }
  input, select { width: 100%; padding: 11px 14px; border: 2px solid var(--paper-line); border-radius: 12px; background: var(--bg-soft); font-size: 15px; font-family: inherit; color: var(--ink); }
  input:focus, select:focus { outline: none; border-color: var(--primary); }
  button { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; border: none; border-radius: 14px; padding: 12px 18px; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.55; cursor: default; }
  .btn-primary { background: linear-gradient(135deg, #8B7EF7, #6C5CE7); color: #fff; width: 100%; margin-top: 14px; box-shadow: 0 6px 16px rgba(108,92,231,0.3); }
  .btn-outline { background: #fff; border: 2px solid var(--paper-line); color: var(--ink); width: 100%; margin-top: 10px; }
  .btn-link { background: none; color: var(--primary); text-decoration: underline; font-family: 'Nunito'; font-weight: 700; font-size: 13px; padding: 6px 0; }
  .btn-mini { padding: 7px 12px; font-size: 12.5px; border-radius: 10px; }
  .b-primary { background: var(--primary); color: #fff; }
  .b-amber { background: var(--amber); color: var(--ink); }
  .b-red { background: var(--red-bg); color: var(--red); }
  .b-gray { background: var(--primary-light); color: var(--primary); }
  .b-green { background: var(--green-bg); color: #2FAE6C; }
  .acciones { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .error { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 16px; font-weight: 700; }
  .ok-msg { color: #2FAE6C; font-size: 13px; margin-top: 8px; font-weight: 700; }
  .aviso { background: #FFF7ED; color: #B45309; border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 700; margin-top: 10px; }
  .card { border: 2px solid var(--paper-line); border-radius: 16px; padding: 16px; margin-top: 14px; }
  .item-lista { border: 2px solid var(--paper-line); border-radius: 16px; padding: 14px; margin-top: 10px; }
  .item-lista .fila { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .meta { font-size: 12.5px; color: var(--ink-muted); font-weight: 700; margin-top: 6px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 800; margin-right: 4px; }
  .badge.vivo { background: var(--red-bg); color: var(--red); }
  .badge.plazo { background: var(--primary-light); color: var(--primary); }
  .badge.armado { background: #F1EEFB; color: var(--ink-muted); }
  .badge.esperando { background: #FFF7ED; color: #EA580C; }
  .badge.en_curso { background: var(--green-bg); color: #2FAE6C; }
  .badge.finalizado { background: #F1EEFB; color: var(--ink-muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--paper-line); vertical-align: middle; }
  th { color: var(--ink-muted); font-size: 11.5px; text-transform: uppercase; }
  .scroll { max-height: 340px; overflow-y: auto; }
  .check-row { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--paper-line); }
  .check-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); flex-shrink: 0; }
  .check-row input[type="number"] { width: 64px; padding: 6px 8px; flex-shrink: 0; }
  .check-row .texto { flex: 1; font-size: 13.5px; }
  .check-row .tema-mini { font-size: 11px; color: var(--ink-muted); font-weight: 700; }
  .barra-filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .barra-filtros input { flex: 1; min-width: 160px; }
  .barra-filtros select { width: auto; min-width: 150px; }
  .fila-pos { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; margin-top: 7px; font-weight: 700; background: var(--bg-soft); }
  .fila-pos .num { font-family: 'Baloo 2', sans-serif; font-size: 18px; width: 28px; }
  .fila-pos .nombre { flex: 1; }
  .fila-pos .pts { color: var(--primary); white-space: nowrap; }
  .fila-pos.yo { outline: 3px solid var(--primary); }
  .podio { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin: 16px 0 6px; }
  .podio .lugar { text-align: center; flex: 1; max-width: 140px; }
  .podio .bloque { border-radius: 12px 12px 0 0; padding: 10px 6px; font-family: 'Baloo 2', sans-serif; font-weight: 800; }
  .podio .nombre-podio { font-weight: 800; font-size: 13.5px; margin-bottom: 6px; word-break: break-word; }
  .podio .l1 .bloque { background: linear-gradient(135deg,#FFE7A8,#FFC857); height: 110px; }
  .podio .l2 .bloque { background: #E5E1F5; height: 84px; }
  .podio .l3 .bloque { background: #FFD9C2; height: 64px; }
  .option { display: block; width: 100%; text-align: left; background: var(--bg-soft); border: 2px solid var(--paper-line); border-radius: 14px; padding: 13px 16px; margin-bottom: 10px; font-family: 'Nunito'; font-weight: 700; font-size: 15px; color: var(--ink); }
  .option.selected { border-color: var(--primary); }
  .option.correct { border-color: var(--green); background: var(--green-bg); }
  .option.incorrect { border-color: var(--red); background: var(--red-bg); }
  .op-prof { padding: 10px 14px; border-radius: 12px; border: 2px solid var(--paper-line); margin-top: 8px; font-weight: 700; }
  .op-prof.revelada { border-color: var(--green); background: var(--green-bg); }
  .feedback { font-size: 14px; font-weight: 800; margin: 10px 0; padding: 11px 14px; border-radius: 12px; }
  .feedback.correct { color: #2FAE6C; background: var(--green-bg); }
  .feedback.incorrect { color: #E14D72; background: var(--red-bg); }
  .feedback.neutro { color: var(--ink-muted); background: #F1EEFB; }
  .hidden { display: none !important; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
  .cabecera-juego { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .chip { background: var(--green-bg); color: #166534; padding: 5px 12px; border-radius: 20px; font-weight: 800; font-size: 13px; }
  .chip-nombre { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 15px; }
  .fila-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .reloj { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 18px; color: var(--primary); background: var(--primary-light); padding: 4px 12px; border-radius: 12px; }
  .reloj.urgente { color: var(--red); background: var(--red-bg); }
  .tema { display: inline-block; background: var(--primary-light); color: var(--primary); font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 8px; margin-bottom: 8px; text-transform: uppercase; }
  .numero-grande { font-family: 'Baloo 2', sans-serif; font-size: 44px; font-weight: 800; color: var(--primary); text-align: center; margin: 8px 0; }
  .centro { text-align: center; }
  .spinner { width: 40px; height: 40px; border: 5px solid var(--primary-light); border-top-color: var(--primary); border-radius: 50%; margin: 6px auto 12px; animation: girar 0.9s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: var(--bg-soft); border: 2px solid var(--paper-line); border-radius: 14px; padding: 10px; text-align: center; }
  .stat b { display: block; font-family: 'Baloo 2', sans-serif; font-size: 22px; color: var(--primary); }
  .stat span { font-size: 11px; color: var(--ink-muted); font-weight: 800; text-transform: uppercase; }
  .overlay { position: fixed; inset: 0; background: rgba(20,18,35,0.88); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; flex-direction: column; gap: 16px; }
  .overlay .caja-qr { background: #fff; padding: 22px; border-radius: 20px; text-align: center; }
  img.zoomable { max-width: 100%; border-radius: 12px; margin-bottom: 12px; cursor: zoom-in; }
</style>
</head>
<body>
<div class="sheet" id="app"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://qiawcxkmszgwvxlbbcdw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpYXdjeGttc3pnd3Z4bGJiY2R3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNDU2NjgsImV4cCI6MjEwNDgyMTY2OH0.Yw57xGupEs2f7s1lYIw9Gx1UUP2gg18FbgKj8LVzMfY';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');
const $ = (id) => document.getElementById(id);

const ESTADO_LABEL = { armado: 'Borrador', esperando: 'Sala abierta', en_curso: 'En curso', finalizado: 'Finalizado' };
const MODO_LABEL = { vivo: 'En vivo', plazo: 'Por plazo' };

// ====================================================================
// UTILIDADES
// ====================================================================
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function sanitizarUsuario(u) { return (u || '').trim().toLowerCase().replace(/[^a-z0-9._-]/g, ''); }
function anchoSheet(ancho) { app.className = ancho ? 'sheet ancho' : 'sheet'; window.scrollTo(0, 0); }
function fmtSeg(s) { if (s == null || isNaN(s)) return '—'; s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function tokensBusqueda(texto) { return (texto || '').toLowerCase().trim().split(/\s+/).filter(Boolean); }
function coincide(texto, tokens) { const t = (texto || '').toLowerCase(); return tokens.every(k => t.includes(k)); }
function barajar(arr) { const c = [...arr]; for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; }
function badgeModo(m) { return `<span class="badge ${m}">${MODO_LABEL[m] || m}</span>`; }
function badgeEstado(e) { return `<span class="badge ${e}">${ESTADO_LABEL[e] || e}</span>`; }

function decirEnVoz(texto) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'es-ES'; u.volume = 1; u.rate = 1;
    speechSynthesis.speak(u);
  } catch (e) { }
}

function guardarPart(cid, p) { try { localStorage.setItem('cpart_' + cid, JSON.stringify({ id: p.id, token: p.token, alias: p.alias })); } catch (e) { } }
function leerPart(cid) { try { return JSON.parse(localStorage.getItem('cpart_' + cid)); } catch (e) { return null; } }
function borrarPart(cid) { try { localStorage.removeItem('cpart_' + cid); } catch (e) { } }

function descargarCSV(nombreArchivo, filas) {
  const csv = '\uFEFF' + filas.map(f => f.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombreArchivo; a.click();
}

function activarZoomImagenes() {
  document.querySelectorAll('img.zoomable').forEach(img => {
    img.onclick = () => {
      const ov = document.createElement('div');
      ov.className = 'overlay';
      ov.style.cursor = 'zoom-out';
      ov.innerHTML = `<img src="${img.src}" style="max-width:100%; max-height:100%; border-radius:12px;">`;
      ov.onclick = () => ov.remove();
      document.body.appendChild(ov);
    };
  });
}

// ====================================================================
// ESTADO
// ====================================================================
function estadoInicial() {
  return {
    perfil: null, estudiante: null, alias: null, grupoId: null,
    concurso: null, participante: null, preguntas: [], index: 0,
    inicioPregunta: null, timers: [], respondidas: new Map(),
    puntos: 0, aciertos: 0, finalizando: false, pendingConcurso: null
  };
}
let state = estadoInicial();

function limpiar() {
  try { supabase.removeAllChannels(); } catch (e) { }
  state.timers.forEach(t => { clearInterval(t); clearTimeout(t); });
  state.timers = [];
}
function agregarTimer(t) { state.timers.push(t); return t; }

async function salirTodo() {
  limpiar();
  if (state.estudiante || state.perfil) await supabase.auth.signOut();
  state = estadoInicial();
  history.replaceState(null, '', window.location.pathname);
  renderPortada();
}

// ====================================================================
// INICIO
// ====================================================================
async function init() {
  const idDirecto = new URLSearchParams(window.location.search).get('unirse');
  if (idDirecto) { await renderUnionDirecta(idDirecto); return; }

  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    const { data: perfil } = await supabase.from('perfiles').select('id, rol, usuario').eq('id', session.user.id).maybeSingle();
    if (perfil && (perfil.rol === 'admin' || perfil.rol === 'profesor')) { state.perfil = perfil; renderProfesorHome(); return; }
    const { data: estudiante } = await supabase.from('estudiantes').select('id, nombre, grupo_id, avatar').eq('perfil_id', session.user.id).maybeSingle();
    if (estudiante) { state.estudiante = estudiante; state.grupoId = estudiante.grupo_id; renderListaConcursosAlumno(); return; }
  }
  renderPortada();
}

function renderPortada() {
  limpiar(); anchoSheet(false);
  app.innerHTML = `
    <div class="centro"><div style="font-size:56px;">🏆</div></div>
    <h1 class="centro">Concurso</h1>
    <p class="subtitle centro">Un quiz en vivo o contrarreloj para todo el grupo.</p>
    <button class="btn-primary" id="btnAlumno">Unirme a un concurso</button>
    <button class="btn-outline" id="btnProfesor">Soy profesor</button>
    <p class="subtitle centro" style="margin-top:14px; font-size:12.5px;">¿Te pasaron un enlace o QR? Ábrelo directamente y entrarás al concurso.</p>
  `;
  $('btnProfesor').onclick = renderLoginProfesor;
  $('btnAlumno').onclick = renderEntradaAlumno;
}

// ====================================================================
// LOGIN PROFESOR
// ====================================================================
function renderLoginProfesor() {
  limpiar(); anchoSheet(false);
  app.innerHTML = `
    <h1>Panel del profesor</h1>
    <p class="subtitle">Inicia sesión con tu cuenta habitual.</p>
    <label>Usuario</label><input type="text" id="usuario" autocomplete="username">
    <label>Contraseña</label><input type="password" id="password" autocomplete="current-password">
    <button class="btn-primary" id="loginBtn">Entrar</button>
    <button class="btn-link" id="volverBtn">← Volver</button>
    <div class="error" id="err"></div>
  `;
  $('volverBtn').onclick = renderPortada;
  $('loginBtn').onclick = async () => {
    const usuario = sanitizarUsuario($('usuario').value);
    const password = $('password').value;
    const errEl = $('err');
    const { data: emailReal } = await supabase.rpc('obtener_email_por_usuario', { p_usuario: usuario });
    if (!emailReal) { errEl.textContent = 'Usuario o contraseña incorrectos.'; return; }
    const { error } = await supabase.auth.signInWithPassword({ email: emailReal, password });
    if (error) { errEl.textContent = 'Usuario o contraseña incorrectos.'; return; }
    const { data: { user } } = await supabase.auth.getUser();
    const { data: perfil } = await supabase.from('perfiles').select('id, rol, usuario').eq('id', user.id).single();
    if (perfil.rol !== 'admin' && perfil.rol !== 'profesor') { errEl.textContent = 'Esta cuenta no es de profesor.'; await supabase.auth.signOut(); return; }
    state.perfil = perfil;
    renderProfesorHome();
  };
}

// ====================================================================
// ENTRADA ALUMNO / INVITADO
// ====================================================================
function renderEntradaAlumno() {
  limpiar(); anchoSheet(false);
  app.innerHTML = `
    <h1>Unirme a un concurso</h1>
    <p class="subtitle">¿Tienes cuenta de alumno?</p>
    <button class="btn-primary" id="btnTengoCuenta">Sí, iniciar sesión</button>
    <button class="btn-outline" id="btnInvitado">No, entrar como invitado</button>
    <button class="btn-link" id="volverBtn">← Volver</button>
  `;
  $('volverBtn').onclick = renderPortada;
  $('btnTengoCuenta').onclick = renderLoginAlumno;
  $('btnInvitado').onclick = renderEntradaInvitado;
}

function renderLoginAlumno() {
  limpiar(); anchoSheet(false);
  app.innerHTML = `
    <h1>Inicia sesión</h1>
    <label>Usuario</label><input type="text" id="usuario" autocomplete="username">
    <label>Contraseña</label><input type="password" id="password" autocomplete="current-password">
    <button class="btn-primary" id="loginBtn">Entrar</button>
    <button class="btn-link" id="volverBtn">← Volver</button>
    <div class="error" id="err"></div>
  `;
  $('volverBtn').onclick = () => state.pendingConcurso ? renderUnionDirecta(state.pendingConcurso) : renderEntradaAlumno();
  $('loginBtn').onclick = async () => {
    const usuario = sanitizarUsuario($('usuario').value);
    const password = $('password').value;
    const errEl = $('err');
    const { data: emailReal } = await supabase.rpc('obtener_email_por_usuario', { p_usuario: usuario });
    if (!emailReal) { errEl.textContent = 'Usuario o contraseña incorrectos.'; return; }
    const { error } = await supabase.auth.signInWithPassword({ email: emailReal, password });
    if (error) { errEl.textContent = 'Usuario o contraseña incorrectos.'; return; }
    const { data: { user } } = await supabase.auth.getUser();
    const { data: estudiante } = await supabase.from('estudiantes').select('id, nombre, grupo_id, avatar').eq('perfil_id', user.id).maybeSingle();
    if (!estudiante) { errEl.textContent = 'Esta cuenta no es de alumno.'; await supabase.auth.signOut(); return; }
    state.estudiante = estudiante;
    state.grupoId = estudiante.grupo_id;
    if (state.pendingConcurso) { const id = state.pendingConcurso; state.pendingConcurso = null; entrarAConcurso(id, estudiante.nombre); }
    else renderListaConcursosAlumno();
  };
}

async function renderEntradaInvitado() {
  limpiar(); anchoSheet(false);
  const { data: grupos } = await supabase.from('grupos').select('id, nombre').order('nombre');
  app.innerHTML = `
    <h1>Entrar como invitado</h1>
    <label>Tu nombre o alias</label><input type="text" id="alias" placeholder="Ej: Lucas" maxlength="30">
    <label>Grupo</label><select id="grupoSel">${(grupos || []).map(g => `<option value="${g.id}">${esc(g.nombre)}</option>`).join('') || '<option value="">No hay grupos</option>'}</select>
    <button class="btn-primary" id="continuarBtn">Continuar</button>
    <button class="btn-link" id="volverBtn">← Volver</button>
    <div class="error" id="err"></div>
  `;
  $('volverBtn').onclick = renderEntradaAlumno;
  $('continuarBtn').onclick = () => {
    const alias = $('alias').value.trim();
    const grupoId = $('grupoSel').value;
    if (!alias) { $('err').textContent = 'Escribe un nombre o alias.'; return; }
    if (!grupoId) { $('err').textContent = 'Elige un grupo.'; return; }
    state.alias = alias;
    state.grupoId = grupoId;
    renderListaConcursosAlumno();
  };
}

// ---------------- Enlace / QR directo ----------------
async function renderUnionDirecta(concursoId) {
  limpiar(); anchoSheet(false);
  const { data: concurso } = await supabase.from('concursos').select('id, titulo, modo, estado, grupo_id').eq('id', concursoId).maybeSingle();
  if (!concurso) { app.innerHTML = `<h1>Enlace inválido</h1><p class="subtitle">Este concurso ya no existe.</p><button class="btn-outline" id="ir">Ir al inicio</button>`; $('ir').onclick = salirTodo; return; }
  state.grupoId = state.grupoId || concurso.grupo_id;

  if (concurso.estado === 'finalizado') { state.concurso = concurso; renderTablaPosicionesAlumno(); return; }

  if (concurso.estado === 'armado') {
    app.innerHTML = `
      <h1>${esc(concurso.titulo)}</h1>
      <div class="card centro"><div class="spinner"></div><p style="font-weight:800;">El profesor todavía no abrió la sala.</p><p class="subtitle" style="margin:0;">Esta pantalla se actualiza sola.</p></div>`;
    agregarTimer(setInterval(async () => {
      const { data } = await supabase.from('concursos').select('estado').eq('id', concursoId).maybeSingle();
      if (data && data.estado !== 'armado') renderUnionDirecta(concursoId);
    }, 5000));
    return;
  }

  // Si este navegador ya estaba dentro de este concurso, lo reconectamos directo
  const guardado = leerPart(concursoId);
  if (guardado) { entrarAConcurso(concursoId, guardado.alias); return; }

  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    const { data: estudiante } = await supabase.from('estudiantes').select('id, nombre, grupo_id, avatar').eq('perfil_id', session.user.id).maybeSingle();
    if (estudiante) {
      state.estudiante = estudiante;
      app.innerHTML = `
        <h1>${esc(concurso.titulo)}</h1>
        <p class="subtitle">${badgeModo(concurso.modo)} ${badgeEstado(concurso.estado)}</p>
        <button class="btn-primary" id="unirseBtn">Unirme como ${esc(estudiante.nombre)}</button>`;
      $('unirseBtn').onclick = () => entrarAConcurso(concursoId, estudiante.nombre);
      return;
    }
  }

  app.innerHTML = `
    <h1>${esc(concurso.titulo)}</h1>
    <p class="subtitle">${badgeModo(concurso.modo)} ${badgeEstado(concurso.estado)}</p>
    <label>Tu nombre o alias</label><input type="text" id="alias" placeholder="Ej: Lucas" maxlength="30">
    <button class="btn-primary" id="unirseBtn">Unirme</button>
    <button class="btn-link" id="cuentaBtn" style="width:100%;">¿Tienes cuenta de alumno? Inicia sesión</button>
    <div class="error" id="err"></div>
  `;
  $('cuentaBtn').onclick = () => { state.pendingConcurso = concursoId; renderLoginAlumno(); };
  $('unirseBtn').onclick = () => {
    const alias = $('alias').value.trim();
    if (!alias) { $('err').textContent = 'Escribe un nombre o alias.'; return; }
    state.alias = alias;
    entrarAConcurso(concursoId, alias);
  };
}

// ====================================================================
// ALUMNO / INVITADO: lista de concursos
// ====================================================================
async function renderListaConcursosAlumno() {
  limpiar(); anchoSheet(false);
  const { data: concursos } = await supabase.from('concursos').select('id, titulo, modo, estado')
    .eq('grupo_id', state.grupoId).in('estado', ['esperando', 'en_curso', 'finalizado'])
    .order('created_at', { ascending: false }).limit(15);

  const nombre = state.estudiante ? state.estudiante.nombre : state.alias;
  app.innerHTML = `
    <div class="topbar"><h1>Hola, ${esc(nombre)}</h1><button class="btn-link" id="salirBtn">Salir</button></div>
    <p class="subtitle">Concursos de tu grupo</p>
    <div id="lista"></div>
    <button class="btn-outline" id="refrescarBtn">🔄 Actualizar</button>
  `;
  $('salirBtn').onclick = salirTodo;
  $('refrescarBtn').onclick = renderListaConcursosAlumno;
  const lista = $('lista');
  if (!concursos || !concursos.length) { lista.innerHTML = '<p class="subtitle centro">No hay concursos abiertos por ahora.</p>'; return; }

      <button class="btn-mini ${abierto ? 'b-amber' : 'b-gray'}">${abierto ? 'Unirme' : 'Ver posiciones'}</button></div>`;
    div.querySelector('button').onclick = () => entrarAConcurso(c.id, nombre);
    lista.appendChild(div);
  });
}

// ====================================================================
// ALUMNO / INVITADO: entrar al concurso (une o reconecta)
// ====================================================================
async function entrarAConcurso(concursoId, alias) {
  limpiar(); anchoSheet(false);
  app.innerHTML = `<div class="centro"><div class="spinner"></div><p class="subtitle">Entrando...</p></div>`;
  const { data: concurso } = await supabase.from('concursos')
    .select('id, titulo, modo, estado, grupo_id, tiempo_por_pregunta_seg, tiempo_total_seg, pregunta_actual_index')
    .eq('id', concursoId).maybeSingle();
  if (!concurso) { app.innerHTML = `<h1>Concurso no encontrado</h1><button class="btn-outline" id="ir">Ir al inicio</button>`; $('ir').onclick = salirTodo; return; }
  state.concurso = concurso;
  state.grupoId = state.grupoId || concurso.grupo_id;
  state.finalizando = false;

  if (concurso.estado === 'finalizado') { renderTablaPosicionesAlumno(); return; }
  if (!['esperando', 'en_curso'].includes(concurso.estado)) {
    app.innerHTML = `<h1>${esc(concurso.titulo)}</h1><p class="subtitle">Este concurso todavía no está abierto.</p><button class="btn-outline" id="ir">Volver</button>`;
    $('ir').onclick = renderListaConcursosAlumno; return;
  }

  let part = leerPart(concursoId);
  if (part) {
    const { data: fila } = await supabase.from('concurso_participantes').select('id, estado, iniciado_en, alias').eq('id', part.id).maybeSingle();
    if (!fila) { borrarPart(concursoId); part = null; } else part = { ...part, ...fila };
  }
  if (!part) {
    const { data, error } = await supabase.rpc('unirse_concurso', { p_concurso_id: concursoId, p_alias: alias });
    if (error || !data || !data.length) {
      app.innerHTML = `<h1>No se pudo unir</h1><p class="subtitle">${esc(error ? error.message : 'Intenta de nuevo.')}</p><button class="btn-outline" id="ir">Volver</button>`;
      $('ir').onclick = salirTodo; return;
    }
    part = { id: data[0].participante_id, token: data[0].token, alias };
    guardarPart(concursoId, part);
    const { data: fila } = await supabase.from('concurso_participantes').select('id, estado, iniciado_en, alias').eq('id', part.id).maybeSingle();
    part = { ...part, ...(fila || {}) };
  }
  state.participante = part;

  // Recuperar lo que ya había respondido (por si se reconecta)
  state.respondidas = new Map(); state.puntos = 0; state.aciertos = 0;
  const { data: resp } = await supabase.rpc('obtener_respondidas_concurso', { p_participante_id: part.id, p_token: part.token });
  (resp || []).forEach(r => {
    state.respondidas.set(r.rp_pregunta, { correcta: r.rp_correcta });
    if (r.rp_correcta) state.aciertos++;
    state.puntos += Number(r.rp_puntos || 0);
  });

  if (part.estado === 'finalizado') { renderTablaPosicionesAlumno(); return; }

  if (concurso.estado === 'esperando') { renderSalaEsperaAlumno(); return; }
  await cargarPreguntasConcurso();
  if (concurso.modo === 'vivo') { state.index = concurso.pregunta_actual_index || 0; renderPreguntaVivo(); }
  else renderPantallaEmpezarPlazo();
}

async function cargarPreguntasConcurso() {
  const { data } = await supabase.rpc('obtener_preguntas_concurso', { p_concurso_id: state.concurso.id });
  state.preguntas = data || [];
}

// ---------------- Escuchar cambios del concurso (tiempo real + respaldo) ----------------
function escucharConcursoAlumno() {
  const id = state.concurso.id;
  supabase.channel('al-' + id)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'concursos', filter: `id=eq.${id}` }, (payload) => procesarCambioConcurso(payload.new))
    .subscribe();
  agregarTimer(setInterval(async () => {
    const { data } = await supabase.from('concursos').select('id, titulo, modo, estado, grupo_id, tiempo_por_pregunta_seg, tiempo_total_seg, pregunta_actual_index').eq('id', id).maybeSingle();
    if (data) procesarCambioConcurso(data);
  }, 5000));
}

async function procesarCambioConcurso(nuevo) {
  const previo = state.concurso;
  if (!previo || nuevo.id !== previo.id) return;
  state.concurso = { ...previo, ...nuevo };

  // El profesor reinició la partida: volvemos a unirnos limpios
  if (nuevo.estado === 'esperando' && (previo.estado === 'en_curso' || previo.estado === 'finalizado')) {
    borrarPart(nuevo.id);
    const alias = state.participante ? state.participante.alias : (state.alias || '');
    limpiar();
    alert('El profesor reinició el concurso. Te volvemos a unir.');
    entrarAConcurso(nuevo.id, alias);
    return;
  }
  if (nuevo.estado === 'finalizado' && previo.estado !== 'finalizado') {
    if (nuevo.modo === 'plazo' && state.participante && state.participante.estado !== 'finalizado') await finalizarConcursoAlumno();
    else renderTablaPosicionesAlumno();
    return;
  }
  if (nuevo.estado === 'en_curso' && previo.estado !== 'en_curso') {
    await cargarPreguntasConcurso();
    if (nuevo.modo === 'vivo') { state.index = nuevo.pregunta_actual_index || 0; renderPreguntaVivo(); }
    else renderPantallaEmpezarPlazo();
    return;
  }
  if (nuevo.modo === 'vivo' && nuevo.estado === 'en_curso' && nuevo.pregunta_actual_index !== previo.pregunta_actual_index) {
    state.index = nuevo.pregunta_actual_index || 0;
    renderPreguntaVivo();
  }
}

function renderSalaEsperaAlumno() {
  limpiar(); anchoSheet(false);
  const c = state.concurso;
  app.innerHTML = `
    <h1>🕒 ${esc(c.titulo)}</h1>
    <p class="subtitle">${badgeModo(c.modo)} Hola, ${esc(state.participante.alias)}</p>
    <div class="card centro">
      <div class="spinner"></div>
      <p style="font-weight:800; margin:0 0 4px;">Ya estás dentro.</p>
      <p class="subtitle" style="margin:0;">Esperando a que el profesor inicie. No cierres esta pantalla.</p>
    </div>
    <button class="btn-link" id="salirBtn" style="width:100%;">Salir</button>
  `;
  $('salirBtn').onclick = salirTodo;
  escucharConcursoAlumno();
}

function cabeceraJuego() {
  return `<div class="cabecera-juego"><span class="chip-nombre">${esc(state.participante.alias)}</span><span class="chip" id="chipPuntos">⭐ ${state.puntos} pts</span></div>`;
}
function actualizarChipPuntos() { const el = $('chipPuntos'); if (el) el.textContent = `⭐ ${state.puntos} pts`; }

function htmlPregunta(p) {
  return `
    ${p.tema ? `<span class="tema">${esc(p.tema)}</span>` : ''}
    ${p.imagen_url ? `<img src="${esc(p.imagen_url)}" class="zoomable" title="Toca para ampliar">` : ''}
    <h2>${esc(p.enunciado)}</h2>
    <div id="opts"></div>
    <div class="feedback hidden" id="feedback"></div>`;
}

function mostrarFeedback(clase, texto) {
  const fb = $('feedback');
  if (!fb) return;
  fb.className = 'feedback ' + clase;
  fb.textContent = texto;
}

async function pintarOpciones(p, alResponder) {
  const { data: opciones } = await supabase.rpc('obtener_opciones_concurso', { p_concurso_id: state.concurso.id, p_pregunta_id: p.id });
  const opts = $('opts');
  if (!opts) return;
  const ya = state.respondidas.get(p.id);
  (opciones || []).forEach(o => {
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = o.texto;
    b.disabled = !!ya;
    b.onclick = async () => {
      if (state.relojPregunta) { clearInterval(state.relojPregunta); state.relojPregunta = null; }
      opts.querySelectorAll('button').forEach(x => x.disabled = true);
      b.classList.add('selected');
      const tiempoSeg = (Date.now() - state.inicioPregunta) / 1000;
      const { data, error } = await supabase.rpc('responder_concurso', {
        p_participante_id: state.participante.id, p_token: state.participante.token,
        p_pregunta_id: p.id, p_opcion_id: o.id, p_tiempo_seg: tiempoSeg
      });
      if (error || !data || !data.length) { mostrarFeedback('incorrect', 'No se pudo registrar tu respuesta. ' + (error ? error.message : '')); return; }
      const { es_correcta, texto_correcto } = data[0];
      b.classList.add(es_correcta ? 'correct' : 'incorrect');
      if (!es_correcta) opts.querySelectorAll('button').forEach(x => { if (x.textContent === texto_correcto) x.classList.add('correct'); });
      state.respondidas.set(p.id, { correcta: es_correcta });
      if (es_correcta) { state.aciertos++; state.puntos += Number(p.puntos || 1); }
      actualizarChipPuntos();
      mostrarFeedback(es_correcta ? 'correct' : 'incorrect', es_correcta ? `✅ ¡Correcto! +${Number(p.puntos || 1)} pts` : `❌ Incorrecto. Era: ${texto_correcto}`);
      decirEnVoz(es_correcta ? `Correcto. Es ${texto_correcto}` : `Incorrecto. Es ${texto_correcto}`);
      if (alResponder) alResponder();
    };
    opts.appendChild(b);
  });
  if (ya) mostrarFeedback('neutro', 'Ya respondiste esta pregunta.');
  activarZoomImagenes();
}

// ---------------- Modo en vivo ----------------
async function renderPreguntaVivo() {
  limpiar(); anchoSheet(false);
  const p = state.preguntas[state.index];
  if (!p) {
    app.innerHTML = `${cabeceraJuego()}<div class="card centro"><div class="spinner"></div><p style="font-weight:800;">¡Respondiste todo!</p><p class="subtitle" style="margin:0;">Esperando los resultados finales...</p></div>`;
    escucharConcursoAlumno(); return;
  }
  state.inicioPregunta = Date.now();
  const limite = state.concurso.tiempo_por_pregunta_seg;
  app.innerHTML = `
    ${cabeceraJuego()}
    <div class="fila-meta"><span class="subtitle" style="margin:0;">Pregunta ${state.index + 1} de ${state.preguntas.length}</span>${limite ? `<span class="reloj" id="reloj">${limite}</span>` : ''}</div>
    ${htmlPregunta(p)}
    <p class="subtitle hidden" id="esperaTexto" style="text-align:center;">Esperando a que el profesor pase a la siguiente pregunta...</p>
  `;
  escucharConcursoAlumno();
  await pintarOpciones(p, () => { const e = $('esperaTexto'); if (e) e.classList.remove('hidden'); });

  if (limite && !state.respondidas.has(p.id)) {
    let restante = limite;
    state.relojPregunta = agregarTimer(setInterval(() => {
      restante--;
      const r = $('reloj');
      if (r) { r.textContent = Math.max(0, restante); r.classList.toggle('urgente', restante <= 5); }
      if (restante <= 0) {
        clearInterval(state.relojPregunta); state.relojPregunta = null;
        document.querySelectorAll('#opts button').forEach(x => x.disabled = true);
        mostrarFeedback('incorrect', '⏰ Se acabó el tiempo para esta pregunta.');
        const e = $('esperaTexto'); if (e) e.classList.remove('hidden');
      }
    }, 1000));
  } else if (state.respondidas.has(p.id)) {
    const e = $('esperaTexto'); if (e) e.classList.remove('hidden');
  }
}

// ---------------- Modo por plazo ----------------
function renderPantallaEmpezarPlazo() {
  limpiar(); anchoSheet(false);
  if (state.participante.iniciado_en) { reanudarPlazo(); return; }
  const c = state.concurso;
  app.innerHTML = `
    <h1>⏱️ ${esc(c.titulo)}</h1>
    <p class="subtitle">${badgeModo(c.modo)} Hola, ${esc(state.participante.alias)}</p>
    <div class="stats">
      <div class="stat"><b>${state.preguntas.length}</b><span>Preguntas</span></div>
      <div class="stat"><b>${state.preguntas.reduce((a, p) => a + Number(p.puntos || 1), 0)}</b><span>Puntos</span></div>
      <div class="stat"><b>${c.tiempo_total_seg ? fmtSeg(c.tiempo_total_seg) : '∞'}</b><span>Tiempo</span></div>
    </div>
    <div class="aviso">Cuando pulses "Empezar" arranca tu cronómetro y no se puede pausar. Si se acaba el tiempo, se entrega automáticamente.</div>
    <button class="btn-primary" id="empezarBtn">▶ Empezar</button>
    <button class="btn-link" id="salirBtn" style="width:100%;">Salir</button>
  `;
  $('salirBtn').onclick = salirTodo;
  escucharConcursoAlumno();
  $('empezarBtn').onclick = async () => {
    $('empezarBtn').disabled = true;
    const { error } = await supabase.rpc('iniciar_concurso_participante', { p_participante_id: state.participante.id, p_token: state.participante.token });
    if (error) { $('empezarBtn').disabled = false; alert('No se pudo empezar: ' + error.message); return; }
    state.participante.iniciado_en = new Date().toISOString();
    state.participante.estado = 'en_curso';
    reanudarPlazo();
  };
}

function finPlazoMs() {
  const total = state.concurso.tiempo_total_seg;
  if (!total || !state.participante.iniciado_en) return null;
  return new Date(state.participante.iniciado_en).getTime() + total * 1000;
}

function reanudarPlazo() {
  state.index = state.preguntas.findIndex(p => !state.respondidas.has(p.id));
  if (state.index === -1) { finalizarConcursoAlumno(); return; }
  renderPreguntaPlazo();
}

async function renderPreguntaPlazo() {
  limpiar(); anchoSheet(false);
  const fin = finPlazoMs();
  if (fin && Date.now() >= fin) { finalizarConcursoAlumno(); return; }
  const p = state.preguntas[state.index];
  const respondidas = state.respondidas.size;
  state.inicioPregunta = Date.now();
  app.innerHTML = `
    ${cabeceraJuego()}
    <div class="fila-meta"><span class="subtitle" style="margin:0;">Pregunta ${respondidas + 1} de ${state.preguntas.length}</span>${fin ? `<span class="reloj" id="relojTotal">${fmtSeg((fin - Date.now()) / 1000)}</span>` : ''}</div>
    ${htmlPregunta(p)}
    <button class="btn-primary hidden" id="siguienteBtn">${respondidas + 1 >= state.preguntas.length ? '🏁 Finalizar' : 'Siguiente →'}</button>
  `;
  escucharConcursoAlumno();
  if (fin) {
    agregarTimer(setInterval(() => {
      const r = (fin - Date.now()) / 1000;
      const el = $('relojTotal');
      if (el) { el.textContent = fmtSeg(r); el.classList.toggle('urgente', r <= 30); }
      if (r <= 0) finalizarConcursoAlumno();
    }, 1000));
  }
  await pintarOpciones(p, () => { const s = $('siguienteBtn'); if (s) s.classList.remove('hidden'); });
  $('siguienteBtn').onclick = reanudarPlazo;
}

async function finalizarConcursoAlumno() {
  if (state.finalizando) return;
  state.finalizando = true;
  limpiar();
  const { data: total } = await supabase.rpc('finalizar_concurso_participante', { p_participante_id: state.participante.id, p_token: state.participante.token });
  state.participante.estado = 'finalizado';
  renderResultadoPersonal(total ?? state.puntos);
}

function renderResultadoPersonal(puntaje) {
  limpiar(); anchoSheet(false);
  const suma = state.preguntas.reduce((a, p) => a + Number(p.puntos || 1), 0);
  const pct = suma ? Math.round((puntaje / suma) * 100) : 0;
  app.innerHTML = `
    <div class="centro"><div style="font-size:54px;">${pct >= 90 ? '🏆' : pct >= 60 ? '🎉' : '💪'}</div></div>
    <h1 class="centro">¡Terminaste!</h1>
    <p class="subtitle centro">${esc(state.concurso.titulo)}</p>
    <div class="numero-grande">${puntaje} / ${suma}</div>
    <div class="stats">
      <div class="stat"><b>${state.aciertos}</b><span>Aciertos</span></div>
      <div class="stat"><b>${state.preguntas.length - state.aciertos}</b><span>Fallos</span></div>
      <div class="stat"><b>${pct}%</b><span>Logro</span></div>
    </div>
    <button class="btn-primary" id="verPosicionesBtn">🏆 Ver tabla de posiciones</button>
    <button class="btn-link" id="salirBtn" style="width:100%;">Volver al inicio</button>
  `;
  if (suma > 0 && puntaje === suma && window.confetti) confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
  $('verPosicionesBtn').onclick = renderTablaPosicionesAlumno;
  $('salirBtn').onclick = volverInicioAlumno;
}

function volverInicioAlumno() {
  if (state.grupoId && (state.estudiante || state.alias)) renderListaConcursosAlumno();
  else salirTodo();
}

async function renderTablaPosicionesAlumno() {
  limpiar(); anchoSheet(false);
  const c = state.concurso;
  const { data: parts } = await supabase.from('concurso_participantes')
    .select('id, alias, puntaje_total, tiempo_total_seg, estado')
    .eq('concurso_id', c.id).eq('estado', 'finalizado')
    .order('puntaje_total', { ascending: false })
    .order('tiempo_total_seg', { ascending: true, nullsFirst: false });
  const lista = parts || [];
  const miId = (state.participante && state.participante.id) || (leerPart(c.id) || {}).id;
  const miPos = lista.findIndex(p => p.id === miId) + 1;
  const sigueAbierto = c.estado !== 'finalizado';

  app.innerHTML = `
    <h1>🏆 Posiciones</h1>
    <p class="subtitle">${esc(c.titulo)}${sigueAbierto ? ' · todavía hay participantes respondiendo' : ''}</p>
    ${miPos ? `<div class="aviso" style="background:var(--primary-light); color:var(--primary);">Tu posición: ${miPos}° de ${lista.length}</div>` : ''}
    ${htmlPodio(lista)}
    <div id="resto"></div>
    ${sigueAbierto ? '<button class="btn-outline" id="actualizarBtn">🔄 Actualizar</button>' : ''}
    <button class="btn-link" id="salirBtn" style="width:100%;">Volver al inicio</button>
  `;
  const resto = $('resto');
  lista.forEach((p, i) => {
    if (i < 3) return;
    const div = document.createElement('div');
    div.className = 'fila-pos' + (p.id === miId ? ' yo' : '');
    div.innerHTML = `<span class="num">${i + 1}</span><span class="nombre">${esc(p.alias)}</span><span class="pts">${p.puntaje_total ?? 0} pts · ${fmtSeg(p.tiempo_total_seg)}</span>`;
    resto.appendChild(div);
  });
  if (!lista.length) resto.innerHTML = '<p class="subtitle centro">Todavía nadie ha terminado.</p>';
  if (miPos === 1 && window.confetti) confetti({ particleCount: 120, spread: 90, origin: { y: 0.5 } });
  if (sigueAbierto) $('actualizarBtn').onclick = renderTablaPosicionesAlumno;
  $('salirBtn').onclick = volverInicioAlumno;
}

function htmlPodio(lista) {
  if (!lista.length) return '';
  const lugar = (p, n) => p ? `<div class="lugar l${n}"><div class="nombre-podio">${esc(p.alias)}</div><div class="bloque">${n}°<br><span style="font-size:13px;">${p.puntaje_total ?? 0} pts</span></div></div>` : '<div class="lugar"></div>';
  return `<div class="podio">${lugar(lista[1], 2)}${lugar(lista[0], 1)}${lugar(lista[2], 3)}</div>`;
}
