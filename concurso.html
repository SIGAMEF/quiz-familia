async function renderProfesorHome() {
  limpiar(); anchoSheet(true);
  const { data: grupos } = await supabase.from('grupos').select('id, nombre').order('nombre');
  const lista = grupos || [];
  if (!state.grupoId || !lista.some(g => g.id === state.grupoId)) state.grupoId = lista[0] ? lista[0].id : null;
  app.innerHTML = `
    <div class="topbar"><h1>🏆 Concursos</h1><div><a href="admin.html" class="btn-link" style="margin-right:12px;">Panel</a><button class="btn-link" id="salirBtn">Salir</button></div></div>
    <p class="subtitle">${esc(state.perfil.usuario)}</p>
    <label>Grupo</label>
    <select id="grupoSelect">${lista.map(g => `<option value="${g.id}" ${g.id === state.grupoId ? 'selected' : ''}>${esc(g.nombre)}</option>`).join('') || '<option value="">No tienes grupos</option>'}</select>
    <button class="btn-primary" id="crearBtn">➕ Crear nuevo concurso</button>
    <div class="topbar" style="margin-top:22px;"><h2 style="margin:0;">Concursos de este grupo</h2><button class="btn-mini b-gray" id="refrescarBtn">🔄 Actualizar</button></div>
    <div id="listaConcursos"></div>
  `;
  $('salirBtn').onclick = salirTodo;
  $('grupoSelect').onchange = (e) => { state.grupoId = e.target.value; renderListaConcursosProfesor(); };
  $('crearBtn').onclick = renderCrearConcurso;
  $('refrescarBtn').onclick = renderListaConcursosProfesor;
  if (state.grupoId) renderListaConcursosProfesor();
}

function botonesAccion(c) {
  const b = [];
  b.push(`<button class="btn-mini b-primary" data-acc="gestionar" data-id="${c.id}">${c.estado === 'finalizado' ? '📊 Resultados' : '▶ Gestionar'}</button>`);
  b.push(`<button class="btn-mini b-gray" data-acc="editar" data-id="${c.id}">✏️ Editar</button>`);
  if (c.estado === 'armado') b.push(`<button class="btn-mini b-amber" data-acc="abrir" data-id="${c.id}">🚪 Abrir sala</button>`);
  if (c.estado === 'esperando') b.push(`<button class="btn-mini b-green" data-acc="iniciar" data-id="${c.id}">▶ Iniciar</button>`);
  if (c.estado === 'esperando' || c.estado === 'en_curso') b.push(`<button class="btn-mini b-red" data-acc="finalizar" data-id="${c.id}">⏹ Finalizar</button>`);
  if (c.estado === 'en_curso' || c.estado === 'finalizado') b.push(`<button class="btn-mini b-amber" data-acc="reiniciar" data-id="${c.id}">🔄 Jugar de nuevo</button>`);
  b.push(`<button class="btn-mini b-red" data-acc="eliminar" data-id="${c.id}">🗑️</button>`);
  return b.join('');
}

function conectarAcciones(contenedor, desde) {
  contenedor.querySelectorAll('[data-acc]').forEach(btn => {
    btn.onclick = () => ejecutarAccion(btn.dataset.acc, btn.dataset.id, desde);
  });
}

async function ejecutarAccion(acc, id, desde) {
  const volver = () => desde === 'lista' ? renderListaConcursosProfesor() : renderGestionarConcurso(id);
  if (acc === 'gestionar') return renderGestionarConcurso(id);
  if (acc === 'editar') return renderEditarConcurso(id);
  if (acc === 'abrir') {
    await supabase.from('concursos').update({ estado: 'esperando' }).eq('id', id);
    return renderGestionarConcurso(id);
  }
  if (acc === 'iniciar') {
    const { count } = await supabase.from('concurso_preguntas').select('id', { count: 'exact', head: true }).eq('concurso_id', id);
    if (!count) { alert('Este concurso no tiene preguntas. Agrégalas desde "Editar".'); return; }
    await supabase.from('concursos').update({ estado: 'en_curso', pregunta_actual_index: 0 }).eq('id', id);
    return renderGestionarConcurso(id);
  }
  if (acc === 'finalizar') {
    if (!confirm('¿Finalizar el concurso ahora? Se calculan los puntajes con lo que cada uno haya respondido hasta este momento.')) return;
    await terminarConcursoProfesor(id);
    return desde === 'lista' ? renderListaConcursosProfesor() : renderGestionarConcurso(id);
  }
  if (acc === 'reiniciar') {
    if (!confirm('¿Jugar de nuevo desde cero? Se borran todos los participantes y respuestas de esta partida. Las preguntas del concurso se mantienen.')) return;
    await supabase.from('concurso_participantes').delete().eq('concurso_id', id);
    await supabase.from('concursos').update({ estado: 'esperando', pregunta_actual_index: 0 }).eq('id', id);
    return renderGestionarConcurso(id);
  }
  if (acc === 'eliminar') {
    if (!confirm('¿Eliminar este concurso con todos sus resultados? Las preguntas del banco NO se borran.')) return;
    await supabase.from('concursos').delete().eq('id', id);
    return renderProfesorHome();
  }
  volver();
}

async function renderListaConcursosProfesor() {
  const cont = $('listaConcursos');
  if (!cont) return;
  cont.innerHTML = '<p class="subtitle">Cargando...</p>';
  const { data: concursos } = await supabase.from('concursos').select('id, titulo, modo, estado, tiempo_por_pregunta_seg, tiempo_total_seg').eq('grupo_id', state.grupoId).order('created_at', { ascending: false });
  const lista = concursos || [];
  if (!lista.length) { cont.innerHTML = '<p class="subtitle">Todavía no hay concursos en este grupo.</p>'; return; }
  const ids = lista.map(c => c.id);
  const { data: parts } = await supabase.from('concurso_participantes').select('concurso_id, estado').in('concurso_id', ids);
  const { data: cps } = await supabase.from('concurso_preguntas').select('concurso_id').in('concurso_id', ids);

  cont.innerHTML = lista.map(c => {
    const p = (parts || []).filter(x => x.concurso_id === c.id);
    const terminaron = p.filter(x => x.estado === 'finalizado').length;
    const nPreg = (cps || []).filter(x => x.concurso_id === c.id).length;
    const tiempo = c.modo === 'vivo' ? (c.tiempo_por_pregunta_seg ? `${c.tiempo_por_pregunta_seg}s por pregunta` : 'sin límite por pregunta') : (c.tiempo_total_seg ? `${fmtSeg(c.tiempo_total_seg)} en total` : 'sin límite de tiempo');
    return `<div class="item-lista">
      <div class="fila"><div><strong>${esc(c.titulo)}</strong><div class="meta">${badgeModo(c.modo)} ${badgeEstado(c.estado)}</div></div></div>
      <div class="meta">📝 ${nPreg} preguntas · ⏱️ ${tiempo} · 👥 ${p.length} participantes${p.length ? ` (${terminaron} terminaron)` : ''}</div>
      <div class="acciones">${botonesAccion(c)}</div>
    </div>`;
  }).join('');
  conectarAcciones(cont, 'lista');
}

// ---------------- Crear concurso ----------------
async function renderCrearConcurso() {
  limpiar(); anchoSheet(true);
  const { data: preguntas } = await supabase.from('preguntas').select('id, enunciado, tema').eq('grupo_id', state.grupoId).eq('tipo', 'opcion_unica').order('created_at', { ascending: false });
  const banco = preguntas || [];
  const temas = [...new Set(banco.map(p => p.tema || 'Repaso'))].sort();

  app.innerHTML = `
    <div class="topbar"><h1>Nuevo concurso</h1><button class="btn-link" id="volverBtn">← Volver</button></div>
    <p class="subtitle">Solo se usan preguntas de opción única. Cualquiera con el enlace o QR podrá unirse (con o sin cuenta).</p>
    <label>Título</label><input type="text" id="cTitulo" placeholder="Repaso general - física">
    <label>Modo</label>
    <select id="cModo">
      <option value="vivo">En vivo — tú controlas cuándo pasa cada pregunta</option>
      <option value="plazo">Por plazo — cada alumno a su ritmo con un tiempo total</option>
    </select>
    <div id="campoTiempoVivo"><label>Segundos por pregunta (vacío = sin límite)</label><input type="number" id="cTiempoPregunta" min="5" placeholder="Ej: 20"></div>
    <div id="campoTiempoPlazo" class="hidden"><label>Tiempo total del concurso en minutos (vacío = sin límite)</label><input type="number" id="cTiempoTotal" min="1" placeholder="Ej: 15"></div>
    <label>¿Cuántas preguntas en total?</label>
    <input type="number" id="cCantidadTotal" min="1" value="${Math.min(10, banco.length || 10)}">

    <div class="card">
      <h2>Preguntas del banco (${banco.length})</h2>
      <p class="subtitle" style="margin-bottom:6px;">Marca las que <b>sí o sí</b> deben aparecer. El resto hasta completar el total se elige al azar. Puedes subir los puntos de cualquier pregunta (por defecto 1).</p>
      <div class="barra-filtros">
        <input type="text" id="buscar" placeholder="🔍 Buscar palabras...">
        <select id="filtroTema"><option value="">Todos los temas</option>${temas.map(t => `<option>${esc(t)}</option>`).join('')}</select>
      </div>
      <div class="acciones"><button class="btn-mini b-gray" id="marcarVisibles">☑️ Marcar visibles</button><button class="btn-mini b-gray" id="desmarcarTodas">Desmarcar todas</button><span class="meta" id="contadorFijas" style="margin:auto 0;">0 fijas</span></div>
      <div class="scroll" id="listaBanco" style="margin-top:8px;"></div>
    </div>
    <button class="btn-primary" id="crearConcursoBtn">Crear concurso</button>
    <div class="error" id="err"></div>
  `;
  $('volverBtn').onclick = renderProfesorHome;
  $('cModo').onchange = (e) => {
    $('campoTiempoVivo').classList.toggle('hidden', e.target.value !== 'vivo');
    $('campoTiempoPlazo').classList.toggle('hidden', e.target.value !== 'plazo');
  };

  const listaEl = $('listaBanco');
  listaEl.innerHTML = banco.map(p => `
    <div class="check-row" data-texto="${esc((p.enunciado + ' ' + (p.tema || '')).toLowerCase())}" data-tema="${esc(p.tema || 'Repaso')}">
      <input type="checkbox" class="chkFija" value="${p.id}">
      <div class="texto">${esc(p.enunciado)}<div class="tema-mini">${esc(p.tema || 'Repaso')}</div></div>
      <input type="number" class="inpPuntos" data-id="${p.id}" value="1" min="1" title="Puntos">
    </div>`).join('') || '<p class="subtitle">Este grupo todavía no tiene preguntas de opción única.</p>';

  const contar = () => { $('contadorFijas').textContent = `${listaEl.querySelectorAll('.chkFija:checked').length} fijas`; };
  const filtrar = () => {
    const tk = tokensBusqueda($('buscar').value);
    const tema = $('filtroTema').value;
    listaEl.querySelectorAll('.check-row').forEach(r => {
      r.style.display = (coincide(r.dataset.texto, tk) && (!tema || r.dataset.tema === tema)) ? 'flex' : 'none';
    });
  };
  $('buscar').oninput = filtrar;
  $('filtroTema').onchange = filtrar;
  listaEl.addEventListener('change', contar);
  $('marcarVisibles').onclick = () => { listaEl.querySelectorAll('.check-row').forEach(r => { if (r.style.display !== 'none') r.querySelector('.chkFija').checked = true; }); contar(); };
  $('desmarcarTodas').onclick = () => { listaEl.querySelectorAll('.chkFija').forEach(c => c.checked = false); contar(); };

  $('crearConcursoBtn').onclick = async () => {
    const errEl = $('err');
    errEl.textContent = '';
    const titulo = $('cTitulo').value.trim();
    const modo = $('cModo').value;
    const cantidadTotal = parseInt($('cCantidadTotal').value, 10);
    const tiempoPregunta = parseInt($('cTiempoPregunta').value, 10) || null;
    const tiempoTotalMin = parseInt($('cTiempoTotal').value, 10) || null;
    if (!titulo) { errEl.textContent = 'Ponle un título al concurso.'; return; }
    if (!cantidadTotal || cantidadTotal < 1) { errEl.textContent = 'Indica cuántas preguntas quieres en total.'; return; }

    const fijasIds = Array.from(listaEl.querySelectorAll('.chkFija:checked')).map(c => c.value);
    if (fijasIds.length > cantidadTotal) { errEl.textContent = `Marcaste ${fijasIds.length} fijas, pero el total es ${cantidadTotal}. Sube el total o desmarca algunas.`; return; }
    const puntosPorId = {};
    listaEl.querySelectorAll('.inpPuntos').forEach(inp => { puntosPorId[inp.dataset.id] = Math.max(1, parseInt(inp.value, 10) || 1); });

    const fijasSet = new Set(fijasIds);
    const noFijas = banco.map(p => p.id).filter(id => !fijasSet.has(id));
    const necesarias = cantidadTotal - fijasIds.length;
    if (necesarias > noFijas.length) { errEl.textContent = `No alcanzan las preguntas: faltan ${necesarias - noFijas.length} para completar ${cantidadTotal}.`; return; }
    const idsFinal = [...fijasIds, ...barajar(noFijas).slice(0, necesarias)];

    $('crearConcursoBtn').disabled = true;
    const { data: concurso, error: errC } = await supabase.from('concursos').insert({
      grupo_id: state.grupoId, titulo, modo,
      tiempo_por_pregunta_seg: modo === 'vivo' ? tiempoPregunta : null,
      tiempo_total_seg: modo === 'plazo' && tiempoTotalMin ? tiempoTotalMin * 60 : null,
      permite_invitados: true, estado: 'armado', creado_por: state.perfil.id
    }).select('id').single();
    if (errC) { errEl.textContent = errC.message; $('crearConcursoBtn').disabled = false; return; }

    const filas = idsFinal.map((pid, i) => ({ concurso_id: concurso.id, pregunta_id: pid, es_fija: fijasSet.has(pid), puntos: puntosPorId[pid] || 1, orden: i + 1 }));
    const { error: errP } = await supabase.from('concurso_preguntas').insert(filas);
    if (errP) { errEl.textContent = 'Concurso creado, pero falló al guardar preguntas: ' + errP.message; return; }
    renderGestionarConcurso(concurso.id);
  };
}

// ---------------- Editar concurso ----------------
async function renderEditarConcurso(id) {
  limpiar(); anchoSheet(true);
  const { data: c } = await supabase.from('concursos').select('*').eq('id', id).single();
  state.grupoId = c.grupo_id;
  const { data: cpsData } = await supabase.from('concurso_preguntas').select('id, puntos, orden, pregunta_id, preguntas(enunciado, tema)').eq('concurso_id', id).order('orden');
  const cps = cpsData || [];
  const enConcurso = new Set(cps.map(x => x.pregunta_id));
  const { data: bancoData } = await supabase.from('preguntas').select('id, enunciado, tema').eq('grupo_id', c.grupo_id).eq('tipo', 'opcion_unica').order('created_at', { ascending: false });
  const disponibles = (bancoData || []).filter(p => !enConcurso.has(p.id));
  const temas = [...new Set(disponibles.map(p => p.tema || 'Repaso'))].sort();
  const sumaPts = cps.reduce((a, x) => a + Number(x.puntos || 1), 0);

  app.innerHTML = `
    <div class="topbar"><h1>✏️ Editar concurso</h1><button class="btn-link" id="volverBtn">← Volver</button></div>
    <p class="subtitle">${badgeModo(c.modo)} ${badgeEstado(c.estado)}</p>
    ${c.estado === 'en_curso' ? '<div class="aviso">El concurso está en curso. Puedes cambiar datos, pero agregar o quitar preguntas ahora puede desordenar a quienes ya están jugando. Lo ideal es finalizarlo antes.</div>' : ''}

    <div class="card">
      <h2>Datos</h2>
      <label>Título</label><input type="text" id="eTitulo" value="${esc(c.titulo)}">
      <label>Modo</label>
      <select id="eModo"><option value="vivo" ${c.modo === 'vivo' ? 'selected' : ''}>En vivo</option><option value="plazo" ${c.modo === 'plazo' ? 'selected' : ''}>Por plazo</option></select>
      <div id="eCampoVivo" class="${c.modo === 'vivo' ? '' : 'hidden'}"><label>Segundos por pregunta (vacío = sin límite)</label><input type="number" id="eTiempoPregunta" min="5" value="${c.tiempo_por_pregunta_seg || ''}"></div>
      <div id="eCampoPlazo" class="${c.modo === 'plazo' ? '' : 'hidden'}"><label>Tiempo total en minutos (vacío = sin límite)</label><input type="number" id="eTiempoTotal" min="1" value="${c.tiempo_total_seg ? Math.round(c.tiempo_total_seg / 60) : ''}"></div>
      <button class="btn-primary" id="guardarDatosBtn">💾 Guardar datos</button>
      <div class="error" id="errDatos"></div>
    </div>

    <div class="card">
      <h2>Preguntas del concurso (${cps.length} · ${sumaPts} pts)</h2>
      <p class="subtitle" style="margin-bottom:6px;">Cambia los puntos y se guardan solos.</p>
      <div class="scroll">
        <table>
          <tr><th>#</th><th>Pregunta</th><th>Pts</th><th></th></tr>
          ${cps.map((x, i) => `<tr>
            <td>${i + 1}</td>
            <td>${esc(x.preguntas ? x.preguntas.enunciado : '-')}<div class="tema-mini" style="font-size:11px; color:var(--ink-muted); font-weight:700;">${esc(x.preguntas ? (x.preguntas.tema || 'Repaso') : '')}</div></td>
            <td><input type="number" class="ePuntos" data-id="${x.id}" value="${x.puntos || 1}" min="1" style="width:64px; padding:6px 8px;"></td>
            <td><button class="btn-mini b-red eQuitar" data-id="${x.id}">Quitar</button></td>
          </tr>`).join('') || '<tr><td colspan="4" class="subtitle">Sin preguntas todavía.</td></tr>'}
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Agregar preguntas (${disponibles.length} disponibles)</h2>
      <div class="barra-filtros">
        <input type="text" id="eBuscar" placeholder="🔍 Buscar palabras...">
        <select id="eFiltroTema"><option value="">Todos los temas</option>${temas.map(t => `<option>${esc(t)}</option>`).join('')}</select>
      </div>
      <div class="acciones"><button class="btn-mini b-gray" id="eMarcarVisibles">☑️ Marcar visibles</button></div>
      <div class="scroll" id="eListaBanco" style="margin-top:8px;">
        ${disponibles.map(p => `<div class="check-row" data-texto="${esc((p.enunciado + ' ' + (p.tema || '')).toLowerCase())}" data-tema="${esc(p.tema || 'Repaso')}">
          <input type="checkbox" class="eChk" value="${p.id}"><div class="texto">${esc(p.enunciado)}<div class="tema-mini">${esc(p.tema || 'Repaso')}</div></div></div>`).join('') || '<p class="subtitle">No quedan preguntas del banco por agregar.</p>'}
      </div>
      <button class="btn-primary" id="eAgregarBtn">➕ Agregar marcadas</button>
      <div class="acciones" style="align-items:center;">
        <span class="meta" style="margin:0;">O agregar al azar:</span>
        <input type="number" id="eAzarCant" min="1" value="5" style="width:80px; padding:7px 10px;">
        <button class="btn-mini b-amber" id="eAzarBtn">🎲 Agregar al azar (del filtro actual)</button>
      </div>
      <div class="error" id="errAgregar"></div>
    </div>
  `;
  $('volverBtn').onclick = () => renderGestionarConcurso(id);
  $('eModo').onchange = (e) => {
    $('eCampoVivo').classList.toggle('hidden', e.target.value !== 'vivo');
    $('eCampoPlazo').classList.toggle('hidden', e.target.value !== 'plazo');
  };

  $('guardarDatosBtn').onclick = async () => {
    const titulo = $('eTitulo').value.trim();
    if (!titulo) { $('errDatos').textContent = 'El título no puede quedar vacío.'; return; }
    const modo = $('eModo').value;
    const tp = parseInt($('eTiempoPregunta').value, 10) || null;
    const tt = parseInt($('eTiempoTotal').value, 10) || null;
    const { error } = await supabase.from('concursos').update({
      titulo, modo,
      tiempo_por_pregunta_seg: modo === 'vivo' ? tp : null,
      tiempo_total_seg: modo === 'plazo' && tt ? tt * 60 : null
    }).eq('id', id);
    if (error) { $('errDatos').textContent = error.message; return; }
    $('errDatos').innerHTML = '<span class="ok-msg">✅ Guardado.</span>';
  };

  document.querySelectorAll('.ePuntos').forEach(inp => {
    inp.onchange = async () => {
      const v = Math.max(1, parseInt(inp.value, 10) || 1);
      inp.value = v;
      await supabase.from('concurso_preguntas').update({ puntos: v }).eq('id', inp.dataset.id);
    };
  });
  document.querySelectorAll('.eQuitar').forEach(btn => {
    btn.onclick = async () => {
      await supabase.from('concurso_preguntas').delete().eq('id', btn.dataset.id);
      renderEditarConcurso(id);
    };
  });

  const listaEl = $('eListaBanco');
  const visibles = () => Array.from(listaEl.querySelectorAll('.check-row')).filter(r => r.style.display !== 'none');
  const filtrar = () => {
    const tk = tokensBusqueda($('eBuscar').value);
    const tema = $('eFiltroTema').value;
    listaEl.querySelectorAll('.check-row').forEach(r => { r.style.display = (coincide(r.dataset.texto, tk) && (!tema || r.dataset.tema === tema)) ? 'flex' : 'none'; });
  };
  $('eBuscar').oninput = filtrar;
  $('eFiltroTema').onchange = filtrar;
  $('eMarcarVisibles').onclick = () => visibles().forEach(r => r.querySelector('.eChk').checked = true);

  const agregar = async (ids) => {
    if (!ids.length) { $('errAgregar').textContent = 'No hay preguntas para agregar.'; return; }
    const maxOrden = cps.reduce((m, x) => Math.max(m, x.orden || 0), 0);
    const filas = ids.map((pid, i) => ({ concurso_id: id, pregunta_id: pid, puntos: 1, orden: maxOrden + i + 1 }));
    const { error } = await supabase.from('concurso_preguntas').insert(filas);
    if (error) { $('errAgregar').textContent = error.message; return; }
    renderEditarConcurso(id);
  };
  $('eAgregarBtn').onclick = () => agregar(Array.from(listaEl.querySelectorAll('.eChk:checked')).map(c => c.value));
  $('eAzarBtn').onclick = () => {
    const n = parseInt($('eAzarCant').value, 10) || 0;
    const ids = visibles().map(r => r.querySelector('.eChk').value);
    if (n > ids.length) { $('errAgregar').textContent = `Solo hay ${ids.length} preguntas en el filtro actual.`; return; }
    agregar(barajar(ids).slice(0, n));
  };
}

// ---------------- Gestionar concurso ----------------
async function renderGestionarConcurso(id) {
  limpiar(); anchoSheet(true);
  const { data: c } = await supabase.from('concursos').select('*').eq('id', id).maybeSingle();
  if (!c) { renderProfesorHome(); return; }
  state.concurso = c;
  state.grupoId = c.grupo_id;
  const { data: cpsData } = await supabase.from('concurso_preguntas').select('id, puntos, orden, pregunta_id, preguntas(enunciado, tema)').eq('concurso_id', id).order('orden');
  const cps = cpsData || [];
  const sumaPts = cps.reduce((a, x) => a + Number(x.puntos || 1), 0);
  const tiempo = c.modo === 'vivo' ? (c.tiempo_por_pregunta_seg ? `${c.tiempo_por_pregunta_seg}s por pregunta` : 'sin límite por pregunta') : (c.tiempo_total_seg ? `${fmtSeg(c.tiempo_total_seg)} en total` : 'sin límite');

  app.innerHTML = `
    <div class="topbar"><h1>${esc(c.titulo)}</h1><button class="btn-link" id="volverBtn">← Volver</button></div>
    <p class="subtitle" style="margin-bottom:4px;">${badgeModo(c.modo)} ${badgeEstado(c.estado)}</p>
    <div class="meta">📝 ${cps.length} preguntas · ⭐ ${sumaPts} pts · ⏱️ ${tiempo}</div>
    <div class="acciones" id="accionesTop">${botonesAccion(c).replace(/data-acc="gestionar"[^>]*>[^<]*<\/button>/, 'style="display:none"></button>')}</div>
    <div id="panelEstado"></div>
  `;
  $('volverBtn').onclick = renderProfesorHome;
  conectarAcciones($('accionesTop'), 'gestionar');

  const panel = $('panelEstado');
  if (c.estado === 'armado') return panelBorrador(panel, c, cps);
  if (c.estado === 'esperando') return panelSalaEspera(panel, c);
  if (c.estado === 'en_curso' && c.modo === 'vivo') return panelVivo(panel, c, cps);
  if (c.estado === 'en_curso') return panelPlazo(panel, c, cps);
  if (c.estado === 'finalizado') return panelResultados(panel, c, cps);
}

function panelBorrador(panel, c, cps) {
  panel.innerHTML = `
    <div class="card">
      <h2>Borrador</h2>
      <p class="subtitle">Los alumnos todavía no lo ven. Revisa las preguntas y cuando estés listo, abre la sala.</p>
      <button class="btn-primary" id="abrirBtn">🚪 Abrir sala de espera</button>
    </div>
    <div class="card"><h2>Preguntas</h2><div class="scroll">${cps.map((x, i) => `<div class="check-row"><span class="meta" style="margin:0; width:24px;">${i + 1}</span><div class="texto">${esc(x.preguntas ? x.preguntas.enunciado : '-')}</div><span class="meta" style="margin:0;">${x.puntos} pt</span></div>`).join('') || '<p class="subtitle">Sin preguntas. Agrégalas con "Editar".</p>'}</div></div>`;
  $('abrirBtn').onclick = () => ejecutarAccion('abrir', c.id, 'gestionar');
}

function panelSalaEspera(panel, c) {
  panel.innerHTML = `
    <div class="card">
      <h2>🚪 Sala de espera</h2>
      <p class="subtitle">${c.modo === 'vivo' ? 'Cuando todos estén conectados, inicia. Tú controlas cuándo pasa cada pregunta.' : 'Al iniciar, cada uno podrá empezar cuando quiera; su cronómetro corre desde que pulsa "Empezar".'}</p>
      <div class="numero-grande" id="numConectados">0</div>
      <p class="subtitle centro" style="margin-top:-6px;">conectados</p>
      <div id="listaConectados" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
      <button class="btn-primary" id="iniciarBtn">▶ Iniciar concurso</button>
    </div>
    ${bloqueCompartirHtml()}`;
  activarBloqueCompartir(c.id);
  $('iniciarBtn').onclick = () => ejecutarAccion('iniciar', c.id, 'gestionar');
  const refrescar = async () => {
    const { data: parts } = await supabase.from('concurso_participantes').select('alias, estudiante_id').eq('concurso_id', c.id);
    const n = $('numConectados'); if (!n) return;
    n.textContent = (parts || []).length;
    $('listaConectados').innerHTML = (parts || []).map(p => `<span class="badge ${p.estudiante_id ? 'plazo' : 'armado'}" style="font-size:12.5px; padding:6px 10px;">👤 ${esc(p.alias)}</span>`).join('');
  };
  refrescar();
  agregarTimer(setInterval(refrescar, 3000));
}

async function datosEnVivo(concursoId) {
  const { data: parts } = await supabase.from('concurso_participantes').select('id, alias, estado, iniciado_en, puntaje_total, tiempo_total_seg, estudiante_id').eq('concurso_id', concursoId);
  const lista = parts || [];
  let resp = [];
  if (lista.length) {
    const { data } = await supabase.from('concurso_respuestas').select('participante_id, pregunta_id, es_correcta, puntos_obtenidos, tiempo_respuesta_seg').in('participante_id', lista.map(p => p.id));
    resp = data || [];
  }
  const porPart = {};
  lista.forEach(p => { porPart[p.id] = { ...p, puntos: 0, aciertos: 0, respondidas: 0, tiempo: 0 }; });
  resp.forEach(r => {
    const x = porPart[r.participante_id]; if (!x) return;
    x.respondidas++; x.puntos += Number(r.puntos_obtenidos || 0); x.tiempo += Number(r.tiempo_respuesta_seg || 0);
    if (r.es_correcta) x.aciertos++;
  });
  const ranking = Object.values(porPart).sort((a, b) => b.puntos - a.puntos || a.tiempo - b.tiempo);
  return { lista, resp, ranking };
}

async function panelVivo(panel, c, cps) {
  const idx = c.pregunta_actual_index || 0;
  const cp = cps[idx];
  if (!cp) { panel.innerHTML = '<div class="card"><p>No hay más preguntas.</p><button class="btn-primary" id="finBtn">🏁 Ver resultados</button></div>'; $('finBtn').onclick = async () => { await terminarConcursoProfesor(c.id); renderGestionarConcurso(c.id); }; return; }
  const esUltima = idx + 1 >= cps.length;
  const { data: opciones } = await supabase.from('opciones').select('texto, es_correcta, orden').eq('pregunta_id', cp.pregunta_id).order('orden');
  const limite = c.tiempo_por_pregunta_seg;

  panel.innerHTML = `
    <div class="card">
      <div class="fila-meta"><strong>Pregunta ${idx + 1} de ${cps.length}</strong>${limite ? `<span class="reloj" id="relojProf">${limite}</span>` : ''}</div>
      ${cp.preguntas && cp.preguntas.tema ? `<span class="tema">${esc(cp.preguntas.tema)}</span>` : ''}
      <h2>${esc(cp.preguntas ? cp.preguntas.enunciado : '')}</h2>
      ${(opciones || []).map(o => `<div class="op-prof" data-correcta="${o.es_correcta ? 1 : 0}">${esc(o.texto)}</div>`).join('')}
      <div class="acciones"><button class="btn-mini b-gray" id="revelarBtn">👁 Revelar respuesta</button><span class="meta" style="margin:auto 0;">⭐ ${cp.puntos} pt</span></div>
    </div>
    <div class="card">
      <div class="stats">
        <div class="stat"><b id="numResp">0</b><span>Respondieron</span></div>
        <div class="stat"><b id="numPart">0</b><span>Conectados</span></div>
        <div class="stat"><b id="numAcert">0</b><span>Acertaron</span></div>
      </div>
      <button class="btn-primary" id="siguienteBtn">${esUltima ? '🏁 Terminar y ver resultados' : 'Siguiente pregunta →'}</button>
    </div>
    <div class="card"><h2>Ranking parcial</h2><div id="rankParcial"></div></div>
    ${bloqueCompartirHtml()}`;
  activarBloqueCompartir(c.id);

  $('revelarBtn').onclick = () => panel.querySelectorAll('.op-prof[data-correcta="1"]').forEach(el => el.classList.add('revelada'));
  $('siguienteBtn').onclick = async () => {
    $('siguienteBtn').disabled = true;
    if (esUltima) { await terminarConcursoProfesor(c.id); }
    else { await supabase.from('concursos').update({ pregunta_actual_index: idx + 1 }).eq('id', c.id); }
    renderGestionarConcurso(c.id);
  };

  if (limite) {
    let restante = limite;
    agregarTimer(setInterval(() => {
      restante--;
      const r = $('relojProf');
      if (r) { r.textContent = Math.max(0, restante); r.classList.toggle('urgente', restante <= 5); }
    }, 1000));
  }

  const refrescar = async () => {
    const { lista, resp, ranking } = await datosEnVivo(c.id);
    if (!$('numResp')) return;
    const deEsta = resp.filter(r => r.pregunta_id === cp.pregunta_id);
    $('numResp').textContent = deEsta.length;
    $('numPart').textContent = lista.length;
    $('numAcert').textContent = deEsta.filter(r => r.es_correcta).length;
    $('rankParcial').innerHTML = ranking.slice(0, 10).map((p, i) => `<div class="fila-pos"><span class="num">${i + 1}</span><span class="nombre">${esc(p.alias)}</span><span class="pts">${p.puntos} pts</span></div>`).join('') || '<p class="subtitle">Aún sin respuestas.</p>';
  };
  refrescar();
  agregarTimer(setInterval(refrescar, 2500));
}

async function panelPlazo(panel, c, cps) {
  panel.innerHTML = `
    <div class="card">
      <h2>⏱️ En curso — cada uno a su ritmo</h2>
      <div class="stats">
        <div class="stat"><b id="sTotal">0</b><span>Participantes</span></div>
        <div class="stat"><b id="sJugando">0</b><span>Respondiendo</span></div>
        <div class="stat"><b id="sTerminaron">0</b><span>Terminaron</span></div>
      </div>
      <div class="scroll" style="margin-top:12px;"><table id="tablaPlazo"></table></div>
      <button class="btn-primary" id="terminarBtn" style="background:linear-gradient(135deg,#FF8FA9,#FF6F91);">⏹ Terminar para todos ahora</button>
    </div>
    ${bloqueCompartirHtml()}`;
  activarBloqueCompartir(c.id);
  $('terminarBtn').onclick = () => ejecutarAccion('finalizar', c.id, 'gestionar');

  const estadoTxt = { esperando: 'No empezó', en_curso: 'Respondiendo', finalizado: 'Terminó ✅' };
  const refrescar = async () => {
    const { lista, ranking } = await datosEnVivo(c.id);
    if (!$('tablaPlazo')) return;
    $('sTotal').textContent = lista.length;
    $('sJugando').textContent = lista.filter(p => p.estado === 'en_curso').length;
    $('sTerminaron').textContent = lista.filter(p => p.estado === 'finalizado').length;
    $('tablaPlazo').innerHTML = '<tr><th>#</th><th>Nombre</th><th>Estado</th><th>Avance</th><th>Puntos</th><th>Tiempo</th></tr>' +
      ranking.map((p, i) => {
        const t = p.estado === 'finalizado' ? p.tiempo_total_seg : (p.iniciado_en ? (Date.now() - new Date(p.iniciado_en).getTime()) / 1000 : null);
        return `<tr><td>${i + 1}</td><td>${esc(p.alias)}</td><td>${estadoTxt[p.estado] || p.estado}</td><td>${p.respondidas}/${cps.length}</td><td><b>${p.puntos}</b></td><td>${fmtSeg(t)}</td></tr>`;
      }).join('');
  };
  refrescar();
  agregarTimer(setInterval(refrescar, 3000));
}

async function panelResultados(panel, c, cps) {
  const { lista, ranking: _r } = await datosEnVivo(c.id);
  const { resp } = await datosEnVivo(c.id);
  const aciertosPor = {};
  resp.forEach(r => { if (r.es_correcta) aciertosPor[r.participante_id] = (aciertosPor[r.participante_id] || 0) + 1; });
  const finales = lista.filter(p => p.estado === 'finalizado')
    .sort((a, b) => (Number(b.puntaje_total) || 0) - (Number(a.puntaje_total) || 0) || ((a.tiempo_total_seg ?? 1e9) - (b.tiempo_total_seg ?? 1e9)));
  const sumaPts = cps.reduce((a, x) => a + Number(x.puntos || 1), 0);
  const promedio = finales.length ? (finales.reduce((a, p) => a + Number(p.puntaje_total || 0), 0) / finales.length).toFixed(1) : '0';
  const invitados = lista.filter(p => !p.estudiante_id).length;

  panel.innerHTML = `
    <div class="card">
      <h2>🏆 Resultados finales</h2>
      <div class="stats">
        <div class="stat"><b>${finales.length}</b><span>Participantes</span></div>
        <div class="stat"><b>${promedio}</b><span>Promedio / ${sumaPts}</span></div>
        <div class="stat"><b>${finales[0] ? (finales[0].puntaje_total ?? 0) : 0}</b><span>Mejor puntaje</span></div>
      </div>
      ${htmlPodio(finales)}
      <div class="scroll" style="margin-top:8px;">
        <table>
          <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Aciertos</th><th>%</th><th>Tiempo</th></tr>
          ${finales.map((p, i) => `<tr><td>${i + 1}</td><td>${esc(p.alias)}${p.estudiante_id ? '' : ' <span class="meta" style="display:inline;">(invitado)</span>'}</td><td><b>${p.puntaje_total ?? 0}</b></td><td>${aciertosPor[p.id] || 0}/${cps.length}</td><td>${sumaPts ? Math.round(((p.puntaje_total || 0) / sumaPts) * 100) : 0}%</td><td>${fmtSeg(p.tiempo_total_seg)}</td></tr>`).join('') || '<tr><td colspan="6" class="subtitle">Nadie participó.</td></tr>'}
        </table>
      </div>
      <div class="acciones">
        <button class="btn-mini b-primary" id="csvBtn">📥 Descargar Excel (CSV)</button>
        <button class="btn-mini b-amber" id="otraVezBtn">🔄 Jugar de nuevo</button>
        ${invitados ? `<button class="btn-mini b-red" id="eliminarInvitadosBtn">Eliminar ${invitados} invitados</button>` : ''}
      </div>
    </div>`;

  $('otraVezBtn').onclick = () => ejecutarAccion('reiniciar', c.id, 'gestionar');
  $('csvBtn').onclick = () => {
    const filas = [['Posición', 'Nombre', 'Tipo', 'Puntos', `Puntos posibles`, 'Aciertos', 'Preguntas', '%', 'Tiempo (seg)']];
    finales.forEach((p, i) => filas.push([i + 1, p.alias, p.estudiante_id ? 'Alumno' : 'Invitado', p.puntaje_total ?? 0, sumaPts, aciertosPor[p.id] || 0, cps.length, sumaPts ? Math.round(((p.puntaje_total || 0) / sumaPts) * 100) : 0, Math.round(p.tiempo_total_seg || 0)]));
    descargarCSV(`resultados_${c.titulo.replace(/[^a-z0-9]+/gi, '_')}.csv`, filas);
  };
  if (invitados) $('eliminarInvitadosBtn').onclick = async () => {
    if (!confirm(`¿Eliminar a los ${invitados} invitados de este concurso? Los alumnos con cuenta se mantienen.`)) return;
    await supabase.from('concurso_participantes').delete().eq('concurso_id', c.id).is('estudiante_id', null);
    renderGestionarConcurso(c.id);
  };
}

async function terminarConcursoProfesor(concursoId) {
  const { data: parts } = await supabase.from('concurso_participantes').select('id, estado').eq('concurso_id', concursoId);
  const pendientes = (parts || []).filter(p => p.estado !== 'finalizado');
  if (pendientes.length) {
    const { data: resp } = await supabase.from('concurso_respuestas').select('participante_id, puntos_obtenidos, tiempo_respuesta_seg').in('participante_id', pendientes.map(p => p.id));
    for (const p of pendientes) {
      const mias = (resp || []).filter(r => r.participante_id === p.id);
      const total = mias.reduce((a, r) => a + Number(r.puntos_obtenidos || 0), 0);
      const tiempo = mias.length ? mias.reduce((a, r) => a + Number(r.tiempo_respuesta_seg || 0), 0) : null;
      await supabase.from('concurso_participantes').update({ puntaje_total: total, tiempo_total_seg: tiempo, estado: 'finalizado', finalizado_en: new Date().toISOString() }).eq('id', p.id);
    }
  }
  await supabase.from('concursos').update({ estado: 'finalizado' }).eq('id', concursoId);
}

// ---------------- Compartir (enlace + QR) ----------------
function bloqueCompartirHtml() {
  return `
    <div class="card">
      <h2>📲 Invitar a unirse</h2>
      <p class="subtitle" style="margin-bottom:10px;">Cualquiera con este enlace o QR puede entrar, con cuenta o sin cuenta.</p>
      <div style="display:flex; gap:8px; align-items:center;">
        <input type="text" id="enlaceUnirse" readonly style="font-size:12.5px;">
        <button class="btn-mini b-amber" id="copiarEnlaceBtn" style="white-space:nowrap;">Copiar</button>
      </div>
      <div class="centro" style="margin-top:14px;"><div id="qrCanvas" style="display:inline-block;"></div></div>
      <div class="acciones" style="justify-content:center;"><button class="btn-mini b-gray" id="qrGrandeBtn">🔍 Mostrar QR grande (para proyectar)</button></div>
      <p class="ok-msg hidden centro" id="copiadoMsg">¡Enlace copiado!</p>
    </div>`;
}

function activarBloqueCompartir(concursoId) {
  const url = window.location.origin + window.location.pathname + '?unirse=' + concursoId;
  const input = $('enlaceUnirse');
  if (!input) return;
  input.value = url;
  $('copiarEnlaceBtn').onclick = async () => {
    try { await navigator.clipboard.writeText(url); } catch (e) { input.select(); document.execCommand('copy'); }
    const msg = $('copiadoMsg'); msg.classList.remove('hidden');
    setTimeout(() => msg.classList.add('hidden'), 2000);
  };
  if (window.QRCode) new QRCode($('qrCanvas'), { text: url, width: 170, height: 170 });
  else $('qrCanvas').textContent = 'No se pudo generar el QR, usa el enlace.';
  $('qrGrandeBtn').onclick = () => {
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `<div class="caja-qr"><h2 style="margin-bottom:12px;">${esc(state.concurso ? state.concurso.titulo : 'Únete')}</h2><div id="qrGrande"></div><p class="subtitle" style="margin:12px 0 0;">Escanea para unirte</p></div><button class="btn-mini b-gray">Cerrar</button>`;
    document.body.appendChild(ov);
    const lado = Math.min(window.innerWidth, window.innerHeight) * 0.6;
    if (window.QRCode) new QRCode(ov.querySelector('#qrGrande'), { text: url, width: lado, height: lado });
    ov.onclick = (e) => { if (e.target === ov || e.target.tagName === 'BUTTON') ov.remove(); };
  };
}
